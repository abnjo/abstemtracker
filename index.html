<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ab's stem manual</title>
<!-- KaTeX LaTeX Formula Rendering -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
<style>
:root {
  --bg: #f8f9fa;
  --bg-alt: #f1f3f5;
  --surface-1: #ffffff;
  --surface-2: #fcfdfe;
  --surface-3: #f1f3f5;
  --surface-inset: #e9ecef;
  --fg: #111111;
  --fg-muted: #555555;
  --border: #d0d7de;
  --border-dark: #1b1f24;
  --accent: #111111;
  --hl: #e9ecef;
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.09), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
  --status-c: #1b5e20;
  --status-w: #e65100;
  --status-x: #b71c1c;
  --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
[data-theme="dark"] {
  --bg: #090a0c;
  --bg-alt: #121518;
  --surface-1: #161b22;
  --surface-2: #1c2128;
  --surface-3: #21262d;
  --surface-inset: #0d1117;
  --fg: #e6edf3;
  --fg-muted: #8b949e;
  --border: #30363d;
  --border-dark: #e6edf3;
  --accent: #ffffff;
  --hl: #282e36;
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.5), 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 4px 8px rgba(0, 0, 0, 0.6), 0 2px 4px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 12px 24px rgba(0, 0, 0, 0.7), 0 4px 8px rgba(0, 0, 0, 0.5);
  --status-c: #4caf50;
  --status-w: #ff9800;
  --status-x: #f44336;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.5;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
a, .concept-link {
  color: var(--fg);
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
  font-weight: 600;
}
a:hover, .concept-link:hover { background: var(--hl); }
button, select, input, textarea {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--border-dark);
  padding: 4px 8px;
  outline: none;
}
button { cursor: pointer; font-weight: 600; }
button:hover, button.active { background: var(--fg); color: var(--bg); }
input[type="text"], input[type="date"], input[type="number"], select, textarea {
  border: 1px solid var(--border);
}
input:focus, select:focus, textarea:focus { border-color: var(--border-dark); }
table { width: 100%; border-collapse: collapse; margin: 8px 0 14px 0; font-size: 12px; }
th, td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
th { background: var(--bg-alt); font-family: var(--font-mono); font-weight: 700; }
h1, h2, h3, h4 { font-family: var(--font-mono); font-weight: 700; margin: 12px 0 6px 0; line-height: 1.25; }
h1 { font-size: 18px; border-bottom: 2px solid var(--border-dark); padding-bottom: 4px; }
h2 { font-size: 15px; border-bottom: 1px solid var(--border); padding-bottom: 3px; margin-top: 16px; }
h3 { font-size: 13px; margin-top: 12px; }
p, ul, ol { margin-bottom: 8px; }
ul, ol { padding-left: 18px; }
li { margin-bottom: 3px; }
code, pre, .math { font-family: var(--font-mono); background: var(--bg-alt); }
code, .math { padding: 1px 4px; border: 1px solid var(--border); font-size: 11.5px; }
pre { padding: 10px; border: 1px solid var(--border); overflow-x: auto; margin: 8px 0; font-size: 11.5px; white-space: pre-wrap; }
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 12px;
  border-bottom: 2px solid var(--border-dark);
  background: var(--bg);
  gap: 8px;
  flex-wrap: wrap;
}
.brand { font-family: var(--font-mono); font-size: 15px; font-weight: 700; letter-spacing: -0.5px; }
.nav-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.toolbar-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
#globalSearch { width: 210px; }
.workspace {
  flex: 1;
  display: grid;
  gap: 6px;
  background: var(--border-dark);
  overflow: hidden;
  height: calc(100vh - 76px);
  padding: 4px;
}
.workspace.panes-1 { gap: 0; background: transparent; padding: 0; }
.workspace.panes-2 { grid-template-columns: 1fr 1fr; }
.workspace.panes-3 { grid-template-columns: 1fr 1fr 1fr; }
.workspace.panes-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.pane {
  display: flex;
  flex-direction: column;
  border: 1.5px solid var(--border-dark);
  border-radius: 4px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  background: var(--bg);
}
.pane-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 5px 10px;
  background: var(--surface-3);
  border-bottom: 1.5px solid var(--border);
  font-family: var(--font-mono);
  font-size: 11px;
}
.pane-body {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}
.dash-grid {
  display: grid;
  grid-template-columns: 1.15fr 1fr 1fr;
  gap: 12px;
  height: 100%;
}
@media (max-width: 1100px) {
  .dash-grid { grid-template-columns: 1fr; height: auto; }
}
.box {
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 12px;
  margin-bottom: 12px;
  background: var(--surface-1);
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.15s ease, border-color 0.15s ease;
}
.box:hover {
  box-shadow: var(--shadow-md);
  border-color: var(--border-dark);
}
.box-header {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 11.5px;
  letter-spacing: 0.5px;
  background: var(--surface-3);
  padding: 6px 12px;
  margin: -12px -12px 10px -12px;
  border-bottom: 1px solid var(--border);
  border-top-left-radius: 4px;
  border-top-right-radius: 4px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.manual-hero-banner {
  border: 2px solid var(--border-dark);
  background: var(--fg);
  color: var(--bg);
  padding: 12px 14px;
  margin-bottom: 12px;
}
.manual-hero-banner h2 {
  color: var(--bg);
  border-bottom: 1px solid var(--bg);
  margin-top: 0;
  padding-bottom: 4px;
  font-size: 14px;
}
.manual-hero-banner p {
  color: var(--bg);
  margin-bottom: 6px;
  font-size: 12px;
}
.manual-hero-banner strong {
  color: var(--bg);
}
details.audit-drawer {
  border: 1.5px solid var(--border-dark);
  background: var(--bg-alt);
  padding: 8px 12px;
  margin-bottom: 12px;
}
details.audit-drawer summary {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 11.5px;
  cursor: pointer;
  user-select: none;
  outline: none;
}
details.audit-drawer[open] summary {
  border-bottom: 1px solid var(--border);
  padding-bottom: 6px;
  margin-bottom: 8px;
}
.manual-tabs {
  display: flex;
  gap: 4px;
  border-bottom: 2px solid var(--border-dark);
  margin: 10px 0 12px 0;
  flex-wrap: wrap;
}
.manual-tab-btn {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  padding: 5px 10px;
  border: 1px solid var(--border-dark);
  border-bottom: none;
  background: var(--bg-alt);
  cursor: pointer;
}
.manual-tab-btn:hover { background: var(--hl); }
.manual-tab-btn.active {
  background: var(--fg);
  color: var(--bg);
}
.manual-tab-panel { display: none; }
.manual-tab-panel.active { display: block; }
.tactical-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 10px;
  margin: 10px 0;
}
.tactical-card {
  border: 1px solid var(--border-dark);
  background: var(--bg);
  padding: 10px;
}
.tactical-card h4 {
  font-family: var(--font-mono);
  font-size: 12px;
  margin-top: 0;
  border-bottom: 1px solid var(--border);
  padding-bottom: 4px;
  margin-bottom: 6px;
}
.flow-container {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 8px 0;
}
.flow-node {
  border: 1px solid var(--border-dark);
  padding: 6px 8px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  background: var(--bg);
  position: relative;
  cursor: pointer;
}
.flow-node.active-gps {
  border: 2px solid var(--border-dark);
  background: var(--hl);
  font-weight: 700;
}
.flow-arrow {
  text-align: center;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg-muted);
  line-height: 1;
}
.gps-badge {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 1px 5px;
  border: 1px solid var(--border-dark);
  background: var(--fg);
  color: var(--bg);
  margin-left: 4px;
  font-weight: 700;
}
.diagram-flow {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin: 6px 0;
}
.diagram-phase-group {
  border: 1px solid var(--border);
  padding: 8px;
  background: var(--bg-alt);
  margin-bottom: 2px;
}
.diagram-phase-title {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  color: var(--fg-muted);
  text-transform: uppercase;
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}
.diagram-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 6px;
}
.diagram-block {
  border: 1.5px solid var(--border-dark);
  background: var(--bg);
  padding: 6px 8px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: transform 0.1s, box-shadow 0.1s;
}
.diagram-block:hover {
  background: var(--hl);
  transform: translateY(-1px);
}
.diagram-block.active-gps {
  border: 2px solid var(--border-dark);
  background: var(--fg);
  color: var(--bg);
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.diagram-block.active-gps .tag {
  background: var(--bg);
  color: var(--fg);
  border-color: var(--bg);
}
.diagram-block.active-gps .diagram-desc {
  color: var(--bg);
  opacity: 0.9;
}
.diagram-block.reset-node {
  border-color: var(--status-x);
}
.diagram-block.reset-node.active-gps {
  background: var(--status-x);
  color: #fff;
}
.diagram-arrow-down {
  text-align: center;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--fg-muted);
  padding: 3px 0;
  user-select: none;
}
.diagram-arrow-right {
  display: inline-flex;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--fg-muted);
  user-select: none;
}
.subject-filter-bar {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  align-items: center;
  margin: 6px 0;
}
.filter-pill {
  font-family: var(--font-mono);
  font-size: 10.5px;
  padding: 2px 6px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--fg);
  cursor: pointer;
}
.filter-pill:hover, .filter-pill.active {
  background: var(--fg);
  color: var(--bg);
  border-color: var(--border-dark);
  font-weight: 700;
}
.v-tree-root {
  text-align: center;
  padding: 6px 12px;
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 12px;
  border: 2px solid var(--border-dark);
  background: var(--bg-alt);
  display: inline-block;
}
.v-tree-branches {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 8px;
}
@media (max-width: 950px) {
  .v-tree-branches { grid-template-columns: 1fr; }
}
.v-tree-card {
  border: 1px solid var(--border-dark);
  background: var(--bg);
  padding: 8px;
  display: flex;
  flex-direction: column;
}
.v-tree-card-head {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 11.5px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 4px;
  margin-bottom: 6px;
}
.v-step-box {
  border: 1px solid var(--border);
  background: var(--bg-alt);
  padding: 6px 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  margin-bottom: 4px;
}
.v-step-box strong {
  display: block;
  margin-bottom: 2px;
}
.organic-tree-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 8px;
  margin-top: 8px;
}
.organic-step-node {
  border: 1px solid var(--border-dark);
  padding: 8px;
  background: var(--bg);
  font-family: var(--font-mono);
  font-size: 11px;
}
.organic-step-node .step-num {
  font-weight: 700;
  margin-bottom: 4px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.tag {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 1px 4px;
  border: 1px solid var(--border);
  background: var(--bg-alt);
  margin-right: 4px;
}
.flag-C { color: var(--status-c); border-color: var(--status-c); font-weight: 700; }
.flag-W { color: var(--status-w); border-color: var(--status-w); font-weight: 700; }
.flag-X { color: var(--status-x); border-color: var(--status-x); font-weight: 700; }
.progress-bar {
  width: 100%;
  height: 10px;
  border: 1px solid var(--border-dark);
  background: var(--bg-alt);
  margin: 4px 0;
}
.progress-fill {
  height: 100%;
  background: var(--fg);
  transition: width 0.2s;
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  font-family: var(--font-mono);
  font-size: 11px;
}
.cal-cell {
  border: 1px solid var(--border);
  min-height: 62px;
  padding: 3px;
  background: var(--bg);
}
.cal-cell.today { border: 2px solid var(--border-dark); }
.cal-date { font-weight: 700; font-size: 10px; margin-bottom: 2px; }
.cal-ev {
  font-size: 9.5px;
  padding: 1px 3px;
  border: 1px solid var(--border-dark);
  margin-bottom: 2px;
  background: var(--bg-alt);
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cal-ev.done { text-decoration: line-through; opacity: 0.5; }
.statusbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 12px;
  border-top: 1px solid var(--border-dark);
  background: var(--bg-alt);
  font-family: var(--font-mono);
  font-size: 11px;
}
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.modal {
  background: var(--bg);
  border: 2px solid var(--border-dark);
  width: 90%;
  max-width: 680px;
  max-height: 82vh;
  display: flex;
  flex-direction: column;
}
.modal-head {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border-dark);
  background: var(--bg-alt);
  font-family: var(--font-mono);
  font-weight: 700;
  display: flex;
  justify-content: space-between;
}
.modal-content { padding: 12px; overflow-y: auto; }
.flex-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.split-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 768px) { .split-2 { grid-template-columns: 1fr; } }
/* Timer Only & Practice Session Styles */
.timer-hero {
  border: 1.5px solid var(--border-dark);
  background: var(--surface-2);
  border-radius: 6px;
  box-shadow: var(--shadow-md);
  padding: 16px;
  text-align: center;
  margin-bottom: 12px;
}
.timer-big-display {
  font-family: var(--font-mono);
  font-size: 42px;
  font-weight: 700;
  letter-spacing: 2px;
  line-height: 1.1;
  margin: 8px 0;
}
.timer-sub-display {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--fg-muted);
}
.timer-btn-row {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 10px;
}
.timer-btn-lg {
  font-size: 13px;
  padding: 6px 16px;
  font-weight: 700;
  border-radius: 4px;
}
.omr-container {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 5px;
  box-shadow: var(--shadow-sm);
  background: var(--surface-1);
  max-height: 520px;
  overflow-y: auto;
}
.omr-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.omr-table th, .omr-table td {
  padding: 6px 8px;
  border: 1px solid var(--border);
  text-align: center;
  vertical-align: middle;
}
.omr-table th {
  background: var(--surface-3);
  position: sticky;
  top: 0;
  z-index: 2;
  font-family: var(--font-mono);
  font-size: 11px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
}
.omr-row:nth-child(even) { background: var(--surface-2); }
.omr-row:hover { background: var(--hl); }
.omr-row.active-q {
  background: var(--hl);
  border-left: 3px solid var(--fg);
}
.omr-bubble {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1.5px solid var(--border-dark);
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 11px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin: 0 2px;
  cursor: pointer;
  transition: all 0.1s ease;
  padding: 0;
}
.omr-bubble:hover {
  transform: scale(1.08);
  border-color: var(--fg);
}
.omr-bubble.selected {
  background: var(--fg);
  color: var(--bg);
  box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--fg);
}
.omr-bubble.auto-w {
  border-color: var(--status-w);
}
.delta-time-box {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-family: var(--font-mono);
  font-size: 11px;
  background: var(--bg-alt);
  padding: 2px 4px;
  border: 1px solid var(--border);
}
.delta-time-box input {
  width: 52px;
  text-align: center;
  border: 1px solid var(--border);
  padding: 1px 2px;
  font-size: 11px;
}
.btn-mini-step {
  padding: 1px 4px;
  font-size: 10px;
  line-height: 1;
}
.btn-flag-group {
  display: inline-flex;
  gap: 2px;
}
.btn-flag {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  padding: 2px 6px;
  border: 1px solid var(--border);
  background: var(--bg);
  cursor: pointer;
}
.btn-flag.active-c {
  background: var(--status-c);
  color: #fff;
  border-color: var(--status-c);
}
.btn-flag.active-w {
  background: var(--status-w);
  color: #fff;
  border-color: var(--status-w);
}
.btn-flag.active-x {
  background: var(--status-x);
  color: #fff;
  border-color: var(--status-x);
}
.sheet-tabs-bar {
  display: flex;
  gap: 4px;
  align-items: center;
  padding: 6px 0;
  border-bottom: 2px solid var(--border-dark);
  margin-bottom: 8px;
  overflow-x: auto;
}
.sheet-tab-btn {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 5px 12px;
  border: 1px solid var(--border);

function offsetDate(days, baseStr) {
  const d = baseStr ? new Date(baseStr + "T00:00:00") : new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function triggerMathRender(el) {
  if (typeof renderMathInElement !== "function") return;
  const target = el || document.body;
  renderMathInElement(target, {
    delimiters: [
      {left: '$$', right: '$$', display: true},
      {left: '\\[', right: '\\]', display: true},
      {left: '$', right: '$', display: false},
      {left: '\\(', right: '\\)', display: false}
    ],
    ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"],
    throwOnError: false
  });
}

function getSubjectList() {
  if (state.subjectOrder && state.subjectOrder.length === DEFAULT_SUBJECTS.length) {
    return state.subjectOrder;
  }
  return DEFAULT_SUBJECTS;
}

function moveSubjectOrder(subj, delta) {
  const list = [...getSubjectList()];
  const idx = list.indexOf(subj);
  if (idx < 0) return;
  const targetIdx = idx + delta;
  if (targetIdx < 0 || targetIdx >= list.length) return;
  list.splice(idx, 1);
  list.splice(targetIdx, 0, subj);
  state.subjectOrder = list;
  saveAllStorage();
  renderWorkspace();
}

function toggleSubjectReorderMode() {
  state.subjectReorderMode = !state.subjectReorderMode;
  renderWorkspace();
}

function setSubjectFilter(scope, subj) {
  if (scope === 'dash') state.filterSubjDash = subj;
  else if (scope === 'flow') state.filterSubjFlow = subj;
  else if (scope === 'tracker') state.filterSubjTracker = subj;
  renderWorkspace();
}

function getSubjectFilterHTML(scope, activeSubj) {
  const subjects = ["All", ...getSubjectList()];

}

function switchManualTab(tabKey) {
  state.activeManualPhase2Tab = tabKey;
  const btns = document.querySelectorAll('.manual-tab-btn');
  const panels = document.querySelectorAll('.manual-tab-panel');
  btns.forEach(b => {
    if (b.dataset.tab === tabKey) b.classList.add('active');
    else b.classList.remove('active');
  });
  panels.forEach(p => {
    if (p.id === 'panel-' + tabKey) p.classList.add('active');
    else p.classList.remove('active');
  });

}

function renderGPSFlowchart(ch, variant, viewType) {
  if (variant === "diagram") {
    return renderGPSFlowchartDiagram(ch, viewType);
  }
  return `
    <div class="flow-container">
      ${GPS_STAGES.map((s, idx) => `
        <div class="flow-node ${ch.stage === s.id ? "active-gps" : ""}" onclick="updateChapterStage('${ch.id}', ${s.id})" title="Click to reposition ${ch.name} to this stage">
          <div class="flex-row" style="justify-content:space-between;">
            <span>${s.name}</span>${ch.stage === s.id ? `<span class="gps-badge">GPS POINTER</span>` : `<span class="tag">${s.code}</span>`}
          </div>
          <div style="font-size:11px;color:var(--fg-muted);margin-top:2px;">${s.desc}</div>
        </div>
        ${idx < GPS_STAGES.length - 1 ? `<div class="flow-arrow">${idx === 8 ? "v (or branch if >30% error)" : "v"}</div>` : ""}
      `).join("")}
    </div>
  `;
}

function renderGPSFlowchartDiagram(ch, viewType) {
  const phases = [
    { title: "STAGE 0: SYLLABUS QUEUE", stages: [GPS_STAGES[0]] },
    { title: "DAY 0 ACQUISITION (PHASES 1, 2 & 3 — CAN SPAN 1 OR MORE DAYS)", stages: [GPS_STAGES[1], GPS_STAGES[2], GPS_STAGES[3], GPS_STAGES[4]] },
    { title: "PHASE 4: PARALLEL SPACED RETRIEVAL (D1 -> D3 -> D7 -> D21)", stages: [GPS_STAGES[5], GPS_STAGES[6], GPS_STAGES[7], GPS_STAGES[8]] },
    { title: "PHASE 4 RECOVERY: >30% MOCK ERROR RESET LOOP", stages: [GPS_STAGES[9]] }
  ];

  return `
    <div class="diagram-flow">
      ${phases.map((ph, pIdx) => `
        <div class="diagram-phase-group">
          <div class="diagram-phase-title">${ph.title}</div>
          <div class="diagram-grid">
            ${ph.stages.map(stg => renderDiagramStageBlock(ch, stg)).join("")}
          </div>
        </div>
        ${pIdx < phases.length - 1 ? `<div class="diagram-arrow-down">| v</div>` : ""}
      `).join("")}
    </div>
  `;
}

function renderDiagramStageBlock(ch, stg) {
  const isCurrent = ch.stage === stg.id;
  const isReset = stg.id === 9;
  return `
    <div class="diagram-block ${isCurrent ? "active-gps" : ""} ${isReset ? "reset-node" : ""}"

function buildAutoEvents() {
  const events = [];
  state.chapters.forEach(ch => {
    if (!ch.d0 || ch.stage === 0) return;
    const schedule = [
      { code: "D0", offset: 0, label: "D0: Learn, Drill & Cleanup", targetStage: 4 },
      { code: "D1", offset: 1, label: "D1: Cued Recall (15-20m)", targetStage: 5 },
      { code: "D3", offset: 3, label: "D3: Redo Queue + Timed PYQs (40-45m)", targetStage: 6 },
      { code: "D7", offset: 7, label: "D7: Targeted Error Redo (15-20m)", targetStage: 7 },
      { code: "D21", offset: 21, label: "D21: Mixed Multi-Chapter Mock (60-180m)", targetStage: 8 }
    ];
    if (ch.stage === 9) {
      schedule.push(
        { code: "RESET-D1", offset: 1, label: "RESET D1: Cued Recall (>30% Mock Error)", targetStage: 5 },
        { code: "RESET-D3", offset: 3, label: "RESET D3: Timed PYQ Re-Test", targetStage: 6 },
        { code: "RESET-D7", offset: 7, label: "RESET D7: Targeted Error Redo", targetStage: 7 }
      );
    }
    schedule.forEach(item => {
      const dateStr = offsetDate(item.offset, ch.d0);
      const evId = `${ch.id}_${item.code}_${dateStr}`;
      if (state.deletedEvents && state.deletedEvents[evId]) return;
      const autoDone = ch.stage >= item.targetStage && ch.stage !== 9;
      events.push({
        id: evId,
        chId: ch.id,
        chName: ch.name,
        subj: ch.subj,
        code: item.code,
        date: dateStr,
        label: item.label,
        targetStage: item.targetStage,
        done: Boolean(state.completedEvents[evId] || autoDone)
      });
    });
  });
  return events.sort((a, b) => a.date.localeCompare(b.date));
}

const DB_NAME = "abs_stem_manual_db";
const STORE_NAME = "app_state";

function openIDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) return reject("No IDB");
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e);
  });
}

async function saveAllStorage() {
  const json = JSON.stringify(state);
  try { localStorage.setItem("abs_stem_state", json); } catch (e) {}
  try {
    const compact = JSON.stringify({
      t: state.theme,
      p: state.paneCount,
      s: state.selectedChapterId,
      c: state.chapters.map(c => [c.id, c.stage, c.d0, c.acc])
    });
    document.cookie = "abs_stem_cookie=" + encodeURIComponent(compact) + "; max-age=31536000; path=/; SameSite=Lax";
  } catch (e) {}
  try {
    const db = await openIDB();
    const tx = db.transaction(STORE_NAME, "readwrite");
    tx.objectStore(STORE_NAME).put(state, "master");
  } catch (e) {}
  updateStatusBar();
}

async function loadAllStorage() {
  if (navigator.storage && navigator.storage.persist) {
    try { await navigator.storage.persist(); } catch (e) {}
  }
  let loaded = null;
  try {
    const db = await openIDB();
    loaded = await new Promise(res => {
      const tx = db.transaction(STORE_NAME, "readonly");
      const req = tx.objectStore(STORE_NAME).get("master");
      req.onsuccess = () => res(req.result);
      req.onerror = () => res(null);
    });
  } catch (e) {}
  if (!loaded) {
    try {
      const ls = localStorage.getItem("abs_stem_state");
      if (ls) loaded = JSON.parse(ls);
    } catch (e) {}
  }
  if (!loaded) {
    try {
      const match = document.cookie.match(/(?:^|;\s*)abs_stem_cookie=([^;]*)/);
      if (match) {
        const cData = JSON.parse(decodeURIComponent(match[1]));
        if (cData.t) state.theme = cData.t;
        if (cData.p) state.paneCount = cData.p;
        if (Array.isArray(cData.c)) {
          cData.c.forEach(([id, stg, d0, acc]) => {
            const target = state.chapters.find(x => x.id === id);
            if (target) { target.stage = stg; target.d0 = d0; target.acc = acc; }
          });
        }
      }
    } catch (e) {}
  } else {
    // Migration: If loaded data contains old dummy chapters or < 100 chapters, cleanly upgrade
    if (!loaded.chapters || loaded.chapters.length < 100 || loaded.chapters.some(c => c.d0 && c.wx && c.wx.includes("STP 22.7L"))) {
      loaded.chapters = JSON.parse(JSON.stringify(DEFAULT_CHAPTERS));
      loaded.completedEvents = {};

    }
    state = Object.assign({}, state, loaded);
    state.practiceSettings = Object.assign({
      exam: "NEET",

      enableAutoWThreshold: true,

        "Custom Drill": 120
      },
      pomodoroWorkMin: 25,
      pomodoroBreakMin: 5,
      useDynamicBreak: true
    }, state.practiceSettings || {});
    state.customMetadata = Object.assign({
      exams: ["JEE Advanced", "JEE Main", "NEET", "IAT / NEST", "Custom Drill"],
      books: ["Coaching Module", "NCERT Textbook", "HC Verma", "Cengage", "DC Pandey", "MS Chouhan", "PYQ 37-Year", "Reference Book"],

function updateStatusBar() {
  const today = offsetDate(0);
  const evs = buildAutoEvents();
  const dueToday = evs.filter(e => e.date === today && !e.done).length;
  const activeCount = state.chapters.filter(c => c.stage > 0 && c.stage < 8).length;
  const doneCount = state.chapters.filter(c => c.stage >= 4 && c.stage !== 9).length;
  const pct = state.chapters.length ? Math.round((doneCount / state.chapters.length) * 100) : 0;
  const el = document.getElementById("statsStatus");
  if (el) {
    el.textContent = `ACTIVE CHAPTERS: ${activeCount} | DUE TODAY (${today}): ${dueToday} | SYLLABUS D0+ DONE: ${doneCount}/${state.chapters.length} (${pct}%)`;
  }
}

    <!-- PART IV: THE 4-PHASE EXECUTION ENGINE -->
    <h2 id="sec-phase1">3. Phase 1: Chapter Entry, Orientation &amp; Baseline Capture (GPS Stage 1 — D0)</h2>
    <div class="box">
      <div class="box-header"><span>WHAT WE ARE DOING IN PHASE 1 &amp; HOW TO START A NEW CHAPTER</span><span class="tag">GPS STAGE 1</span></div>
      <p><strong>Goal:</strong> Install the chapter's vocabulary, visual models, and structural skeleton so the textbook and PYQs do not look like alien hieroglyphics. You execute Phase 1 during <strong>Block 2</strong> of your day on your single active <code>D0</code> chapter.</p>
      
      <h4>Step 1.1 — Choose Your Entry Path by Chapter Type</h4>
      <ul>
        <li><strong>Path A — Logic-Heavy (Physics, Math, PChem), Hybrid (Organic), &amp; Conceptual Bio/Inorganic (Genetics, Biotech, Coordination):</strong> Open your chosen video lecture (full ground-up playlist if it is a <strong>Root Chapter</strong> and your baseline is weak; 2–4 hour macro lecture if it is a <strong>Derivative Chapter</strong>). <em>(If your baseline is already strong, skip the video and go straight to Phase 2 Step 1).</em></li>
        <li><strong>Path B — Purely Descriptive Biology &amp; Inorganic (Morphology, Anatomy, Ecology, p/d/f-Block facts):</strong> <strong>Do NOT watch video lectures.</strong> Open your physical NCERT book and Chapter PYQ book directly and jump straight to <strong>Phase 2, Protocol B (NCERT 4-Pass Method)</strong>.</li>
      </ul>

      <h4>Step 1.2 — How to Execute During the Lecture (Two-Column Workspace)</h4>
      <ul>
        <li><strong>Divide your page or tablet vertically into two columns:</strong>
          <ul>
            <li><strong>Left Column (Disposable Scratchpad):</strong> Work out algebra alongside the teacher and trace curved electron arrows in real time. <strong>Rule:</strong> When the teacher spends 20 minutes solving 5 repetitive board drill questions, <strong>put your pen down and just watch</strong> how they set up the governing equation.</li>
            <li><strong>Right Column (Draft Skeleton &amp; API):</strong> Record only headings, core formulas, variable definitions, mandatory units, and traps using the <strong>4 Anti-Bloat Rules</strong>: (1) Keyword breadcrumbs only—never write full grammatical sentences, (2) Use mathematical operators ($\\rightarrow, \\implies, \\therefore, \\propto, \\uparrow, \\downarrow$), (3) Capture only the conceptual pivot, (4) Keep the column physically narrow.</li>
          </ul>
        </li>
        <li><strong>The 3-Item Derivation Filter:</strong> Never transcribe 15 lines of intermediate derivation algebra. Record only: (1) Starting Law &amp; Valid Physical Assumption, (2) Final Equation with required SI units &amp; sign rules, and (3) Final Proportionality ($\\propto$).</li>
        <li><strong>The 15–30 Minute Video Bailout Gate:</strong> If a video makes no sense after 15 minutes, drop playback speed to $1\\times$ and trace actively on paper for up to 30 minutes. If the instructor is still skipping foundational steps you do not know, close the video immediately and switch to a ground-up playlist or reverse-engineer the textbook's Solved Examples.</li>
      </ul>

      <h4>Step 1.3 — Phase 1 Exit Check: The 15-Minute Unsolved Question Vocabulary Scan</h4>
      <p>Immediately after finishing the lecture (or today's lecture chunk), close the video, open your coaching module or PYQ book to the <strong>unsolved exercises</strong>, and spend <strong>15 minutes strictly reading the question stems without solving them</strong>. Confirm that you recognize the technical nouns (e.g., <em>"molarity," "limiting reagent," "hyperconjugation," "paraxial rays"</em>) and can mentally map each question to a heading in your Right Column. Once confirmed, move to <strong>Phase 2</strong>.</p>
    </div>

    <div class="manual-tab-panel ${activeTab === "logic" ? "active" : ""}" id="panel-logic">
      <div class="box">
        <div class="box-header"><span>PROTOCOL A: LOGIC-HEAVY (PHYSICS, MATH, PHYSICAL CHEMISTRY)</span><span class="tag">FORMULA API</span></div>
        <ol>
          <li><strong>Step 1 — Cross-Check Module Formula Summary (2–5 Mins) Before Solving Problems:</strong>
            <p style="margin:4px 0;"><strong>If coming from a Phase 1 Lecture:</strong> Compare your Right-Column lecture notes against the printed Summary/Formula page at the back of your textbook/coaching module so zero special-case formulas or constants are missed, then compile your Obsidian Chapter API Table and discard your rough scratchpad.</p>
            <p style="margin:4px 0;"><strong>If skipping the lecture (Direct Book Entry):</strong> Skip Page 1 theory prose, flip straight to the printed Summary/Formula sheet at the end of the textbook chapter to initialize your Obsidian API Table, and then proceed to Phase 3 Solved Examples.</p>
          </li>
          <li><strong>4-Symbol Margin Scalpel:</strong> When reading textbook/PDF, mark only:
            <ul>
              <li><code>[ ]</code> <strong>Box:</strong> Box the starting governing equation only (never intermediate algebra).</li>
              <li><code>↑ ↓ → ⟹</code> <strong>Margin Shorthand:</strong> Note variable relationships in the margin ($r \\downarrow \\implies v \\uparrow$).</li>
              <li><code>[*]</code> <strong>Star:</strong> Mark the exact sentence where a key assumption or substitution trick is stated.</li>
              <li><strong>Wiring Arrows:</strong> Draw arrows linking a cause phrase directly to an effect phrase.</li>
            </ul>
          </li>
          <li><strong>Built-In Obsidian Formula API Table:</strong> Record equations with units, valid conditions, and limits:
            <table>
              <thead>
                <tr><th>Concept / Target</th><th>Formula (LaTeX)</th><th>Variables &amp; Mandatory Units</th><th>Valid When (Assumptions)</th><th>Limits (0 / Max / Prop) &amp; Exam Traps</th></tr>
              </thead>
              <tbody>
                <tr>
                  <td><strong>Ideal Gas Law</strong></td>
                  <td>$$PV = nRT$$</td>
                  <td>$P$: Pa or atm, $V$: m$^3$ or L, $n$: mol, $T$: K (Kelvin strictly)</td>
                  <td>Low $P$, high $T$ (non-interacting point particles).</td>
                  <td><strong>Trap (R Units &amp; STP):</strong> Modern IUPAC STP ($1\\text{ bar}, 273.15\\text{ K}$) $\\implies 22.7\\text{ L/mol}$; Old STP ($1\\text{ atm}, 273.15\\text{ K}$) $\\implies 22.4\\text{ L/mol}$. Use $R=8.314$ with Pa$\\cdot$m$^3$; $R=0.0821$ with L$\\cdot$atm.</td>
                </tr>
                <tr>
                  <td><strong>Isothermal Reversible Work</strong></td>
                  <td>$$w_{\\text{rev}} = -2.303 nRT \\log_{10}\\left(\\frac{V_2}{V_1}\\right)$$</td>
                  <td>$w$: Joules (J), $V_1, V_2$: same volume units, $T$: K</td>
                  <td>Ideal gas; isothermal ($\\Delta T = 0 \\implies \\Delta U = 0$); reversible path.</td>
                  <td><strong>Sign Trap:</strong> In Chemistry (IUPAC), expansion ($V_2 > V_1$) is negative ($w < 0$). In Physics, expansion work is positive ($W > 0$). Free expansion in vacuum ($P_{\\text{ext}} = 0 \\implies w = 0$).</td>
                </tr>
                <tr>
                  <td><strong>Spherical Mirror Formula</strong></td>
                  <td>$$\\frac{1}{v} + \\frac{1}{u} = \\frac{1}{f}$$</td>
                  <td>$u$: Object dist, $v$: Image dist, $f$: Focal length ($R/2$)</td>
                  <td>Paraxial rays (small aperture); measured from pole $P$.</td>
                  <td><strong>Sign Trap:</strong> Incident light direction $= +$. Real object $u < 0$. Concave mirror $f < 0$; Convex mirror $f > 0$. Never pre-insert a sign for the unknown variable being solved.</td>
                </tr>
                <tr>
                  <td><strong>Magnetic Lorentz Force</strong></td>
                  <td>$$F = |q|vB \\sin\\theta$$</td>
                  <td>$F$: N, $q$: C, $v$: m/s, $B$: Tesla (T), $\\theta$: angle between $\\vec{v}$ and $\\vec{B}$</td>
                  <td>Moving point charge in magnetic field $\\vec{B}$.</td>
                  <td><strong>Zero Limit:</strong> $F = 0$ if $v = 0$ or $\\theta = 0^\\circ/180^\\circ$. <strong>Max Limit:</strong> $F_{\\text{max}} = |q|vB$ at $\\theta = 90^\\circ$. <strong>Zero-Work Trap:</strong> Since $\\vec{F} \\perp \\vec{v}$, magnetic force does zero work ($W = 0$) and cannot alter kinetic energy.</td>
                </tr>
                <tr>
                  <td><strong>Molarity ($M$)</strong></td>
                  <td>$$M = \\frac{n_{\\text{solute}}}{V_{\\text{solution (L)}}}$$</td>
                  <td>$n$: mol, $V$: Liters (L) of total solution</td>
                  <td>Homogeneous solution.</td>
                  <td><strong>Trap 1:</strong> Temperature-dependent ($V \\propto T \\implies M$ decreases when heated). <strong>Trap 2:</strong> Denominator is L of total solution, NOT kg of solvent (Molality $m$).</td>
                </tr>
              </tbody>
            </table>
          </li>
          <li><strong>3 Limit &amp; Edge-Case Checks:</strong> For every formula, check: (a) What drives it to $0$? (b) What drives it to Max or $\\infty$? (c) What is the proportionality scaling when constants are held?</li>
        </ol>
      </div>
    </div>

    <h2 id="sec-p3-drilling">5. Phase 3: Drilling, Flagging, Algorithm Tracing &amp; D0 Exit Gate (GPS Stages 2, 3 &amp; 4)</h2>
    <div class="box">
      <div class="box-header"><span>STEP-BY-STEP D0 PROBLEM DRILLING &amp; DEBUGGING ENGINE</span><span class="tag">GPS STAGES 2–4</span></div>
      <p><strong>What We Are Doing in Phase 3:</strong> Building a formula table does not mean you can solve MCQs in 90 seconds. In Phase 3—with your Obsidian Chapter API Table open beside you—you drill through two specific <code>D0</code> question buckets (<strong>Set A: In-Chapter Worked Examples</strong> &rarr; <strong>Set B: Module Drills &amp; Older PYQs</strong>) until you pass the <code>D0</code> Exit Gate (<code>GPS Stage 4</code>).</p>

      <h4>Step 3.1 — Practice Set A: The 30 / 70 In-Chapter Worked Example Split (GPS Stage 2: D0_P3_EX)</h4>
      <ul>
        <li><strong>First 20–30% of Worked Examples (Uncovered Trace):</strong> Keep the printed solution uncovered. Read it line-by-line like code: (1) Identify given input variables and hidden English conditions (e.g., <em>"starts from rest"</em> $\\implies u=0$), (2) Identify which formula from your Obsidian API Table bridges inputs to output, and (3) Spot any sign convention or unit trap. <em>If a new constraint appears that wasn't in your lecture, add it to your Obsidian API Table immediately.</em></li>
        <li><strong>Remaining 70% of Worked Examples (Covered Attempt):</strong> Cover the solution with paper and solve from scratch on your Left Scratchpad under a timer. Grade every single attempt immediately using the <strong>Universal Flagging System (<code>[C]</code>, <code>[W]</code>, <code>[X]</code>)</strong> below.</li>
        <li><strong>Short-Chapter Exception (&lt;6 Worked Examples):</strong> If a chapter has fewer than 6 worked examples total, read all of them once uncovered, close the book, and re-solve all of them from scratch on blank paper.</li>
      </ul>

      <h4>Step 3.2 — Grade Every Attempt Immediately: The Decoupled <code>[C]</code> / <code>[W]</code> / <code>[X]</code> Flags</h4>
      <p>Apply these three flags to every worked example (in Set A), module drill (in Set B), and PYQ you attempt:</p>
      <ul>
        <li><span class="tag flag-C">[C] Confirmed</span> <strong>Solved 100% correctly, optimal method, under target exam time</strong> ($\\le 90\\text{s}$ NEET; $\\le 2\\text{m}$ JEE/IAT). <em>Action:</em> Do nothing. Ignore until <code>D21</code> cumulative mixed mocks.</li>
        <li><span class="tag flag-W">[W] Weak (Speed Pipeline)</span> <strong>Correct answer, BUT slow, used ugly brute-force algebra, hesitated, or guessed 50/50.</strong> <em>Immediate D0 Action:</em> <strong>Zero Anki and Zero YouTube.</strong> Inspect the printed solution, write a 1-line shortcut or 1-2-3 Problem Recipe in Obsidian, and add the Question ID to your <strong><code>[W]</code> Speed-Drill Queue</strong> (to be re-tested under a strict stopwatch on <code>D3</code>).</li>
        <li><span class="tag flag-X">[X] Blocked (Penalty Pipeline)</span> <strong>Wrong answer, went completely blank, or fell for a sign/unit/constraint trap.</strong> <em>Immediate D0 Action:</em> Run the <strong>2-Minute Unblocking Ladder</strong> below, apply the <strong>Post-Practice Error Diagnosis Matrix</strong> (create an Anki card TODAY if you forgot a fact/sign rule, or write a 5-Line Fix in Obsidian TODAY if you misunderstood a concept/constraint), and log the Question ID in your <strong><code>[X]</code> Penalty Queue</strong> (must pass cold on <strong>both <code>D3</code> and <code>D7</code></strong>).</li>
      </ul>

      <h4>Step 3.3 — When Stuck &gt;2 Minutes: The 2-Minute Unblocking Ladder &amp; Solution Autopsy</h4>
      <ol>
        <li><strong>30s Self-Check:</strong> Check your scratchpad against your Obsidian API Table for dropped minus signs, arithmetic slips, or missed unit conversions ($\\text{cm} \\rightarrow \\text{m}$, $^\\circ\\text{C} \\rightarrow \\text{K}$, $\\text{bar} \\rightarrow \\text{Pa}$).</li>
        <li><strong>60s Solution Autopsy (For "Unknown Unknowns"):</strong> Competitive exams never test 10 minutes of ugly manual calculus. If your algebra turns into a multi-page mess, stop brute-forcing immediately and open the printed solution. Ignore the numbers and scan the text strictly for <strong>Capitalized or Italicized Method Nouns</strong> (e.g., <em>"By Nodal Analysis"</em>, <em>"Using Concept of Negative Mass"</em>, <em>"Applying Lami's Theorem"</em>, <em>"By Method of Images"</em>).</li>
        <li><strong>5–10m YouTube Debugger Cap:</strong> If the printed solution skips steps, search that exact method noun + <code>"short trick"</code> on YouTube. Watch one 5-to-10-minute problem execution clip, write a <strong>1-2-3 Problem Recipe</strong> in Obsidian, close YouTube immediately, and re-solve the question. (If still stuck after 10 minutes, mark <code>[X]</code>, park it, and move on).</li>
      </ol>

      <h4>Procedural Algorithm Tracing: 3 Built-In 1-2-3 Problem Recipes</h4>
      <div class="box" style="background:var(--bg-alt);">
        <strong>Recipe 1: Kirchhoff Nodal Analysis (x-Method for Circuits)</strong>
        <ol>
          <li>Find junction connecting most branches; label its potential $x$.</li>
          <li>Label clean bottom reference wire (ground) as $0\\text{ V}$.</li>
          <li>Label known node voltages using connected batteries.</li>
          <li>Assume node $x$ is highest potential and solve KCL in one line:
            $$\\frac{x - V_1}{R_1} + \\frac{x - V_2}{R_2} + \\frac{x - V_3}{R_3} = 0$$
          </li>
        </ol>
      </div>
      <div class="box" style="background:var(--bg-alt);">
        <strong>Recipe 2: Pulley Constraint Equations</strong>
        <ol>
          <li>Pick fixed reference line (ceiling/ground); mark positions ($x_1, x_2, x_p$) or tensions ($T$) along movable string segments.</li>
          <li>Use zero net virtual work ($\\sum \\vec{T} \\cdot \\vec{a} = 0$) or differentiate constant length ($\\sum x_i = L \\implies \\sum a_i = 0$).</li>
          <li>For standard movable pulley with two hanging blocks:
            $$\\vec{a}_p = \\frac{\\vec{a}_1 + \\vec{a}_2}{2} \\iff a_1 + a_2 = 2a_p$$
          </li>
        </ol>
      </div>
      <div class="box" style="background:var(--bg-alt);">
        <strong>Recipe 3: Cavity Center-of-Mass ("Negative Mass" Shortcut)</strong>
        <ol>
          <li>Treat original uncut object as Mass 1 ($M_1 = +M$) at center $C_1 = (X_1, Y_1)$.</li>
          <li>Treat cut-out cavity as superimposed negative mass ($M_2 = -m$, where $m \\propto r^3$ for 3D spheres [$r=R/2 \\implies m=M/8$] and $m \\propto r^2$ for 2D discs [$r=R/2 \\implies m=M/4$]) at cavity center $C_2 = (X_2, Y_2)$.</li>
          <li>Plug directly into 2-body formula:
            $$X_{\\text{com}} = \\frac{M_1 X_1 - |M_2| X_2}{M_1 - |M_2|}$$
          </li>
        </ol>
      </div>

      <h4>Step 3.4 — Practice Set B: Unsolved Module Drills &amp; The D0 PYQ Exit Gate (GPS Stage 3 &rarr; Stage 4)</h4>
      <p>After finishing the worked examples (Set A), move to the unsolved questions at the back of your module and PYQ book. <strong>How PYQs are split between Day 0 and Day 3:</strong></p>
      <ul>
        <li><strong>Tier 1 — Topic-Wise Module Drills (Executed on <code>D0</code>, GPS Stage 3):</strong> Solve <strong>20–30 Level-1 / Topic-wise coaching module questions</strong> in Physics/Math/Chem (or <strong>40–50 NCERT-based MCQs</strong> in Biology) to build tool-selection speed.</li>
        <li><strong>Tier 2 — The <code>D0</code> Timed PYQ Gate (Older PYQs Executed on <code>D0</code>, GPS Stage 3):</strong> Take <strong>15–20 older Chapter PYQs</strong> (e.g., from 5–10 years ago) and solve them under a strict exam stopwatch ($\\le 90\\text{s}$ NEET; $\\le 2\\text{m}$ JEE).</li>
        <li><strong>Tier 3 — The <code>D3</code> Unseen PYQ Reserve (Recent PYQs Saved Strictly for Day 3):</strong> Hold back the <strong>most recent 3–5 years of Chapter PYQs (20–30 questions)</strong> completely untouched on <code>D0</code>. You will use this unseen reserve 3 days later on <strong><code>D3</code> (Phase 4)</strong> to test true retention after a 72-hour memory gap.</li>

    <!-- PART V & VI: FOCUS ARCHITECTURE & EXAM HALL TACTICAL META-GAME -->
    <h2 id="sec-focus">7. Focus Architecture &amp; Exam Hall Tactical Meta-Game</h2>
    <div class="tactical-grid">
      <div class="tactical-card">
        <h4>The Later Queue Parking Pad</h4>
        <p>Keep a sticky note labeled <strong>Later Queue</strong>. When an urge hits mid-block to check an obscure exception or tweak settings, write it down and check only after the block ends.</p>
      </div>
      <div class="tactical-card">
        <h4>The 3-Outlier Acceptance Rule</h4>
        <p>Every paper contains 2-3 obscure outlier questions. Deliberately accept skipping them to lock in 100% mastery of the 95% predictable high-yield syllabus.</p>
      </div>
      <div class="tactical-card">
        <h4>Sensory Lockdown &amp; Sleep Floor</h4>
        <p>Clear your desk of all books except your active chapter. Enforce a <strong>6.5 to 7 hour non-negotiable sleep floor</strong>—synaptic memory consolidation happens during sleep.</p>
      </div>
      <div class="tactical-card">
        <h4>5-Second Fact Cutoff (Bio &amp; Inorganic)</h4>
        <p>If a pure fact does not come to mind within 3-5 seconds, skip or mark it immediately. Staring cannot manufacture memory and steals calculation time from Physics.</p>
      </div>
      <div class="tactical-card">
        <h4>Unit Matching &amp; Limit Elimination</h4>
        <p>Check dimensions of options before long algebra. Plug extreme limits ($\\theta = 0^\\circ, m_1 = m_2, r \\rightarrow \\infty$) into options to eliminate impossible formulas in 15 seconds.</p>
      </div>
      <div class="tactical-card">
        <h4>Two-Pass Sweep &amp; Zero Negative Marks</h4>
        <p><strong>Pass 1:</strong> Sweep entire paper solving only immediate [C] kills (facts, 1-step formulas). <strong>Pass 2:</strong> Solve [W] calculation problems. Leaving an unknown blank costs 0; guessing costs -1.</p>
      </div>
    </div>

function getCalendarHTML() {
  const evs = buildAutoEvents();
  const todayStr = offsetDate(0);
  const viewDate = new Date();
  viewDate.setDate(1);
  viewDate.setMonth(viewDate.getMonth() + (state.calMonthOffset || 0));
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const monthName = viewDate.toLocaleString("en-US", { month: "long", year: "numeric" });
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  let cells = "";
  ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].forEach(d => {
    cells += `<div style="font-weight:700;text-align:center;padding:4px;background:var(--bg-alt);border:1px solid var(--border);">${d}</div>`;
  });
  for (let i = 0; i < firstDow; i++) {
    cells += `<div class="cal-cell" style="opacity:0.35;"></div>`;
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const dStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const dayEvs = evs.filter(e => e.date === dStr);
    cells += `
      <div class="cal-cell ${dStr === todayStr ? "today" : ""}">
        <div class="cal-date">${d} ${dStr === todayStr ? "[TODAY]" : ""}</div>
        ${dayEvs.map(e => `
          <div class="cal-ev ${e.done ? "done" : ""}" title="${e.chName}: ${e.label} (Click to toggle complete)" onclick="toggleEventDone('${e.id}', '${e.chId}', ${e.targetStage})">
            [${e.code}] ${e.chName}
          </div>
        `).join("")}
      </div>`;
  }

  return `
  <div>
    <h1>Auto-Scheduled Spaced Retrieval Calendar (D0 / D1 / D3 / D7 / D21)</h1>
    <p>Whenever a chapter reaches <strong>Stage 4 (D0 Complete)</strong> or has a D0 date assigned, its <code>D1 (+1d)</code>, <code>D3 (+3d)</code>, <code>D7 (+7d)</code>, and <code>D21 (+21d)</code> reviews are automatically scheduled below.</p>
    
    <div class="box">
      <div class="box-header flex-row" style="justify-content:space-between;">
        <div class="flex-row">
          <button onclick="shiftCalMonth(-1)">&lt; Prev Month</button>
          <span><strong>${monthName.toUpperCase()}</strong></span>
          <button onclick="shiftCalMonth(1)">Next Month &gt;</button>
          <button onclick="shiftCalMonth(0, true)">Today (${todayStr})</button>
        </div>
        <div class="flex-row">
          <button onclick="clearPastEvents()">Clear Past Events (&lt; Today)</button>
          <button onclick="resetCalendarMarkings()">Reset Markings to Chapter Status</button>
          <button onclick="clearAllScheduledDates()">Clear All Scheduled Dates</button>
        </div>
      </div>
      <div class="cal-grid">${cells}</div>
    </div>

    <div class="box">
      <div class="box-header flex-row" style="justify-content:space-between;">
        <span>SCHEDULED EXECUTION QUEUE (TOTAL: ${evs.length})</span>
        <span class="tag">${evs.filter(e => e.date === todayStr && !e.done).length} DUE TODAY</span>
      </div>
      <table>
        <thead>
          <tr><th>Date</th><th>Stage</th><th>Subject</th><th>Chapter</th><th>Protocol</th><th>Status</th><th>Action</th></tr>
        </thead>
        <tbody>
          ${evs.length === 0 ? `<tr><td colspan="7" style="text-align:center;color:var(--fg-muted);">No scheduled dates set yet. Mark any chapter D0 Complete in the Tracker to auto-schedule.</td></tr>` :
            evs.map(e => `
              <tr>
                <td><strong>${e.date}</strong>${e.date === todayStr ? `<span class="gps-badge">TODAY</span>` : ""}</td>
                <td><span class="tag">${e.code}</span></td>
                <td>${e.subj}</td>
                <td>${e.chName}</td>
                <td>${e.label}</td>
                <td>
                  <button onclick="toggleEventDone('${e.id}', '${e.chId}', ${e.targetStage})">
                    ${e.done ? "COMPLETED [UNDO]" : "MARK DONE"}
                  </button>
                </td>
                <td>
                  <button style="padding:2px 5px;" onclick="deleteCalendarEvent('${e.id}')">Delete</button>
                </td>
              </tr>
            `).join("")}
        </tbody>
      </table>
    </div>
  </div>`;
}

function getMiniCalendarHTML(evs, todayStr) {
  const d = new Date();
  const year = d.getFullYear();
  const month = d.getMonth();
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  let cells = "";
  ["S", "M", "T", "W", "T", "F", "S"].forEach(day => {
    cells += `<div style="font-weight:700;text-align:center;padding:2px;font-size:10px;background:var(--bg-alt);">${day}</div>`;
  });
  for (let i = 0; i < firstDow; i++) {
    cells += `<div style="opacity:0.25;min-height:22px;"></div>`;
  }
  for (let day = 1; day <= daysInMonth; day++) {
    const dStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    const count = evs.filter(e => e.date === dStr).length;
    const isToday = dStr === todayStr;
    cells += `
      <div style="border:1px solid var(--border);${isToday ? "border:2px solid var(--border-dark);font-weight:700;" : ""}padding:2px;min-height:24px;background:${count ? "var(--hl)" : "transparent"};font-size:10px;cursor:pointer;" onclick="switchTab('calendar')">
        ${day}${count ? `<span style="float:right;font-size:8.5px;">[${count}]</span>` : ""}
      </div>`;
  }
  return `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;font-family:var(--font-mono);">${cells}</div>`;
}

// --- AUDIO & TTS ENGINE ---
class AudioTTSEngine {
  constructor() {
    this.audioCtx = null;
    this.cachedVoices = [];
    this.worker = null;
    this.wakeLock = null;
    this.bgAudio = null;
    this.lastDispatchedDeltaSec = -1;
    this.lastDispatchedFullSec = -1;
    this.init();
  }

  init() {
    // Silent MP3 loop for background audio persistence on Android/Chrome
    const silentMp3 = 'data:audio/mpeg;base64,SUQzBAAAAAABEVRYWFgAAAAtAAADY29tbWVudABCaWdTb3VuZEJhbmsuY29tIC8gSWxhbSBNdWxhbW92//vQxAADEaD1wQkAAAA8AAAAA//uQZAUAB1WI0PZugAAAAAoQwAAAEk3nRdHqAAAAACiDgAAAAAAABCMyBQAAAAP///z1lZD///////z/8AA8AAAgAA///4A8D/w//4QA///D/wAA8AA/A==';
    try {
      this.bgAudio = new Audio(silentMp3);
      this.bgAudio.loop = true;
      this.bgAudio.volume = 0.01;
    } catch (e) {}

    if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
      const updateVoices = () => { this.cachedVoices = window.speechSynthesis.getVoices(); };
      window.speechSynthesis.onvoiceschanged = updateVoices;
      updateVoices();
    }

    try {
      if (typeof Worker !== 'undefined' && typeof Blob !== 'undefined' && typeof URL !== 'undefined') {
        const workerCode = `
          let timer;
          self.onmessage = function(e) {
            if (e.data === 'start') {
              if (timer) clearInterval(timer);
              timer = setInterval(() => self.postMessage('tick'), 50);
            } else if (e.data === 'stop') {
              if (timer) clearInterval(timer);
            }
          };
        `;
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        this.worker = new Worker(URL.createObjectURL(blob));
        this.worker.onmessage = () => onGlobalTimerTick();
      }
    } catch (e) {
      console.warn("Timer worker fallback:", e);
    }
  }

  startWorker() {
    if (this.worker) this.worker.postMessage('start');
  }

  stopWorker() {
    if (this.worker) this.worker.postMessage('stop');
  }

  ensureAudio() {
    try {
      if (!this.audioCtx && typeof window !== 'undefined') {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) this.audioCtx = new AudioContextClass();
      }
      if (this.audioCtx && this.audioCtx.state === 'suspended') {
        this.audioCtx.resume();
      }
      if (this.bgAudio) {
        this.bgAudio.play().catch(() => {});
      }
      if (typeof navigator !== 'undefined' && 'mediaSession' in navigator) {
        navigator.mediaSession.playbackState = 'playing';
      }
      this.requestWakeLock();
    } catch (e) {}
  }

  pauseAudio() {
    try {
      if (this.bgAudio) this.bgAudio.pause();
      if (typeof navigator !== 'undefined' && 'mediaSession' in navigator) {
        navigator.mediaSession.playbackState = 'paused';
      }
      this.releaseWakeLock();
      if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    } catch (e) {}
  }

  async requestWakeLock() {
    if (typeof navigator !== 'undefined' && 'wakeLock' in navigator) {
      try { this.wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    }
  }

  releaseWakeLock() {
    if (this.wakeLock) {
      try { this.wakeLock.release(); } catch (e) {}
      this.wakeLock = null;
    }
  }

  playSyntheticBeep() {
    try {
      this.ensureAudio();
      if (!this.audioCtx) return;
      const osc = this.audioCtx.createOscillator();
      const gainNode = this.audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, this.audioCtx.currentTime); // 880Hz (A5)
      gainNode.gain.setValueAtTime(0, this.audioCtx.currentTime);
      gainNode.gain.linearRampToValueAtTime(0.4, this.audioCtx.currentTime + 0.01);
      gainNode.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.15);
      osc.connect(gainNode);
      gainNode.connect(this.audioCtx.destination);
      osc.start(this.audioCtx.currentTime);
      osc.stop(this.audioCtx.currentTime + 0.15);
    } catch (e) {}
  }

  playTripleBeep() {
    this.playSyntheticBeep();
    setTimeout(() => this.playSyntheticBeep(), 200);
    setTimeout(() => this.playSyntheticBeep(), 400);
  }

  speak(text, rate = 1.15, voiceURI = "") {
    if (typeof window === 'undefined' || !('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = rate || 1.15;
      if (this.cachedVoices.length > 0) {
        if (voiceURI) {
          const v = this.cachedVoices.find(x => x.voiceURI === voiceURI);
          if (v) utterance.voice = v;
        }
        if (!utterance.voice) {
          utterance.voice = this.cachedVoices.find(v => v.lang.includes('en')) || this.cachedVoices[0];
        }
      }
      window.speechSynthesis.speak(utterance);
    } catch (e) {}
  }

  formatSpokenTime(totalSec) {
    totalSec = Math.round(totalSec);
    if (totalSec < 60) return `${totalSec} seconds`;
    const mins = Math.floor(totalSec / 60);
    const secs = totalSec % 60;
    if (secs === 0) return `${mins} ${mins === 1 ? 'minute' : 'minutes'}`;
    return `${mins} ${mins === 1 ? 'minute' : 'minutes'} ${secs}`;
  }
}

const appAudioTTS = new AudioTTSEngine();

// Formatting helpers
function formatHMS(ms) {
  if (ms < 0) ms = 0;
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const pad = n => n.toString().padStart(2, '0');
  return `${pad(h)}:${pad(m)}:${pad(s)}`;
}

function formatMS(ms) {
  if (ms < 0) ms = 0;
  const totalSec = Math.floor(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  const pad = n => n.toString().padStart(2, '0');
  return `${pad(m)}:${pad(s)}`;
}

function parseIntervalsStr(str) {
  if (!str) return [];
  return str.split(',')
    .map(x => parseInt(x.trim()))
    .filter(n => !isNaN(n) && n > 0);
}

// --- TIMER ACTIVE RUNTIME STATE ---
let activeTimerState = {
  type: null, // "practice" or "timer_only"
  sessionId: null,
  sheetIndex: 0,
  startTime: 0,
  accumulatedSessionMs: 0,
  isRunning: false,
  timerOnlyStart: 0,
  timerOnlyAccumulated: 0,
  timerOnlyLapStartSec: 0,
  timerOnlyLapNudgeSec: 0,
  timerOnlyRunning: false,
  timerOnlyCompleted: false,
  // Pomodoro runtime
  breakStartTime: 0,
  breakDurationMs: 0,
  breakAccumulatedMs: 0,
  breakRunning: false
};

function onGlobalTimerTick() {
  const now = Date.now();

  // 1. Practice Session Timer Tick (Synchronized Second Phase)
  if (activeTimerState.isRunning && activeTimerState.type === "practice") {
    const session = state.sessions ? state.sessions.find(s => s.id === activeTimerState.sessionId) : null;
    if (!session) return;
    const sheet = session.sheets[activeTimerState.sheetIndex];
    if (!sheet) return;

    const sessionElapsed = (now - activeTimerState.startTime) + activeTimerState.accumulatedSessionMs;
    sheet.elapsedSessionMs = sessionElapsed;
    const sessionSec = Math.floor(sessionElapsed / 1000);

    // Synchronized delta calculation:
    // deltaSec derives directly from sessionSec, guaranteeing identical millisecond second rollover!
    const deltaSec = Math.max(0, sessionSec - (sheet.questionStartSessionSec || 0) + (sheet.nudgeDeltaSec || 0));
    sheet.currentDeltaSec = deltaSec;
    sheet.currentDeltaMs = deltaSec * 1000;

    // High performance DOM update - both tick at the exact same millisecond
    const sessDisp = document.getElementById("practiceSessionTimerDisp");
    if (sessDisp) sessDisp.textContent = formatHMS(sessionSec * 1000);
    const deltaDisp = document.getElementById("practiceDeltaTimerDisp");
    if (deltaDisp) deltaDisp.textContent = formatMS(deltaSec * 1000);

    // Delta TTS & Beeps
    const ttsMode = sheet.ttsMode || state.practiceSettings.ttsMode || "delta";
    const deltaIntervals = parseIntervalsStr(sheet.deltaIntervals || state.practiceSettings.deltaIntervals);
    if ((ttsMode === "delta" || ttsMode === "mixed") && deltaIntervals.includes(deltaSec)) {
      if (appAudioTTS.lastDispatchedDeltaSec !== deltaSec) {
        appAudioTTS.lastDispatchedDeltaSec = deltaSec;
        if (sheet.enableBeeps !== false) appAudioTTS.playSyntheticBeep();
        if (sheet.enableSpeech !== false) {
          appAudioTTS.speak(appAudioTTS.formatSpokenTime(deltaSec), state.practiceSettings.speechRate, state.practiceSettings.speechVoice);
        }
      }
    }

    // Full Session TTS
    const fullIntervals = parseIntervalsStr(sheet.fullIntervals || state.practiceSettings.fullIntervals);
    if ((ttsMode === "full" || ttsMode === "mixed") && fullIntervals.includes(sessionSec)) {
      if (appAudioTTS.lastDispatchedFullSec !== sessionSec) {
        appAudioTTS.lastDispatchedFullSec = sessionSec;
        if (sheet.enableSpeech !== false) {
          appAudioTTS.speak(`Session ${appAudioTTS.formatSpokenTime(sessionSec)}`, state.practiceSettings.speechRate, state.practiceSettings.speechVoice);
        }
      }
    }

    // Auto-[W] Threshold Detection (Line 34)
    const thresholdSec = sheet.thresholdSec || state.practiceSettings.defaultThresholdSec || 90;
    if (sheet.enableAutoWThreshold !== false && deltaSec >= thresholdSec) {
      const activeQ = sheet.questions[sheet.activeQuestionIndex || 0];
      if (activeQ && !activeQ.flag && !activeQ.flagOverridden) {
        activeQ.flag = "W";
        const flagBadge = document.getElementById(`flag_badge_${activeQ.qNum}`);
        if (flagBadge) {
          flagBadge.innerHTML = `<span class="tag" style="background:var(--status-w);color:#fff;">[W] AUTO</span>`;
        }
      }
    }
  }

  // 2. Timer Only Tick (Synchronized Second Phase)
  const tState = state.timerOnly || {};
  const timerMode = tState.mode || "stopwatch";

  // Pomodoro Break countdown running
  if (activeTimerState.breakRunning) {
    const breakElapsed = (now - activeTimerState.breakStartTime) + activeTimerState.breakAccumulatedMs;
    const remainingMs = Math.max(0, activeTimerState.breakDurationMs - breakElapsed);
    const remainingSec = Math.ceil(remainingMs / 1000);

    const bigDisp = document.getElementById("timerOnlyBigDisp");
    if (bigDisp) bigDisp.textContent = formatMS(remainingSec * 1000);
    const lapDisp = document.getElementById("timerOnlyLapDisp");
    if (lapDisp) lapDisp.textContent = `Break Countdown (Remaining: ${formatMS(remainingSec * 1000)})`;

    if (remainingMs === 0 && !activeTimerState.timerOnlyCompleted) {
      activeTimerState.timerOnlyCompleted = true;
      activeTimerState.breakRunning = false;
      appAudioTTS.playTripleBeep();
      appAudioTTS.speak("Break time is over! Resume your study session.", tState.speechRate, tState.speechVoice);
      renderWorkspace();
    }
    return;
  }

  if (activeTimerState.timerOnlyRunning) {
    const elapsed = (now - activeTimerState.timerOnlyStart) + activeTimerState.timerOnlyAccumulated;
    const sessionSec = Math.floor(elapsed / 1000);
    const lapSec = Math.max(0, sessionSec - (activeTimerState.timerOnlyLapStartSec || 0) + (activeTimerState.timerOnlyLapNudgeSec || 0));

    let dispMs = sessionSec * 1000;
    if (timerMode === "timer") {
      const targetSec = tState.targetDurationSec || 3600;
      const remainSec = Math.max(0, targetSec - sessionSec);
      dispMs = remainSec * 1000;
      if (remainSec === 0 && !activeTimerState.timerOnlyCompleted) {
        activeTimerState.timerOnlyCompleted = true;
        appAudioTTS.playTripleBeep();
        appAudioTTS.speak("Countdown timer finished! Session complete.", tState.speechRate, tState.speechVoice);
      }
    } else if (timerMode === "pomodoro") {
      const pomodoroStudySec = tState.pomodoroStudySec || 1500;
      if (sessionSec >= pomodoroStudySec && !activeTimerState.timerOnlyCompleted) {
        activeTimerState.timerOnlyCompleted = true;
        appAudioTTS.playTripleBeep();
        const earnedSec = Math.floor(sessionSec / 5);
        appAudioTTS.speak(`Pomodoro study cycle completed! You earned ${appAudioTTS.formatSpokenTime(earnedSec)} of break.`, tState.speechRate, tState.speechVoice);
      }
    }

    const bigDisp = document.getElementById("timerOnlyBigDisp");
    if (bigDisp) bigDisp.textContent = formatHMS(dispMs);
    const lapDisp = document.getElementById("timerOnlyLapDisp");
    if (lapDisp) {
      if (timerMode === "pomodoro") {
        const earnedSec = Math.floor(sessionSec / 5);
        lapDisp.textContent = `Earned Break (Study / 5): ${formatMS(earnedSec * 1000)} | Lap: ${formatMS(lapSec * 1000)}`;
      } else {
        lapDisp.textContent = `Lap / Delta: ${formatMS(lapSec * 1000)}`;
      }
    }

    const ttsMode = tState.ttsMode || "mixed";
    const deltaIntervals = parseIntervalsStr(tState.deltaIntervals || "30,60,90,120");
    if ((ttsMode === "delta" || ttsMode === "mixed") && deltaIntervals.includes(lapSec)) {
      if (appAudioTTS.lastDispatchedDeltaSec !== lapSec) {
        appAudioTTS.lastDispatchedDeltaSec = lapSec;
        if (tState.enableBeeps !== false) appAudioTTS.playSyntheticBeep();
        if (tState.enableSpeech !== false) {
          appAudioTTS.speak(appAudioTTS.formatSpokenTime(lapSec), tState.speechRate, tState.speechVoice);
        }
      }
    }

    const fullIntervals = parseIntervalsStr(tState.fullIntervals || "300,600,900");
    if ((ttsMode === "full" || ttsMode === "mixed") && fullIntervals.includes(sessionSec)) {
      if (appAudioTTS.lastDispatchedFullSec !== sessionSec) {
        appAudioTTS.lastDispatchedFullSec = sessionSec;
        if (tState.enableSpeech !== false) {
          appAudioTTS.speak(`Elapsed ${appAudioTTS.formatSpokenTime(sessionSec)}`, tState.speechRate, tState.speechVoice);
        }
      }
    }
  }
}

// --- TIMER ONLY CONTROLLERS ---
function toggleTimerOnly() {
  appAudioTTS.ensureAudio();
  if (activeTimerState.breakRunning) {
    // Pause break
    activeTimerState.breakRunning = false;
    activeTimerState.breakAccumulatedMs += Date.now() - activeTimerState.breakStartTime;
    appAudioTTS.stopWorker();
    appAudioTTS.pauseAudio();
    renderWorkspace();
    return;
  }

  if (activeTimerState.timerOnlyRunning) {
    // Pause study timer
    activeTimerState.timerOnlyRunning = false;
    activeTimerState.timerOnlyAccumulated += Date.now() - activeTimerState.timerOnlyStart;
    appAudioTTS.stopWorker();
    appAudioTTS.pauseAudio();
  } else {
    // Start / Resume study timer
    activeTimerState.timerOnlyRunning = true;
    activeTimerState.timerOnlyStart = Date.now();
    activeTimerState.timerOnlyCompleted = false;
    appAudioTTS.startWorker();
  }
  renderWorkspace();
}

function resetTimerOnly() {
  activeTimerState.timerOnlyRunning = false;
  activeTimerState.timerOnlyStart = 0;
  activeTimerState.timerOnlyAccumulated = 0;
  activeTimerState.timerOnlyLapStartSec = 0;
  activeTimerState.timerOnlyLapNudgeSec = 0;
  activeTimerState.timerOnlyCompleted = false;
  activeTimerState.breakRunning = false;
  activeTimerState.breakStartTime = 0;
  activeTimerState.breakAccumulatedMs = 0;
  activeTimerState.breakDurationMs = 0;
  appAudioTTS.stopWorker();
  appAudioTTS.pauseAudio();
  renderWorkspace();
}

function lapTimerOnly() {
  if (!activeTimerState.timerOnlyRunning) return;
  const now = Date.now();
  const elapsed = (now - activeTimerState.timerOnlyStart) + activeTimerState.timerOnlyAccumulated;
  const sessionSec = Math.floor(elapsed / 1000);
  const lapSec = Math.max(0, sessionSec - (activeTimerState.timerOnlyLapStartSec || 0) + (activeTimerState.timerOnlyLapNudgeSec || 0));

  if (!state.timerOnly) state.timerOnly = {};
  if (!state.timerOnly.laps) state.timerOnly.laps = [];

  state.timerOnly.laps.unshift({
    lapNum: state.timerOnly.laps.length + 1,
    deltaSec: lapSec,
    totalSec: sessionSec,
    timestamp: new Date().toLocaleTimeString()
  });

  activeTimerState.timerOnlyLapStartSec = sessionSec;
  activeTimerState.timerOnlyLapNudgeSec = 0;
  appAudioTTS.lastDispatchedDeltaSec = -1;
  appAudioTTS.playSyntheticBeep();

  saveAllStorage();
  renderWorkspace();
}

function nudgeTimerOnly(deltaSec) {
  activeTimerState.timerOnlyLapNudgeSec = (activeTimerState.timerOnlyLapNudgeSec || 0) + deltaSec;
  renderWorkspace();
}

function setTimerOnlyMode(mode) {
  if (!state.timerOnly) state.timerOnly = {};
  state.timerOnly.mode = mode;
  resetTimerOnly();
  saveAllStorage();
  renderWorkspace();
}

function setTimerOnlyTTSMode(ttsMode) {
  if (!state.timerOnly) state.timerOnly = {};
  state.timerOnly.ttsMode = ttsMode;
  saveAllStorage();
  renderWorkspace();
}

function startPomodoroBreak() {
  appAudioTTS.ensureAudio();
  if (activeTimerState.timerOnlyRunning) {
    activeTimerState.timerOnlyRunning = false;
    activeTimerState.timerOnlyAccumulated += Date.now() - activeTimerState.timerOnlyStart;
  }

  const studySec = Math.floor(activeTimerState.timerOnlyAccumulated / 1000);
  const earnedSec = Math.max(60, Math.floor(studySec / 5)); // Dynamic break: study / 5

  activeTimerState.breakRunning = true;
  activeTimerState.breakStartTime = Date.now();
  activeTimerState.breakDurationMs = earnedSec * 1000;
  activeTimerState.breakAccumulatedMs = 0;
  activeTimerState.timerOnlyCompleted = false;

  appAudioTTS.startWorker();
  appAudioTTS.speak(`Starting earned break of ${appAudioTTS.formatSpokenTime(earnedSec)}. Step away from the desk.`, state.timerOnly?.speechRate || 1.15, state.timerOnly?.speechVoice || "");

  renderWorkspace();
}

function endPomodoroBreak() {
  activeTimerState.breakRunning = false;
  activeTimerState.breakStartTime = 0;
  activeTimerState.breakAccumulatedMs = 0;
  activeTimerState.breakDurationMs = 0;
  activeTimerState.timerOnlyCompleted = false;
  appAudioTTS.stopWorker();
  appAudioTTS.pauseAudio();
  appAudioTTS.speak("Break ended. Resuming study countdown.", state.timerOnly?.speechRate || 1.15, state.timerOnly?.speechVoice || "");
  renderWorkspace();
}

// --- CUSTOM IDENTIFIERS MANAGEMENT (Line 14) ---
function promptAddCustomMetadata(type) {
  if (!state.customMetadata) state.customMetadata = {};
  const currentList = state.customMetadata[type] || [];
  const typeLabel = type === 'exams' ? 'Exam' : type === 'books' ? 'Book / Source' : type === 'levels' ? 'Difficulty Level' : type === 'sets' ? 'Problem Set' : 'Section';

  const val = prompt(`Add New Custom ${typeLabel}:`);
  if (!val || !val.trim()) return;
  const cleanVal = val.trim();
  if (!currentList.includes(cleanVal)) {
    currentList.push(cleanVal);
    state.customMetadata[type] = currentList;
    saveAllStorage();
    renderWorkspace();
  }
}

function removeCustomMetadata(type, index) {
  if (!state.customMetadata || !state.customMetadata[type]) return;
  state.customMetadata[type].splice(index, 1);
  saveAllStorage();
  renderWorkspace();
}

// --- PRACTICE SESSION & OMR CONTROLLERS ---
function startPracticeSessionTimer(sessionId, sheetIndex) {
  appAudioTTS.ensureAudio();
  const session = state.sessions ? state.sessions.find(s => s.id === sessionId) : null;
  if (!session) return;
  const sheet = session.sheets[sheetIndex];
  if (!sheet) return;

  activeTimerState.type = "practice";
  activeTimerState.sessionId = sessionId;
  activeTimerState.sheetIndex = sheetIndex;
  activeTimerState.startTime = Date.now();
  activeTimerState.accumulatedSessionMs = sheet.elapsedSessionMs || 0;
  activeTimerState.isRunning = true;
  sheet.isRunning = true;

  if (sheet.questionStartSessionSec === undefined) {
    sheet.questionStartSessionSec = Math.floor((sheet.elapsedSessionMs || 0) / 1000);
  }

  appAudioTTS.startWorker();
  renderWorkspace();
}

function pausePracticeSessionTimer(sessionId, sheetIndex) {
  const session = state.sessions ? state.sessions.find(s => s.id === sessionId) : null;
  if (session && session.sheets[sheetIndex]) {
    session.sheets[sheetIndex].isRunning = false;
  }
  if (activeTimerState.isRunning && activeTimerState.type === "practice") {
    const now = Date.now();
    activeTimerState.accumulatedSessionMs += (now - activeTimerState.startTime);
    activeTimerState.isRunning = false;
    appAudioTTS.stopWorker();
    appAudioTTS.pauseAudio();
  }
  saveAllStorage();
  renderWorkspace();
}

function resetPracticeSessionTimer(sessionId, sheetIndex) {
  pausePracticeSessionTimer(sessionId, sheetIndex);
  const session = state.sessions ? state.sessions.find(s => s.id === sessionId) : null;
  if (session && session.sheets[sheetIndex]) {
    session.sheets[sheetIndex].elapsedSessionMs = 0;
    session.sheets[sheetIndex].questionStartSessionSec = 0;
    session.sheets[sheetIndex].nudgeDeltaSec = 0;
    session.sheets[sheetIndex].currentDeltaSec = 0;
    session.sheets[sheetIndex].currentDeltaMs = 0;
  }
  activeTimerState.accumulatedSessionMs = 0;
  saveAllStorage();
  renderWorkspace();
}

function nudgePracticeDelta(sessionId, sheetIndex, deltaSec) {
  pausePracticeSessionTimer(sessionId, sheetIndex); // Delta modification pauses timer (Line 13)
  const session = state.sessions ? state.sessions.find(s => s.id === sessionId) : null;
  if (!session) return;
  const sheet = session.sheets[sheetIndex];
  if (!sheet) return;

  sheet.nudgeDeltaSec = (sheet.nudgeDeltaSec || 0) + deltaSec;
  const sessionSec = Math.floor((sheet.elapsedSessionMs || 0) / 1000);
  const currentDeltaSec = Math.max(0, sessionSec - (sheet.questionStartSessionSec || 0) + (sheet.nudgeDeltaSec || 0));
  sheet.currentDeltaSec = currentDeltaSec;
  sheet.currentDeltaMs = currentDeltaSec * 1000;

  const deltaDisp = document.getElementById("practiceDeltaTimerDisp");
  if (deltaDisp) deltaDisp.textContent = formatMS(currentDeltaSec * 1000);

  saveAllStorage();
}

function onOMRBubbleClick(sessionId, sheetIndex, qIndex, optionVal) {
  const session = state.sessions ? state.sessions.find(s => s.id === sessionId) : null;
  if (!session) return;
  const sheet = session.sheets[sheetIndex];
  if (!sheet) return;
  const q = sheet.questions[qIndex];
  if (!q) return;

  // Clicking an already selected option triggers Undo / Blank confirmation workflow
  if (q.selectedOption === optionVal) {
    promptBlankOrUndoQuestion(sessionId, sheetIndex, qIndex, 'undo');
    return;
  }

  q.isBlanked = false;

  const sessionElapsed = activeTimerState.isRunning
    ? (Date.now() - activeTimerState.startTime) + activeTimerState.accumulatedSessionMs
    : (sheet.elapsedSessionMs || 0);
  const sessionSec = Math.floor(sessionElapsed / 1000);
  const deltaSec = Math.max(0, sessionSec - (sheet.questionStartSessionSec || 0) + (sheet.nudgeDeltaSec || 0));

  // Line 15: If an old choice on the OMR is modified, the delta since the past question should get added to that question
  const isOldChoice = (sheet.activeQuestionIndex !== undefined && qIndex < sheet.activeQuestionIndex && q.selectedOption !== null);

  if (isOldChoice) {
    q.selectedOption = optionVal;
    q.deltaTimeSec = (q.deltaTimeSec || 0) + deltaSec;
  } else {
    // Current active question answered
    q.selectedOption = optionVal;
    if (q.deltaTimeSec === 0 || !q.deltaTimeSec) {
      q.deltaTimeSec = deltaSec;
      q.originalTimeSec = deltaSec;
    }

    // Auto-[W] Threshold rule (Line 34)
    const thresholdSec = sheet.thresholdSec || state.practiceSettings.defaultThresholdSec || 90;
    if (sheet.enableAutoWThreshold !== false && q.deltaTimeSec >= thresholdSec && !q.flag && !q.flagOverridden) {
      q.flag = "W";
    }

    // Advance active question pointer to next unanswered question
    let nextIdx = qIndex + 1;
    while (nextIdx < sheet.questions.length && sheet.questions[nextIdx].selectedOption !== null) {
      nextIdx++;
    }
    if (nextIdx < sheet.questions.length) {
      sheet.activeQuestionIndex = nextIdx;
    }
  }

  // Zero-point reset synchronized with current sessionSec
  sheet.questionStartSessionSec = sessionSec;
  sheet.nudgeDeltaSec = 0;
  sheet.currentDeltaSec = 0;
  sheet.currentDeltaMs = 0;
  appAudioTTS.lastDispatchedDeltaSec = -1;

  if (sheet.enableBeeps !== false) appAudioTTS.playSyntheticBeep();

  saveAllStorage();

  // In-place targeted DOM update to prevent scroll resetting to top
  const rowEl = document.getElementById(`omr_row_${sessionId}_${sheetIndex}_${qIndex}`);
  if (rowEl) {
    rowEl.querySelectorAll('.omr-bubble').forEach(b => {
      b.classList.toggle('selected', b.dataset.opt === optionVal);
    });
    const deltaInp = rowEl.querySelector('.delta-val-input');
    if (deltaInp) deltaInp.value = q.deltaTimeSec || 0;

    // Clean active row update without element leakage or height expansion
    updateActiveQuestionDOM(sessionId, sheetIndex, sheet.activeQuestionIndex);

    const ansCountEl = document.getElementById('practiceAnsweredCount');
    if (ansCountEl) {
      ansCountEl.textContent = `${sheet.questions.filter(x => x.selectedOption !== null && !x.isBlanked).length} / ${sheet.questions.length}`;
    }
    const deltaDisp = document.getElementById("practiceDeltaTimerDisp");
    if (deltaDisp) deltaDisp.textContent = "00:00";
  } else {
    renderWorkspace();
  }
}

function onDeltaEditInput(sessionId, sheetIndex, qIndex, valStr) {
  pausePracticeSessionTimer(sessionId, sheetIndex); // Delta modification pauses timer (Line 13)
  const session = state.sessions ? state.sessions.find(s => s.id === sessionId) : null;
  if (!session) return;
  const sheet = session.sheets[sheetIndex];
  if (!sheet || !sheet.questions[qIndex]) return;

  const sec = Math.max(0, parseInt(valStr) || 0);
