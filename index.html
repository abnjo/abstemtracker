}

function adjustQuestionDeltaSec(sessionId, sheetIndex, qIndex, deltaSec) {
  pausePracticeSessionTimer(sessionId, sheetIndex); // Delta modification pauses timer (Line 13)
  const session = state.sessions ? state.sessions.find(s => s.id === sessionId) : null;
  if (!session) return;
  const sheet = session.sheets[sheetIndex];
  if (!sheet || !sheet.questions[qIndex]) return;

  const q = sheet.questions[qIndex];
  q.deltaTimeSec = Math.max(0, (q.deltaTimeSec || 0) + deltaSec);
  saveAllStorage();

  const rowEl = document.getElementById(`omr_row_${sessionId}_${sheetIndex}_${qIndex}`);
  if (rowEl) {
    const deltaInp = rowEl.querySelector('.delta-val-input');
    if (deltaInp) deltaInp.value = q.deltaTimeSec;
  } else {
    renderWorkspace();
  }
}

function toggleQuestionFlag(sessionId, sheetIndex, qIndex, flagVal) {
  const session = state.sessions ? state.sessions.find(s => s.id === sessionId) : null;
  if (!session) return;
  const sheet = session.sheets[sheetIndex];
  if (!sheet || !sheet.questions[qIndex]) return;

  const q = sheet.questions[qIndex];
  q.flag = (q.flag === flagVal) ? null : flagVal;
  q.flagOverridden = true;
  saveAllStorage();

  const rowEl = document.getElementById(`omr_row_${sessionId}_${sheetIndex}_${qIndex}`);
  if (rowEl) {
    rowEl.querySelectorAll('.btn-flag').forEach(btn => {
      btn.classList.remove('active-c', 'active-w', 'active-x');
      if (q.flag === 'C' && btn.textContent.includes('C')) btn.classList.add('active-c');
      if (q.flag === 'W' && btn.textContent.includes('W')) btn.classList.add('active-w');
      if (q.flag === 'X' && btn.textContent.includes('X')) btn.classList.add('active-x');
    });
    const badge = document.getElementById(`flag_badge_${q.qNum}`);
    if (badge) badge.innerHTML = '';
  } else {
    renderWorkspace();
  }
}

function selectQuestionErrorType(sessionId, sheetIndex, qIndex, errType) {
  const session = state.sessions ? state.sessions.find(s => s.id === sessionId) : null;
  if (!session) return;
  const sheet = session.sheets[sheetIndex];
  if (!sheet || !sheet.questions[qIndex]) return;

  const q = sheet.questions[qIndex];
  q.errorType = errType;
  if (errType === "speed" && !q.flag) q.flag = "W";
  else if ((errType === "memory" || errType === "concept" || errType === "reading") && !q.flag) q.flag = "X";
  q.flagOverridden = true;
  saveAllStorage();

  const rowEl = document.getElementById(`omr_row_${sessionId}_${sheetIndex}_${qIndex}`);
  if (rowEl) {
    rowEl.querySelectorAll('.btn-flag').forEach(btn => {
      btn.classList.remove('active-c', 'active-w', 'active-x');
      if (q.flag === 'C' && btn.textContent.includes('C')) btn.classList.add('active-c');
      if (q.flag === 'W' && btn.textContent.includes('W')) btn.classList.add('active-w');
      if (q.flag === 'X' && btn.textContent.includes('X')) btn.classList.add('active-x');
    });
  } else {
    renderWorkspace();
  }
}

// Quick Add / Quick Remove Operations (Direction Choosable + Sorting)
function addQuestionsToSheet(sessionId, sheetIndex, count = 10, position = 'end') {
  const session = state.sessions ? state.sessions.find(s => s.id === sessionId) : null;
  if (!session) return;
  const sheet = session.sheets[sheetIndex];
  if (!sheet) return;

  let newQuestions = [];
  if (position === 'start') {
    const firstQ = sheet.questions.length > 0 ? sheet.questions[0].qNum : 1;
    const startNum = Math.max(1, firstQ - count);
    for (let i = 0; i < count; i++) {
      newQuestions.push({
        qNum: startNum + i,
        selectedOption: null,
        deltaTimeSec: 0,
        originalTimeSec: 0,
        flag: null,
        flagOverridden: false,
        errorType: "",
        sourceRef: null
      });
    }
    sheet.questions.unshift(...newQuestions);
  } else {
    const lastQ = sheet.questions.length > 0 ? sheet.questions[sheet.questions.length - 1].qNum : 0;
    for (let i = 1; i <= count; i++) {
      sheet.questions.push({
        qNum: lastQ + i,
        selectedOption: null,
        deltaTimeSec: 0,
        originalTimeSec: 0,
        flag: null,
        flagOverridden: false,
        errorType: "",
        sourceRef: null
      });
    }
  }

  sheet.questions.sort((a, b) => a.qNum - b.qNum);
  saveAllStorage();
  renderWorkspace();
}

function executeAddQuestionsRange(sessionId, sheetIndex) {
  const session = state.sessions ? state.sessions.find(s => s.id === sessionId) : null;
  if (!session) return;
  const sheet = session.sheets[sheetIndex];
  if (!sheet) return;

  const startQ = parseInt(document.getElementById("addRangeStartQ")?.value) || 1;
  const endQ = parseInt(document.getElementById("addRangeEndQ")?.value) || startQ;
  const pos = document.getElementById("addRangePosition")?.value || "auto_sort";

  const minQ = Math.min(startQ, endQ);
  const maxQ = Math.max(startQ, endQ);

  const newQuestions = [];
  for (let qNum = minQ; qNum <= maxQ; qNum++) {
    if (!sheet.questions.some(q => q.qNum === qNum)) {
      newQuestions.push({
        qNum: qNum,
        selectedOption: null,
        deltaTimeSec: 0,
        originalTimeSec: 0,
        flag: null,
        flagOverridden: false,
        errorType: "",
        sourceRef: null
      });
    }
  }

  if (newQuestions.length === 0) {
    alert("Specified question numbers already exist in this sheet.");
    return;
  }

  if (pos === "start") {
    sheet.questions.unshift(...newQuestions);
  } else if (pos === "end") {
    sheet.questions.push(...newQuestions);
  } else {
    sheet.questions.push(...newQuestions);
    sheet.questions.sort((a, b) => a.qNum - b.qNum);
  }

  saveAllStorage();
  closeModal();
  renderWorkspace();
}

  const sessionElapsed = activeTimerState.isRunning

// --- BLANK & UNDO QUESTION WORKFLOW (WITH BACKUP PRESERVATION) ---
function promptBlankOrUndoQuestion(sessionId, sheetIndex, qIndex, mode = 'blank') {
  const session = state.sessions ? state.sessions.find(s => s.id === sessionId) : null;
  if (!session) return;
  const sheet = session.sheets[sheetIndex];
  if (!sheet || !sheet.questions[qIndex]) return;

  const q = sheet.questions[qIndex];
  const sessionElapsed = activeTimerState.isRunning
    ? (Date.now() - activeTimerState.startTime) + activeTimerState.accumulatedSessionMs
    : (sheet.elapsedSessionMs || 0);
  const sessionSec = Math.floor(sessionElapsed / 1000);
  const currentDeltaSec = Math.max(0, sessionSec - (sheet.questionStartSessionSec || 0) + (sheet.nudgeDeltaSec || 0));

  const isUndo = (mode === 'undo');
  const modalHtml = `
    <div style="font-size:12px;">
      <p style="font-weight:700;font-size:13px;margin-bottom:8px;">
        ${isUndo ? `Undo / Deselect Option for Q${q.qNum}` : `Blank Question Q${q.qNum}`}
      </p>
      <div class="box" style="margin-bottom:10px;background:var(--surface-2);">
        <div>Current Recorded Time on Q${q.qNum}: <strong>${q.deltaTimeSec || 0}s</strong></div>
        <div>Current Delta in Progress: <strong>${currentDeltaSec}s</strong></div>
        <div style="font-size:11px;color:var(--fg-muted);margin-top:6px;">
          Blanking or undoing will remove this question from attempted statistics and subtract its recorded time (<strong>${q.deltaTimeSec || 0}s</strong>) from the main session timer.
        </div>
      </div>

      <div class="box" style="margin-bottom:12px;">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
          <input type="checkbox" id="blankAddCurrentDelta" ${currentDeltaSec > 0 ? 'checked' : ''}>
          <span>Add in-progress delta (<strong>+${currentDeltaSec}s</strong>) to the backup time saved for Q${q.qNum} (Total backup: <strong>${(q.deltaTimeSec || 0) + currentDeltaSec}s</strong>)</span>
        </label>
      </div>

      <div class="flex-row" style="justify-content:flex-end;gap:8px;">
        <button onclick="closeModal()">[Cancel / Keep Answer]</button>
        <button class="active" style="background:var(--status-w);color:#fff;" onclick="executeBlankQuestion('${sessionId}', ${sheetIndex}, ${qIndex}, '${mode}')">
          [Confirm ${isUndo ? 'Undo & Blank' : 'Blank Question'}]
        </button>
      </div>
    </div>
  `;
  openModal(isUndo ? `Undo Q${q.qNum}` : `Blank Q${q.qNum}`, modalHtml);
}

function executeBlankQuestion(sessionId, sheetIndex, qIndex, mode) {
  const session = state.sessions ? state.sessions.find(s => s.id === sessionId) : null;
  if (!session) return;
  const sheet = session.sheets[sheetIndex];
  if (!sheet || !sheet.questions[qIndex]) return;

  const q = sheet.questions[qIndex];
  const addCurrentDelta = document.getElementById("blankAddCurrentDelta")?.checked ?? false;

  const sessionElapsed = activeTimerState.isRunning
    ? (Date.now() - activeTimerState.startTime) + activeTimerState.accumulatedSessionMs
    : (sheet.elapsedSessionMs || 0);
  const sessionSec = Math.floor(sessionElapsed / 1000);
  const currentDeltaSec = Math.max(0, sessionSec - (sheet.questionStartSessionSec || 0) + (sheet.nudgeDeltaSec || 0));

  const prevRecordedTime = q.deltaTimeSec || 0;
  const backupTime = addCurrentDelta ? (prevRecordedTime + currentDeltaSec) : prevRecordedTime;

  // 1. Save backup data safely in question object and history log
  q.backupDeltaTimeSec = backupTime;
  q.backupOption = q.selectedOption;
  q.backupFlag = q.flag;
  q.backupErrorType = q.errorType;
  if (!q.timeHistory) q.timeHistory = [];
  q.timeHistory.push({
    action: mode,
    timestamp: Date.now(),
    prevTime: prevRecordedTime,
    addedDelta: addCurrentDelta ? currentDeltaSec : 0,
    savedBackup: backupTime,
    option: q.selectedOption,
    flag: q.flag
  });

  // 2. Subtract previous recorded time from main session timers
  sheet.elapsedSessionMs = Math.max(0, (sheet.elapsedSessionMs || 0) - (prevRecordedTime * 1000));
  if (activeTimerState.isRunning && activeTimerState.type === "practice") {
    activeTimerState.accumulatedSessionMs = sheet.elapsedSessionMs;
    activeTimerState.startTime = Date.now();
  }

  // 3. Mark blanked and reset live answer fields
  q.selectedOption = null;
  q.deltaTimeSec = 0;
  q.flag = null;
  q.isBlanked = true;

  // 4. Synchronize delta zero-point
  const newSessionSec = Math.floor((sheet.elapsedSessionMs || 0) / 1000);
  sheet.questionStartSessionSec = newSessionSec;
  sheet.nudgeDeltaSec = 0;
  sheet.currentDeltaSec = 0;
  sheet.currentDeltaMs = 0;
  appAudioTTS.lastDispatchedDeltaSec = -1;

  closeModal();
  saveAllStorage();
  renderWorkspace();
}

function restoreQuestionBackup(sessionId, sheetIndex, qIndex) {
  const session = state.sessions ? state.sessions.find(s => s.id === sessionId) : null;
  if (!session) return;
  const sheet = session.sheets[sheetIndex];
  if (!sheet || !sheet.questions[qIndex]) return;

  const q = sheet.questions[qIndex];
  const restoreSec = q.backupDeltaTimeSec || 0;

  q.deltaTimeSec = restoreSec;
  if (q.backupOption) q.selectedOption = q.backupOption;
  if (q.backupFlag) q.flag = q.backupFlag;
  if (q.backupErrorType) q.errorType = q.backupErrorType;
  q.isBlanked = false;

  // Add restoreSec back to main session timers
  sheet.elapsedSessionMs = (sheet.elapsedSessionMs || 0) + (restoreSec * 1000);
  if (activeTimerState.isRunning && activeTimerState.type === "practice") {
    activeTimerState.accumulatedSessionMs = sheet.elapsedSessionMs;
    activeTimerState.startTime = Date.now();
  }

  saveAllStorage();
  renderWorkspace();
}

  if (sheet.activeQuestionIndex === qIndex) {
    sheet.activeQuestionIndex = targetIdx;
  } else if (sheet.activeQuestionIndex === targetIdx) {
    sheet.activeQuestionIndex = qIndex;
  }

  saveAllStorage();

}

function executeRearrangeSheet(sessionId, sheetIndex) {
  const session = state.sessions ? state.sessions.find(s => s.id === sessionId) : null;
  if (!session) return;
  const sheet = session.sheets[sheetIndex];
  if (!sheet) return;

  const sortMode = document.getElementById("massSortCriteria")?.value || "qnum_asc";
  const customOrderStr = document.getElementById("massCustomOrder")?.value?.trim() || "";
  const renumberCheck = document.getElementById("massRenumberCheck")?.checked || false;
  const renumberStart = parseInt(document.getElementById("massRenumberStart")?.value) || 1;

  const originalOrderStr = sheet.questions.map(q => q.qNum).join(', ');
  if (customOrderStr && customOrderStr !== originalOrderStr) {
    const desiredNums = customOrderStr.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
    if (desiredNums.length > 0) {
      const qMap = new Map();
      sheet.questions.forEach(q => qMap.set(q.qNum, q));
      const reordered = [];
      desiredNums.forEach(n => {
        if (qMap.has(n)) {
          reordered.push(qMap.get(n));
          qMap.delete(n);
        }
      });
      qMap.forEach(q => reordered.push(q));
      sheet.questions = reordered;
    }
  } else {
    switch (sortMode) {
      case "qnum_asc":
        sheet.questions.sort((a, b) => a.qNum - b.qNum);
        break;
      case "qnum_desc":
        sheet.questions.sort((a, b) => b.qNum - a.qNum);
        break;
      case "flag_xwc": {
        const flagRank = { 'X': 1, 'W': 2, 'C': 3, null: 4, undefined: 4 };
        sheet.questions.sort((a, b) => (flagRank[a.flag] || 4) - (flagRank[b.flag] || 4));
        break;
      }
      case "time_desc":
        sheet.questions.sort((a, b) => (b.deltaTimeSec || 0) - (a.deltaTimeSec || 0));
        break;
      case "time_asc":
        sheet.questions.sort((a, b) => (a.deltaTimeSec || 0) - (b.deltaTimeSec || 0));
        break;
      case "unanswered_first":
        sheet.questions.sort((a, b) => (a.selectedOption === null ? -1 : 1));
        break;
      case "answered_first":
        sheet.questions.sort((a, b) => (a.selectedOption !== null ? -1 : 1));
        break;
    }
  }

  if (renumberCheck) {
    sheet.questions.forEach((q, i) => {
      q.qNum = renumberStart + i;
    });
  }

  closeModal();
  saveAllStorage();
  renderWorkspace();
}

// --- SESSION CREATION (Range-Configurable) ---
function createPracticeSession(exam, subject, chapterId, book, level, set, section, startQ, endQ, optionStyle, thresholdSec, autoW) {
  const ch = state.chapters.find(c => c.id === chapterId) || state.chapters[0];
  const newSessionId = `sess_${Date.now()}`;
  const questions = [];

  const qStart = parseInt(startQ) || 1;
  const qEnd = Math.max(qStart, parseInt(endQ) || (qStart + 29));

  for (let i = qStart; i <= qEnd; i++) {
    questions.push({
      qNum: i,
      selectedOption: null,
      deltaTimeSec: 0,
      originalTimeSec: 0,
      flag: null,
      flagOverridden: false,
      errorType: "",
      sourceRef: null
    });
  }

  const initialSheet = {
    id: `sheet_${Date.now()}`,
    name: "Sheet 1: D0 Initial Drill",
    type: "d0",
    startQ: qStart,
    endQ: qEnd,
    optionStyle: optionStyle || state.practiceSettings.optionStyle || "ABCD",
    thresholdSec: parseInt(thresholdSec) || state.practiceSettings.defaultThresholdSec || 90,
    enableAutoWThreshold: autoW !== false,
    activeQuestionIndex: 0,
    questionStartSessionSec: 0,
    nudgeDeltaSec: 0,
    currentDeltaSec: 0,
    currentDeltaMs: 0,
    timerMode: "stopwatch",
    ttsMode: state.practiceSettings.ttsMode || "delta",
    deltaIntervals: state.practiceSettings.deltaIntervals || "30,60,90,120",
    fullIntervals: state.practiceSettings.fullIntervals || "300,600,900",
    enableBeeps: state.practiceSettings.enableBeeps !== false,
    enableSpeech: state.practiceSettings.enableSpeech !== false,
    elapsedSessionMs: 0,
    isRunning: false,
    questions: questions
  };

  const session = {
    id: newSessionId,
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString(),
    exam: exam || "NEET",
    subject: subject || ch.subj,
    chapterId: ch.id,
    chapterName: ch.name,
    book: book || "Coaching Module",
    level: level || "Level 1",
    set: set || "Exercise Drills",
    section: section || "Section A",
    activeSheetIndex: 0,
    sheets: [initialSheet]
  };

  if (!state.sessions) state.sessions = [];
  state.sessions.unshift(session);
  state.activeSessionId = newSessionId;
  state.activeSessionSubView = "omr";
  saveAllStorage();
  renderWorkspace();
}

function executeCreateCustomSheet(sessionId) {
  const session = state.sessions ? state.sessions.find(s => s.id === sessionId) : null;
  if (!session) return;
  const currentSheet = session.sheets[session.activeSheetIndex || 0] || session.sheets[0];

  const title = document.getElementById("custSheetTitle")?.value.trim() || `Custom Sheet ${session.sheets.length + 1}`;
  const optStyle = document.getElementById("custSheetOptStyle")?.value || "ABCD";
  const startQ = parseInt(document.getElementById("custSheetStartQ")?.value) || 1;
  const endQ = Math.max(startQ, parseInt(document.getElementById("custSheetEndQ")?.value) || (startQ + 29));
  const threshold = parseInt(document.getElementById("custSheetThreshold")?.value) || 90;
  const seedMode = document.getElementById("custSheetSeed")?.value || "blank";

  let questions = [];
  if (seedMode.startsWith("clone_") && currentSheet) {
    currentSheet.questions.forEach(q => {
      let include = false;
      if (seedMode === "clone_w" && q.flag === "W") include = true;
      else if (seedMode === "clone_x" && q.flag === "X") include = true;
      else if (seedMode === "clone_wx" && (q.flag === "W" || q.flag === "X")) include = true;

      if (include) {
        questions.push({
          qNum: questions.length + 1,
          selectedOption: null,
          deltaTimeSec: 0,
          originalTimeSec: 0,
          flag: null,
          flagOverridden: false,
          errorType: q.errorType || "",
          sourceRef: {
            sheetId: currentSheet.id,
            sheetName: currentSheet.name,
            origQNum: q.qNum,
            origFlag: q.flag,
            origDeltaSec: q.deltaTimeSec
          }
        });
      }
    });
  }

  if (questions.length === 0) {
    for (let i = startQ; i <= endQ; i++) {
      questions.push({
        qNum: i,
        selectedOption: null,
        deltaTimeSec: 0,
        originalTimeSec: 0,
        flag: null,
        flagOverridden: false,
        errorType: "",
        sourceRef: null
      });
    }
  }

  const newSheet = {
    id: `sheet_${Date.now()}`,
    name: `Sheet ${session.sheets.length + 1}: ${title}`,
    type: "custom",
    startQ: startQ,
    endQ: endQ,
    optionStyle: optStyle,
    thresholdSec: threshold,
    enableAutoWThreshold: true,
    activeQuestionIndex: 0,
    questionStartSessionSec: 0,
    nudgeDeltaSec: 0,
    currentDeltaSec: 0,
    currentDeltaMs: 0,
    timerMode: "stopwatch",
    ttsMode: currentSheet.ttsMode || "delta",
    deltaIntervals: currentSheet.deltaIntervals || "30,60,90,120",
    fullIntervals: currentSheet.fullIntervals || "300,600,900",
    enableBeeps: currentSheet.enableBeeps !== false,
    enableSpeech: currentSheet.enableSpeech !== false,
    elapsedSessionMs: 0,
    isRunning: false,
    questions: questions
  };

  session.sheets.push(newSheet);
  session.activeSheetIndex = session.sheets.length - 1;
  saveAllStorage();
  closeModal();
  renderWorkspace();
}

function executeGenerateReviewSheet(sessionId) {
  const session = state.sessions ? state.sessions.find(s => s.id === sessionId) : null;
  if (!session) return;
  const currentSheet = session.sheets[session.activeSheetIndex || 0];
  if (!currentSheet) return;

  const incW = document.getElementById("revFlagW")?.checked;
  const incX = document.getElementById("revFlagX")?.checked;
  const incC = document.getElementById("revFlagC")?.checked;
  const targetType = document.getElementById("revDayTarget")?.value || "d3_review";
  const startQ = parseInt(document.getElementById("revStartQ")?.value) || 1;
  const endQ = parseInt(document.getElementById("revEndQ")?.value) || 9999;

  let selectedFlags = [];
  if (incW) selectedFlags.push("W");
  if (incX) selectedFlags.push("X");
  if (incC) selectedFlags.push("C");

  let reviewQuestions = [];
  currentSheet.questions.forEach(q => {
    if (q.qNum >= startQ && q.qNum <= endQ && selectedFlags.includes(q.flag)) {
      reviewQuestions.push({
        qNum: reviewQuestions.length + 1,
        selectedOption: null,
        deltaTimeSec: 0,
        originalTimeSec: 0,
        flag: null,
        flagOverridden: false,
        errorType: q.errorType || "",
        sourceRef: {
          sheetId: currentSheet.id,
          sheetName: currentSheet.name,
          origQNum: q.qNum,
          origFlag: q.flag,
          origDeltaSec: q.deltaTimeSec
        }
      });
    }
  });

  if (targetType === "d3_unseen") {
    const extraCount = parseInt(document.getElementById("revUnseenCount")?.value) || 20;
    const startNum = reviewQuestions.length + 1;
    for (let i = 0; i < extraCount; i++) {
      reviewQuestions.push({
        qNum: startNum + i,
        selectedOption: null,
        deltaTimeSec: 0,
        originalTimeSec: 0,
        flag: null,
        flagOverridden: false,
        errorType: "",
        sourceRef: null
      });
    }
  }

  if (reviewQuestions.length === 0) {
    alert("No questions matched the selected flags and range to carry into review.");
    return;
  }

  let sheetTitle = "D3 Review";
  if (targetType === "d3_unseen") sheetTitle = "D3 Unseen PYQs";
  else if (targetType === "d7_review") sheetTitle = "D7 Cold Review";
  else if (targetType === "d21_mock") sheetTitle = "D21 Mock";
  else if (targetType === "custom") sheetTitle = "Custom Review";

  const newSheet = {
    id: `sheet_${Date.now()}`,
    name: `Sheet ${session.sheets.length + 1}: ${sheetTitle} (${reviewQuestions.length} Qs)`,
    type: targetType,
    optionStyle: currentSheet.optionStyle || "ABCD",
    thresholdSec: currentSheet.thresholdSec || 90,
    enableAutoWThreshold: currentSheet.enableAutoWThreshold !== false,
    activeQuestionIndex: 0,
    questionStartSessionSec: 0,
    nudgeDeltaSec: 0,
    currentDeltaSec: 0,
    currentDeltaMs: 0,
    timerMode: "stopwatch",
    ttsMode: currentSheet.ttsMode || "delta",
    deltaIntervals: currentSheet.deltaIntervals || "30,60,90,120",
    fullIntervals: currentSheet.fullIntervals || "300,600,900",
    enableBeeps: currentSheet.enableBeeps !== false,
    enableSpeech: currentSheet.enableSpeech !== false,
    elapsedSessionMs: 0,
    isRunning: false,
    questions: reviewQuestions
  };

  session.sheets.push(newSheet);
  session.activeSheetIndex = session.sheets.length - 1;
  saveAllStorage();
  closeModal();
  renderWorkspace();
}

// --- CHAPTER GPS SYNC & GRADUATION MECHANIC (Line 33) ---
function syncSessionToChapterGPS(sessionId) {
  const session = state.sessions ? state.sessions.find(s => s.id === sessionId) : null;
  if (!session) return;
  const ch = state.chapters.find(c => c.id === session.chapterId);
  if (!ch) return;

  const currentSheet = session.sheets[session.activeSheetIndex || 0];
  const attempted = currentSheet.questions.filter(q => q.selectedOption !== null);
  const correct = currentSheet.questions.filter(q => q.flag === 'C');
  const acc = attempted.length > 0 ? Math.round((correct.length / attempted.length) * 100) : 0;

  let msg = `<strong>${ch.name}</strong> is currently at <strong>${GPS_STAGES[ch.stage].name}</strong>.<br>`;
  msg += `Active Sheet Accuracy: <strong>${acc}%</strong> (${correct.length}/${attempted.length} confirmed).<br><br>`;

  let actionsHtml = "";

  if (ch.stage < 4 && acc >= 75) {
    actionsHtml += `<button class="active" onclick="executeGPSStageAdvance('${ch.id}', 4, ${acc})">[Pass Exit Gate &rarr; Mark Stage 4 (D0_DONE) &amp; Start Calendar Clock]</button><br><br>`;
  } else if (ch.stage < 4) {
    actionsHtml += `<p style="color:var(--status-w);">Exit gate requires &ge;75-80% accuracy. Current accuracy is ${acc}%. Continue drilling older PYQs before advancing.</p>`;
    actionsHtml += `<button onclick="executeGPSStageAdvance('${ch.id}', 4, ${acc})">[Override &amp; Mark Stage 4 (D0_DONE)]</button><br><br>`;
  }

  if (currentSheet.type === "d3_review" || currentSheet.type === "d3_unseen") {
    actionsHtml += `<button onclick="executeGPSStageAdvance('${ch.id}', 6, ${acc})">[Advance to Stage 6 (Phase 4 — D3 Completed)]</button><br><br>`;
  } else if (currentSheet.type === "d7_review") {
    actionsHtml += `<button onclick="executeGPSStageAdvance('${ch.id}', 7, ${acc})">[Advance to Stage 7 (Phase 4 — D7 Completed)]</button><br><br>`;
  } else if (currentSheet.type === "d21_mock") {
    if (acc < 70) {
      actionsHtml += `<button style="background:var(--status-x);color:#fff;" onclick="executeGPSStageAdvance('${ch.id}', 9, ${acc})">[Trigger Stage 9 (&gt;30% Mock Error Reset Loop)]</button><br><br>`;
    } else {
      actionsHtml += `<button class="active" onclick="executeGPSStageAdvance('${ch.id}', 8, ${acc})">[Graduate to Stage 8 (Phase 4 — D21 Passed)]</button><br><br>`;
    }
  }

  actionsHtml += `<button onclick="closeModal()">Close</button>`;

  openModal(`Chapter GPS Status: ${ch.name}`, msg + actionsHtml);
}

function executeGPSStageAdvance(chId, targetStage, acc) {
  const ch = state.chapters.find(c => c.id === chId);
  if (!ch) return;

  ch.stage = targetStage;
  ch.acc = acc;
  if (targetStage === 4 && !ch.d0) {
    ch.d0 = offsetDate(0);
  }
  saveAllStorage();
  closeModal();
  renderWorkspace();
}

// --- RADAR CHART SVG GENERATOR (Line 26) ---
function generateRadarSVG(scores, size = 260) {
  const cx = size / 2;
  const cy = size / 2;
  const r = size * 0.36;

  const axes = [
    { key: "memory", label: "Memory (Facts)", x: cx, y: cy - r, lx: cx, ly: cy - r - 10, align: "middle" },
    { key: "concept", label: "Concept & Rules", x: cx + r, y: cy, lx: cx + r + 8, ly: cy + 4, align: "start" },
    { key: "reading", label: "Exam Technique", x: cx, y: cy + r, lx: cx, ly: cy + r + 16, align: "middle" },
    { key: "speed", label: "Speed & Method", x: cx - r, y: cy, lx: cx - r - 8, ly: cy + 4, align: "end" }
  ];

  const gridCircles = [0.25, 0.5, 0.75, 1.0].map(scale => {
    return `<polygon points="${cx},${cy - r * scale} ${cx + r * scale},${cy} ${cx},${cy + r * scale} ${cx - r * scale},${cy}" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="2,2"/>`;
  }).join("");

  const axisLines = axes.map(a => `<line x1="${cx}" y1="${cy}" x2="${a.x}" y2="${a.y}" stroke="var(--border)" stroke-width="1"/>`).join("");

  const mVal = Math.min(100, Math.max(0, scores.memory !== undefined ? scores.memory : 100));
  const cVal = Math.min(100, Math.max(0, scores.concept !== undefined ? scores.concept : 100));
  const rVal = Math.min(100, Math.max(0, scores.reading !== undefined ? scores.reading : 100));
  const sVal = Math.min(100, Math.max(0, scores.speed !== undefined ? scores.speed : 100));

  const pPoints = [
    `${cx},${cy - r * (mVal / 100)}`,
    `${cx + r * (cVal / 100)},${cy}`,
    `${cx},${cy + r * (rVal / 100)}`,
    `${cx - r * (sVal / 100)},${cy}`
  ].join(" ");

  const labels = axes.map(a => {
    const val = a.key === 'memory' ? mVal : a.key === 'concept' ? cVal : a.key === 'reading' ? rVal : sVal;
    return `<text x="${a.lx}" y="${a.ly}" text-anchor="${a.align}" font-family="var(--font-mono)" font-size="10px" font-weight="700" fill="var(--fg)">${a.label}: ${Math.round(val)}%</text>`;
  }).join("");

  return `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="max-width:100%;height:auto;">
      ${gridCircles}
      ${axisLines}
      <polygon points="${pPoints}" fill="rgba(16, 185, 129, 0.35)" stroke="#10b981" stroke-width="2"/>
      <circle cx="${cx}" cy="${cy - r * (mVal / 100)}" r="3.5" fill="#10b981"/>
      <circle cx="${cx + r * (cVal / 100)}" cy="${cy}" r="3.5" fill="#10b981"/>
      <circle cx="${cx}" cy="${cy + r * (rVal / 100)}" r="3.5" fill="#10b981"/>
      <circle cx="${cx - r * (sVal / 100)}" cy="${cy}" r="3.5" fill="#10b981"/>
      ${labels}
    </svg>
  `;
}

// --- MULTI-LEVEL STATISTICS & SESSION ANALYSIS (Lines 22-28) ---
function setAnalysisScope(scope, sheetIdx = 0) {

  state.analysisSheetIdx = sheetIdx;

function setAnalysisFlagFilter(filter) {

function getPracticeAnalysisHTML(session) {
  const scope = state.analysisScope || "sheet";
  const flagFilter = state.analysisFlagFilter || "ALL";
  const sheetIdx = state.analysisSheetIdx !== undefined ? state.analysisSheetIdx : (session.activeSheetIndex || 0);
  const currentSheet = session.sheets[sheetIdx] || session.sheets[0];

  if (!currentSheet && scope !== "lifetime") {
    return `<p>No sheets available for analysis.</p>`;
  }

  let scopeQuestions = [];
  let scopeTitle = "";

  if (scope === "sheet") {
    scopeTitle = `Per Sheet: ${currentSheet.name}`;
    scopeQuestions = currentSheet.questions || [];
  } else if (scope === "upto") {
    scopeTitle = `Upto Sheet ${sheetIdx + 1}: ${currentSheet.name} (Cumulative Progression)`;
    for (let s = 0; s <= sheetIdx; s++) {
      if (session.sheets[s]) {
        scopeQuestions.push(...session.sheets[s].questions);
      }
    }
  } else if (scope === "session") {
    scopeTitle = `Entire Session (${session.sheets.length} Sheets Combined)`;
    session.sheets.forEach(sh => {
      scopeQuestions.push(...sh.questions);
    });
  }

  // Active range: from first answered question to last answered question (Line 23)
  const validScopeQuestions = scopeQuestions.filter(q => !q.isBlanked);
  let firstIdx = -1;
  let lastIdx = -1;
  validScopeQuestions.forEach((q, idx) => {
    if (q.selectedOption !== null || q.deltaTimeSec > 0 || q.flag !== null) {
      if (firstIdx === -1) firstIdx = idx;
      lastIdx = idx;
    }
  });

  let filledQuestions = (firstIdx !== -1 && lastIdx !== -1)
    ? validScopeQuestions.slice(firstIdx, lastIdx + 1)
    : [];

  // Scoped Outcome Flag Filtering (C, W, X, W+X, ALL)
  if (flagFilter === "C") {
    filledQuestions = filledQuestions.filter(q => q.flag === "C");
  } else if (flagFilter === "W") {
    filledQuestions = filledQuestions.filter(q => q.flag === "W");
  } else if (flagFilter === "X") {
    filledQuestions = filledQuestions.filter(q => q.flag === "X");
  } else if (flagFilter === "WX") {
    filledQuestions = filledQuestions.filter(q => q.flag === "W" || q.flag === "X");
  }

  const totalAttempted = filledQuestions.filter(q => q.selectedOption !== null).length;
  const cCount = filledQuestions.filter(q => q.flag === 'C').length;
  const wCount = filledQuestions.filter(q => q.flag === 'W').length;
  const xCount = filledQuestions.filter(q => q.flag === 'X').length;
  const accuracy = totalAttempted > 0 ? Math.round((cCount / totalAttempted) * 100) : 0;

  const answeredWithTime = filledQuestions.filter(q => q.deltaTimeSec > 0);
  const avgDelta = answeredWithTime.length > 0
    ? Math.round(answeredWithTime.reduce((a, b) => a + b.deltaTimeSec, 0) / answeredWithTime.length)
    : 0;
  const maxDelta = answeredWithTime.length > 0 ? Math.max(...answeredWithTime.map(q => q.deltaTimeSec)) : 0;
  const minDelta = answeredWithTime.length > 0 ? Math.min(...answeredWithTime.map(q => q.deltaTimeSec)) : 0;

  // Error Diagnosis Matrix Breakdown
  let memErr = 0, concErr = 0, readErr = 0, spdErr = 0;
  filledQuestions.forEach(q => {
    if (q.errorType === 'memory') memErr++;
    else if (q.errorType === 'concept') concErr++;
    else if (q.errorType === 'reading') readErr++;
    else if (q.errorType === 'speed') spdErr++;
  });
  const totalErrors = memErr + concErr + readErr + spdErr;

  const denom = Math.max(1, totalAttempted);
  const radarScores = {
    memory: Math.max(20, 100 - Math.round((memErr / denom) * 150)),
    concept: Math.max(20, 100 - Math.round((concErr / denom) * 150)),
    reading: Math.max(20, 100 - Math.round((readErr / denom) * 150)),
    speed: Math.max(20, 100 - Math.round((spdErr / denom) * 150))
  };

  let primaryWeakness = "None! Clean execution.";
  let recAction = "Maintain daily Anki review and scheduled spaced tests.";
  const maxErrVal = Math.max(memErr, concErr, readErr, spdErr);
  if (maxErrVal > 0) {
    if (maxErrVal === memErr) {
      primaryWeakness = "1. Memory / Fact Failure [X]";
      recAction = "Create atomic Anki cards for forgotten facts/reagents today; re-test on D3.";
    } else if (maxErrVal === concErr) {
      primaryWeakness = "2. Concept / Constraint Failure [X]";
      recAction = "Write a 5-Line Logic Fix in Obsidian; identify invalid physical assumptions.";
    } else if (maxErrVal === readErr) {
      primaryWeakness = "3. Repeated Reading / Careless Error [X]";
      recAction = "Add a mandatory Pre-Solve habit rule to Section 0 of your Obsidian note.";
    } else if (maxErrVal === spdErr) {
      primaryWeakness = "4. Speed / Method Bottleneck [W]";
      recAction = "Extract a 1-2-3 Problem Recipe in Obsidian; re-test under stopwatch on D3.";
    }
  }

  // Rules-based graduation analysis across sheets (Line 25)
  const graduationRows = [];
  filledQuestions.forEach(q => {
    if (q.sourceRef) {
      const origFlag = q.sourceRef.origFlag;
      const currentFlag = q.flag;
      let statusText = "";
      let statusClass = "";

      if (origFlag === "W" && currentFlag === "C") {
        statusText = "[PASSED TO C] Clean D3 Stopwatch Pass";
        statusClass = "color:var(--status-c);font-weight:700;";
      } else if (origFlag === "W" && (currentFlag === "W" || currentFlag === "X")) {
        statusText = "[STRIKE 2 -> X] Mutated into [X] (Slow/Wrong on D3)";
        statusClass = "color:var(--status-x);font-weight:700;";
      } else if (origFlag === "X" && currentFlag === "C" && currentSheet.type === "d7_review") {
        statusText = "[DOUBLE COLD PASS -> C] Fully Cleared to [C]";
        statusClass = "color:var(--status-c);font-weight:700;";
      } else if (origFlag === "X" && currentFlag === "C") {
        statusText = "[1/2 COLD PASS] D3 Passed (Retained for D7 2nd Test)";
        statusClass = "color:var(--status-w);font-weight:700;";
      } else if (origFlag === "X" && currentFlag !== "C") {
        statusText = "[LOCKED IN X] Penalty Queue (Rewrite 5-Line Fix)";
        statusClass = "color:var(--status-x);font-weight:700;";
      } else {
        statusText = `Retained as [${currentFlag || 'Unflagged'}]`;
      }

      graduationRows.push({
        qNum: q.qNum,
        origSheet: q.sourceRef.sheetName,
        origQ: q.sourceRef.origQNum,
        origFlag: origFlag,
        currentFlag: currentFlag,
        statusText: statusText,
        statusClass: statusClass
      });
    }
  });

// --- CUMULATIVE STATS RENDERER (Line 27) ---
function getCumulativeStatsHTML(filterSubj = "All") {
  const sessions = state.sessions || [];
  const filtered = filterSubj === "All"
    ? sessions
    : sessions.filter(s => s.subject === filterSubj);
  const flagFilter = state.analysisFlagFilter || "ALL";

  let totalQuestionsAttempted = 0;
  let totalConfirmed = 0;
  let totalDeltaSec = 0;
  let timedQuestionsCount = 0;
  let totalMem = 0, totalConc = 0, totalRead = 0, totalSpd = 0;

  filtered.forEach(s => {
    (s.sheets || []).forEach(sh => {
      (sh.questions || []).forEach(q => {
        if (q.selectedOption !== null && !q.isBlanked) {
          if (flagFilter === "C" && q.flag !== "C") return;
          if (flagFilter === "W" && q.flag !== "W") return;
          if (flagFilter === "X" && q.flag !== "X") return;
          if (flagFilter === "WX" && q.flag !== "W" && q.flag !== "X") return;

          totalQuestionsAttempted++;
          if (q.flag === 'C') totalConfirmed++;
          if (q.deltaTimeSec > 0) {
            totalDeltaSec += q.deltaTimeSec;
            timedQuestionsCount++;
          }
          if (q.errorType === 'memory') totalMem++;
          else if (q.errorType === 'concept') totalConc++;
          else if (q.errorType === 'reading') totalRead++;
          else if (q.errorType === 'speed') totalSpd++;
        }
      });
    });
  });

  const lifetimeAcc = totalQuestionsAttempted > 0
    ? Math.round((totalConfirmed / totalQuestionsAttempted) * 100)
    : 0;
  const lifetimeAvgSpeed = timedQuestionsCount > 0
    ? Math.round(totalDeltaSec / timedQuestionsCount)
    : 0;

  const denom = Math.max(1, totalQuestionsAttempted);
  const cumulativeRadar = {
    memory: Math.max(20, 100 - Math.round((totalMem / denom) * 150)),
    concept: Math.max(20, 100 - Math.round((totalConc / denom) * 150)),
    reading: Math.max(20, 100 - Math.round((totalRead / denom) * 150)),
    speed: Math.max(20, 100 - Math.round((totalSpd / denom) * 150))
  };

  const subjects = ["All", ...getSubjectList()];

  return `
  <div class="box" style="margin-top:14px;">
    <div class="box-header">
      <span>CUMULATIVE DRILL METRICS &amp; MULTI-AXIS RADAR (LIFETIME / ALL SESSIONS)</span>
      <div class="flex-row">
        ${subjects.map(subj => `
          <button class="${filterSubj === subj ? 'active' : ''}" style="font-size:10px;padding:2px 6px;" onclick="setPracticeFilterSubj('${subj}')">
            ${subj}
          </button>
        `).join('')}
      </div>
    </div>

    <!-- Scoped Flag Filtering Toolbar -->
    <div class="flex-row" style="gap:4px;margin-top:8px;padding-bottom:6px;border-bottom:1px solid var(--border);">
      <span class="tag" style="font-size:10px;">OUTCOME SCOPE:</span>
      <button class="${flagFilter === 'ALL' ? 'active' : ''}" style="font-size:10px;padding:2px 6px;" onclick="setAnalysisFlagFilter('ALL')">All Outcomes</button>
      <button class="${flagFilter === 'C' ? 'active' : ''}" style="font-size:10px;padding:2px 6px;color:var(--status-c);font-weight:700;" onclick="setAnalysisFlagFilter('C')">[C] Confirmed Only</button>
      <button class="${flagFilter === 'W' ? 'active' : ''}" style="font-size:10px;padding:2px 6px;color:var(--status-w);font-weight:700;" onclick="setAnalysisFlagFilter('W')">[W] Speed Only</button>
      <button class="${flagFilter === 'X' ? 'active' : ''}" style="font-size:10px;padding:2px 6px;color:var(--status-x);font-weight:700;" onclick="setAnalysisFlagFilter('X')">[X] Errors Only</button>
      <button class="${flagFilter === 'WX' ? 'active' : ''}" style="font-size:10px;padding:2px 6px;color:var(--status-x);font-weight:700;" onclick="setAnalysisFlagFilter('WX')">[W + X] All Issues</button>
    </div>

    <div class="split-2" style="margin-top:8px;">
      <div>
        <div class="session-summary-grid">
          <div class="stat-card-mini">
            <div class="stat-card-val">${filtered.length}</div>
            <div class="stat-card-lbl">Total Sessions</div>
          </div>
          <div class="stat-card-mini">
            <div class="stat-card-val">${totalQuestionsAttempted}</div>
            <div class="stat-card-lbl">Questions Solved</div>
          </div>
          <div class="stat-card-mini">
            <div class="stat-card-val" style="color:var(--status-c);">${lifetimeAcc}%</div>
            <div class="stat-card-lbl">Lifetime Accuracy</div>
          </div>
          <div class="stat-card-mini">
            <div class="stat-card-val">${lifetimeAvgSpeed}s</div>
            <div class="stat-card-lbl">Avg Delta / Q</div>
          </div>
        </div>

        <table>
          <thead><tr><th>Error Category</th><th>Total Recorded</th><th>% of Attempted</th></tr></thead>
          <tbody>
            <tr><td><strong>1. Memory / Fact [X]</strong></td><td>${totalMem}</td><td>${totalQuestionsAttempted > 0 ? Math.round((totalMem / totalQuestionsAttempted) * 100) : 0}%</td></tr>
            <tr><td><strong>2. Concept / Constraint [X]</strong></td><td>${totalConc}</td><td>${totalQuestionsAttempted > 0 ? Math.round((totalConc / totalQuestionsAttempted) * 100) : 0}%</td></tr>
            <tr><td><strong>3. Careless / Reading [X]</strong></td><td>${totalRead}</td><td>${totalQuestionsAttempted > 0 ? Math.round((totalRead / totalQuestionsAttempted) * 100) : 0}%</td></tr>
            <tr><td><strong>4. Speed Bottleneck [W]</strong></td><td>${totalSpd}</td><td>${totalQuestionsAttempted > 0 ? Math.round((totalSpd / totalQuestionsAttempted) * 100) : 0}%</td></tr>
          </tbody>
        </table>
      </div>

      <div class="radar-box">
        <span style="font-family:var(--font-mono);font-size:11px;font-weight:700;margin-bottom:4px;">CUMULATIVE ERROR DIAGNOSIS PROFILE</span>
        ${generateRadarSVG(cumulativeRadar, 230)}
      </div>
    </div>
  </div>`;
}

                    <button style="padding:0 3px;font-size:9px;color:var(--status-x);" onclick="removeCustomMetadata('${type}', ${idx})">[x]</button>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>

    <div class="flex-row" style="justify-content:flex-end;margin-top:14px;gap:8px;">
      <button class="active" style="padding:8px 18px;" onclick="saveDefaultSettingsMenu()">[SAVE ALL GLOBAL DEFAULTS]</button>
    </div>
  </div>`;
}

function saveDefaultSettingsMenu() {
  if (!state.practiceSettings) state.practiceSettings = {};
  if (!state.timerOnly) state.timerOnly = {};

  state.practiceSettings.examThresholds = {
    "JEE Advanced": parseInt(document.getElementById("defThreshJEEAdv")?.value) || 180,
    "JEE Main": parseInt(document.getElementById("defThreshJEEMain")?.value) || 120,
    "NEET": parseInt(document.getElementById("defThreshNEET")?.value) || 90,
    "IAT / NEST": parseInt(document.getElementById("defThreshIAT")?.value) || 150,
    "Custom Drill": 120
  };

  state.practiceSettings.enableAutoWThreshold = document.getElementById("defAutoWToggle")?.checked;
  state.practiceSettings.optionStyle = document.getElementById("defOptStyle")?.value || "ABCD";
  state.practiceSettings.defaultQCount = parseInt(document.getElementById("defQCount")?.value) || 30;

  state.practiceSettings.ttsMode = document.getElementById("defTTSMode")?.value || "delta";
  state.practiceSettings.deltaIntervals = document.getElementById("defDeltaIntervals")?.value || "30,60,90,120";
  state.practiceSettings.fullIntervals = document.getElementById("defFullIntervals")?.value || "300,600,900";
  state.practiceSettings.enableBeeps = document.getElementById("defBeeps")?.checked;
  state.practiceSettings.enableSpeech = document.getElementById("defSpeech")?.checked;
  state.practiceSettings.speechRate = parseFloat(document.getElementById("defSpeechRate")?.value) || 1.15;
  state.practiceSettings.nudgeStepSec = parseInt(document.getElementById("defNudgeStep")?.value) || 5;

  state.practiceSettings.pomodoroWorkMin = parseInt(document.getElementById("defPomoWork")?.value) || 25;
  state.practiceSettings.useDynamicBreak = document.getElementById("defPomoMethod")?.value === "dynamic";
  state.timerOnly.targetDurationSec = parseInt(document.getElementById("defTimerTargetSec")?.value) || 3600;

  saveAllStorage();
  alert("Global Default Settings saved successfully!");
  renderWorkspace();
}

    </div>`;
  }

  // Active OMR Spreadsheet Interface
  const currentSheetIndex = activeSession.activeSheetIndex || 0;
  const currentSheet = activeSession.sheets[currentSheetIndex] || activeSession.sheets[0];
  const isTimerRunning = activeTimerState.isRunning && activeTimerState.sessionId === activeSession.id;

  const now = Date.now();
  const sessionElapsedMs = isTimerRunning
    ? (now - activeTimerState.startTime) + activeTimerState.accumulatedSessionMs
    : (currentSheet.elapsedSessionMs || 0);
  const sessionSec = Math.floor(sessionElapsedMs / 1000);
  const deltaSec = Math.max(0, sessionSec - (currentSheet.questionStartSessionSec || 0) + (currentSheet.nudgeDeltaSec || 0));

  const optLabels = (currentSheet.optionStyle === "1234") ? ["1", "2", "3", "4"] : ["A", "B", "C", "D"];
  const ttsMode = currentSheet.ttsMode || state.practiceSettings.ttsMode || "delta";

  return `

                    <div class="active-badge-container" id="active_badge_${activeSession.id}_${currentSheetIndex}_${idx}" style="min-height:14px;line-height:1;">

function getLivePracticeDashWidgetHTML() {
  const sessions = state.sessions || [];
  let totalQs = 0;
  let totalC = 0;
  let totalDeltaSec = 0;
  let timedQs = 0;
  let mem = 0, conc = 0, read = 0, spd = 0;

  sessions.forEach(s => {
    (s.sheets || []).forEach(sh => {
      (sh.questions || []).forEach(q => {
        if (q.selectedOption !== null) {
          totalQs++;
          if (q.flag === 'C') totalC++;
          if (q.deltaTimeSec > 0) {
            totalDeltaSec += q.deltaTimeSec;
            timedQs++;
          }
          if (q.errorType === 'memory') mem++;
          else if (q.errorType === 'concept') conc++;
          else if (q.errorType === 'reading') read++;
          else if (q.errorType === 'speed') spd++;
        }
      });
    });
  });

  const acc = totalQs > 0 ? Math.round((totalC / totalQs) * 100) : 0;
  const avgSpeed = timedQs > 0 ? Math.round(totalDeltaSec / timedQs) : 0;
  const denom = Math.max(1, totalQs);
  const radar = {
    memory: Math.max(20, 100 - Math.round((mem / denom) * 150)),
    concept: Math.max(20, 100 - Math.round((conc / denom) * 150)),
    reading: Math.max(20, 100 - Math.round((read / denom) * 150)),
    speed: Math.max(20, 100 - Math.round((spd / denom) * 150))
  };

  const lastSess = sessions.length > 0 ? sessions[0] : null;

  return `
  <div class="box">
    <div class="box-header">
      <span>[LIVE PRACTICE &amp; ACCURACY HUB]</span>
      <button style="font-size:10px;padding:2px 6px;" onclick="switchTab('practice')">[Open Hub]</button>
    </div>
    <div class="split-2" style="margin-top:6px;">
      <div>
        <div class="session-summary-grid" style="grid-template-columns:1fr 1fr;gap:6px;">
          <div class="stat-card-mini">
            <div class="stat-card-val">${totalQs}</div>
            <div class="stat-card-lbl">Questions Solved</div>
          </div>
          <div class="stat-card-mini">
            <div class="stat-card-val" style="color:var(--status-c);">${acc}%</div>
            <div class="stat-card-lbl">Lifetime Acc</div>
          </div>
          <div class="stat-card-mini">
            <div class="stat-card-val">${avgSpeed}s</div>
            <div class="stat-card-lbl">Avg Delta / Q</div>
          </div>
          <div class="stat-card-mini">
            <div class="stat-card-val">${sessions.length}</div>
            <div class="stat-card-lbl">Sessions</div>
          </div>
        </div>

        <div style="margin-top:8px;">
          ${lastSess ? `
            <div style="font-size:11px;margin-bottom:6px;">
              Recent: <strong>${lastSess.chapterName}</strong> (${lastSess.exam})
            </div>
            <button class="active" style="width:100%;padding:4px;" onclick="resumePracticeSession('${lastSess.id}')">
              [Resume Recent Session]
            </button>
          ` : `
            <button class="active" style="width:100%;padding:4px;" onclick="switchTab('practice')">
              [Start 1st Practice Session]
            </button>
          `}
        </div>
      </div>

      <div class="radar-box" style="padding:4px;">
        <span style="font-family:var(--font-mono);font-size:9.5px;font-weight:700;">MASTERY RADAR PROFILE</span>
        ${generateRadarSVG(radar, 150)}
      </div>
    </div>
  </div>`;
}

function renderWorkspace() {
  const ws = document.getElementById("workspace");

  // Preserve scroll positions of all scroll containers
  const scrollMap = [];
  ws.querySelectorAll(".omr-container, .pane-body").forEach(el => {
    scrollMap.push({ top: el.scrollTop, left: el.scrollLeft });
  });
  const winScrollY = (typeof window !== "undefined") ? window.scrollY : 0;

  const count = state.paneCount || 1;
  ws.className = `workspace panes-${count}`;
  
  let html = "";
  for (let i = 0; i < count; i++) {
    const currentTab = state.panes[i] || "dashboard";
    html += `
      <div class="pane">
        <div class="pane-header">
          <div class="flex-row">
            <span style="font-weight:700;">PANE ${i + 1}:</span>
            <select onchange="changePaneTab(${i}, this.value)">

              <option value="timer" ${currentTab === "timer" ? "selected" : ""}>[Timer Only]</option>
              <option value="practice" ${currentTab === "practice" ? "selected" : ""}>[Timer &amp; Questions]</option>
              <option value="manual" ${currentTab === "manual" ? "selected" : ""}>Full Manual</option>
              <option value="flowcharts" ${currentTab === "flowcharts" ? "selected" : ""}>Visual Flowcharts</option>
              <option value="reference" ${currentTab === "reference" ? "selected" : ""}>Quick Reference</option>
              <option value="tracker" ${currentTab === "tracker" ? "selected" : ""}>GPS Tracker</option>
              <option value="calendar" ${currentTab === "calendar" ? "selected" : ""}>Auto-Calendar</option>
              <option value="faq" ${currentTab === "faq" ? "selected" : ""}>Troubleshooting / FAQ</option>
              <option value="templates" ${currentTab === "templates" ? "selected" : ""}>Obsidian Generator</option>
              <option value="storage" ${currentTab === "storage" ? "selected" : ""}>Data & Backup.zip</option>
            </select>
          </div>
          <button style="font-size:10px;padding:2px 6px;" onclick="maximizePaneTab(${i})">Maximize</button>
        </div>
        <div class="pane-body">
          ${getTabContent(currentTab)}
        </div>
      </div>
    `;
  }
  ws.innerHTML = html;

  // Restore all scroll positions immediately
  const newScrollables = ws.querySelectorAll(".omr-container, .pane-body");
  newScrollables.forEach((el, idx) => {
    if (scrollMap[idx]) {
      el.scrollTop = scrollMap[idx].top;
      el.scrollLeft = scrollMap[idx].left;
    }
  });
  if (typeof window !== "undefined") window.scrollTo(window.scrollX, winScrollY);

  updateNavHighlight();
  updateStatusBar();
  bindConceptLinks();
  requestAnimationFrame(() => triggerMathRender(ws));
}

function performGlobalSearch(query) {
  query = query.trim().toLowerCase();
  if (!query) return;
  let matches = [];
  
  Object.keys(CONCEPTS).forEach(k => {
    const item = CONCEPTS[k];
    if (item.title.toLowerCase().includes(query) || item.body.toLowerCase().includes(query)) {
      matches.push({ type: "Concept", title: item.title, action: () => openConceptModal(k) });
    }
  });

  FAQS.forEach((f, idx) => {
    if (f.q.toLowerCase().includes(query) || f.a.toLowerCase().includes(query)) {
      matches.push({ type: "FAQ", title: f.q, action: () => switchTab("faq") });
    }
  });

  state.chapters.forEach(c => {
    if (c.name.toLowerCase().includes(query) || c.subj.toLowerCase().includes(query)) {
      matches.push({ type: "Chapter", title: `[${c.subj}] ${c.name}`, action: () => selectChapterAndOpenFlow(c.id) });
    }
  });

  if (!matches.length) {
    alert("No exact matches found for: " + query);
    return;
  }
  
  const body = matches.slice(0, 10).map((m, idx) => `
    <div style="border-bottom:1px solid var(--border);padding:6px 0;display:flex;justify-content:space-between;align-items:center;">
      <div><span class="tag">${m.type}</span><strong>${m.title}</strong></div>
      <button onclick="globalSearchResults[${idx}].action();closeModal();">Open</button>
    </div>
  `).join("");
  
  window.globalSearchResults = matches;
  document.getElementById("modalTitle").textContent = `Search Results (${matches.length})`;
  document.getElementById("modalBody").innerHTML = body;
  document.getElementById("conceptModal").style.display = "flex";
}

function makeCRC32Table() {
  const cTable = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) {
      c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    }
    cTable[n] = c >>> 0;
  }
  return cTable;
}
const CRC32_TABLE = makeCRC32Table();

function crc32(uint8Array) {
  let crc = 0 ^ (-1);
  for (let i = 0; i < uint8Array.length; i++) {
    crc = (crc >>> 8) ^ CRC32_TABLE[(crc ^ uint8Array[i]) & 0xFF];
  }
  return (crc ^ (-1)) >>> 0;
}

function createZipArchive(files) {
  let localHeaders = [];
  let centralHeaders = [];
  let offset = 0;

  files.forEach(file => {
    const nameBytes = new TextEncoder().encode(file.name);
    const dataBytes = file.data;
    const fileCrc = crc32(dataBytes);
    const size = dataBytes.length;

    const lh = new Uint8Array(30 + nameBytes.length + size);
    const lView = new DataView(lh.buffer);
    lView.setUint32(0, 0x04034b50, true);
    lView.setUint16(4, 20, true);
    lView.setUint16(6, 0, true);
    lView.setUint16(8, 0, true);
    lView.setUint16(10, 0, true);
    lView.setUint16(12, 0, true);
    lView.setUint32(14, fileCrc, true);
    lView.setUint32(18, size, true);
    lView.setUint32(22, size, true);
    lView.setUint16(26, nameBytes.length, true);
    lView.setUint16(28, 0, true);
    lh.set(nameBytes, 30);
    lh.set(dataBytes, 30 + nameBytes.length);
    localHeaders.push(lh);

    const ch = new Uint8Array(46 + nameBytes.length);
    const cView = new DataView(ch.buffer);
    cView.setUint32(0, 0x02014b50, true);
    cView.setUint16(4, 20, true);
    cView.setUint16(6, 20, true);
    cView.setUint16(8, 0, true);
    cView.setUint16(10, 0, true);
    cView.setUint16(12, 0, true);
    cView.setUint16(14, 0, true);
    cView.setUint32(16, fileCrc, true);
    cView.setUint32(20, size, true);
    cView.setUint32(24, size, true);
    cView.setUint16(28, nameBytes.length, true);
    cView.setUint16(30, 0, true);
    cView.setUint16(32, 0, true);
    cView.setUint16(34, 0, true);
    cView.setUint16(36, 0, true);
    cView.setUint32(38, 0, true);
    cView.setUint32(42, offset, true);
    ch.set(nameBytes, 46);
    centralHeaders.push(ch);

    offset += lh.length;
  });

  const centralOffset = offset;
  let centralSize = 0;
  centralHeaders.forEach(ch => centralSize += ch.length);

  const eocd = new Uint8Array(22);
  const eView = new DataView(eocd.buffer);
  eView.setUint32(0, 0x06054b50, true);
  eView.setUint16(4, 0, true);
  eView.setUint16(6, 0, true);
  eView.setUint16(8, files.length, true);
  eView.setUint16(10, files.length, true);
  eView.setUint32(12, centralSize, true);
  eView.setUint32(16, centralOffset, true);
  eView.setUint16(20, 0, true);

  const totalLength = centralOffset + centralSize + 22;
  const out = new Uint8Array(totalLength);
  let pos = 0;
  localHeaders.forEach(lh => { out.set(lh, pos); pos += lh.length; });
  centralHeaders.forEach(ch => { out.set(ch, pos); pos += ch.length; });
  out.set(eocd, pos);
  return out;
}

  const stateJsonStr = JSON.stringify(state, null, 2);
  const csvStr = "ID,Subject,Chapter,Type,Category,Stage,D0_Date,Accuracy,WX_Log\n" +

      });

  const manualArea = document.getElementById("manualContent");

  const files = [

async function importBackupFile() {
  const input = document.getElementById("backupFileInput");
  const msg = document.getElementById("importMsg");
  if (!input || !input.files || !input.files[0]) {
    if (msg) msg.textContent = "Please select a file first.";
    return;
  }
  const file = input.files[0];
  try {
    if (file.name.endsWith(".json")) {
      const text = await file.text();
      const parsed = JSON.parse(text);
      if (Array.isArray(parsed.chapters)) {
        state = Object.assign({}, state, parsed);
        await saveAllStorage();
        renderWorkspace();
        if (msg) msg.textContent = "RESTORED STATE.JSON SUCCESSFULLY!";
        return;
      }
    } else if (file.name.endsWith(".zip")) {
      const buf = await file.arrayBuffer();
      const bytes = new Uint8Array(buf);
      const str = new TextDecoder("utf-8", { fatal: false }).decode(bytes);
      const startTag = '{"theme"';
      const idx = str.indexOf(startTag);
      if (idx !== -1) {
        let depth = 0, endIdx = -1;
        for (let i = idx; i < str.length; i++) {
          if (str[i] === '{') depth++;
          else if (str[i] === '}') {
            depth--;
            if (depth === 0) { endIdx = i + 1; break; }
          }
        }
        if (endIdx !== -1) {
          const parsed = JSON.parse(str.slice(idx, endIdx));
          state = Object.assign({}, state, parsed);
          await saveAllStorage();
          renderWorkspace();
          if (msg) msg.textContent = "RESTORED FROM BACKUP.ZIP SUCCESSFULLY!";
          return;
        }
      }
      throw new Error("Could not find valid JSON state within ZIP archive.");
    }
  } catch (err) {
    if (msg) msg.textContent = "IMPORT FAILED: " + err.message;
  }
}
