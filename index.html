<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ab's stem manual</title>
<style>
:root {
  --bg: #ffffff;
  --bg-alt: #f5f5f5;
  --fg: #111111;
  --fg-muted: #555555;
  --border: #cccccc;
  --border-dark: #111111;
  --accent: #111111;
  --hl: #e8e8e8;
  --status-c: #1b5e20;
  --status-w: #e65100;
  --status-x: #b71c1c;
  --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
[data-theme="dark"] {
  --bg: #0d0d0d;
  --bg-alt: #161616;
  --fg: #e6e6e6;
  --fg-muted: #999999;
  --border: #333333;
  --border-dark: #e6e6e6;
  --accent: #ffffff;
  --hl: #262626;
  --status-c: #4caf50;
  --status-w: #ff9800;
  --status-x: #f44336;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.5;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
a, .concept-link {
  color: var(--fg);
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
  font-weight: 600;
}
a:hover, .concept-link:hover { background: var(--hl); }
button, select, input, textarea {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--border-dark);
  padding: 4px 8px;
  outline: none;
}
button { cursor: pointer; font-weight: 600; }
button:hover, button.active { background: var(--fg); color: var(--bg); }
input[type="text"], input[type="date"], input[type="number"], select, textarea {
  border: 1px solid var(--border);
}
input:focus, select:focus, textarea:focus { border-color: var(--border-dark); }
table { width: 100%; border-collapse: collapse; margin: 8px 0 14px 0; font-size: 12px; }
th, td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
th { background: var(--bg-alt); font-family: var(--font-mono); font-weight: 700; }
h1, h2, h3, h4 { font-family: var(--font-mono); font-weight: 700; margin: 12px 0 6px 0; line-height: 1.25; }
h1 { font-size: 18px; border-bottom: 2px solid var(--border-dark); padding-bottom: 4px; }
h2 { font-size: 15px; border-bottom: 1px solid var(--border); padding-bottom: 3px; margin-top: 16px; }
h3 { font-size: 13px; margin-top: 12px; }
p, ul, ol { margin-bottom: 8px; }
ul, ol { padding-left: 18px; }
li { margin-bottom: 3px; }
code, pre, .math { font-family: var(--font-mono); background: var(--bg-alt); }
code, .math { padding: 1px 4px; border: 1px solid var(--border); font-size: 11.5px; }
pre { padding: 10px; border: 1px solid var(--border); overflow-x: auto; margin: 8px 0; font-size: 11.5px; white-space: pre-wrap; }
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 12px;
  border-bottom: 2px solid var(--border-dark);
  background: var(--bg);
  gap: 8px;
  flex-wrap: wrap;
}
.brand { font-family: var(--font-mono); font-size: 15px; font-weight: 700; letter-spacing: -0.5px; }
.nav-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.toolbar-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
#globalSearch { width: 210px; }
.workspace {
  flex: 1;
  display: grid;
  gap: 0;
  overflow: hidden;
  height: calc(100vh - 76px);
}
.workspace.panes-1 { grid-template-columns: 1fr; }
.workspace.panes-2 { grid-template-columns: 1fr 1fr; }
.workspace.panes-3 { grid-template-columns: 1fr 1fr 1fr; }
.workspace.panes-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.pane {
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border-dark);
  border-bottom: 1px solid var(--border-dark);
  overflow: hidden;
  background: var(--bg);
}
.pane-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 10px;
  background: var(--bg-alt);
  border-bottom: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 11px;
}
.pane-body {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}
.dash-grid {
  display: grid;
  grid-template-columns: 1.15fr 1fr 1fr;
  gap: 12px;
  height: 100%;
}
@media (max-width: 1100px) {
  .dash-grid { grid-template-columns: 1fr; height: auto; }
}
.box {
  border: 1px solid var(--border-dark);
  padding: 10px;
  margin-bottom: 10px;
  background: var(--bg);
}
.box-header {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 12px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 4px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.flow-container {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 8px 0;
}
.flow-node {
  border: 1px solid var(--border-dark);
  padding: 6px 8px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  background: var(--bg);
  position: relative;
  cursor: pointer;
}
.flow-node.active-gps {
  border: 2px solid var(--border-dark);
  background: var(--hl);
  font-weight: 700;
}
.flow-arrow {
  text-align: center;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg-muted);
  line-height: 1;
}
.gps-badge {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 1px 5px;
  border: 1px solid var(--border-dark);
  background: var(--fg);
  color: var(--bg);
  margin-left: 4px;
  font-weight: 700;
}
.tag {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 1px 4px;
  border: 1px solid var(--border);
  background: var(--bg-alt);
  margin-right: 4px;
}
.flag-C { color: var(--status-c); border-color: var(--status-c); font-weight: 700; }
.flag-W { color: var(--status-w); border-color: var(--status-w); font-weight: 700; }
.flag-X { color: var(--status-x); border-color: var(--status-x); font-weight: 700; }
.progress-bar {
  width: 100%;
  height: 10px;
  border: 1px solid var(--border-dark);
  background: var(--bg-alt);
  margin: 4px 0;
}
.progress-fill {
  height: 100%;
  background: var(--fg);
  transition: width 0.2s;
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  font-family: var(--font-mono);
  font-size: 11px;
}
.cal-cell {
  border: 1px solid var(--border);
  min-height: 62px;
  padding: 3px;
  background: var(--bg);
}
.cal-cell.today { border: 2px solid var(--border-dark); }
.cal-date { font-weight: 700; font-size: 10px; margin-bottom: 2px; }
.cal-ev {
  font-size: 9.5px;
  padding: 1px 3px;
  border: 1px solid var(--border-dark);
  margin-bottom: 2px;
  background: var(--bg-alt);
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cal-ev.done { text-decoration: line-through; opacity: 0.5; }
.statusbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 12px;
  border-top: 1px solid var(--border-dark);
  background: var(--bg-alt);
  font-family: var(--font-mono);
  font-size: 11px;
}
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.modal {
  background: var(--bg);
  border: 2px solid var(--border-dark);
  width: 90%;
  max-width: 680px;
  max-height: 82vh;
  display: flex;
  flex-direction: column;
}
.modal-head {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border-dark);
  background: var(--bg-alt);
  font-family: var(--font-mono);
  font-weight: 700;
  display: flex;
  justify-content: space-between;
}
.modal-content { padding: 12px; overflow-y: auto; }
.flex-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.split-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 768px) { .split-2 { grid-template-columns: 1fr; } }
mark { background: var(--fg); color: var(--bg); padding: 0 2px; }
</style>
</head>

function offsetDate(days, baseStr) {
  const d = baseStr ? new Date(baseStr + "T00:00:00") : new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function buildAutoEvents() {
  const events = [];
  state.chapters.forEach(ch => {
    if (!ch.d0) return;
    const schedule = [
      { code: "D0", offset: 0, label: "D0: Acquisition & PYQ Drill", targetStage: 4 },
      { code: "D1", offset: 1, label: "D1: Unaided Blank-Sheet Recall (15m)", targetStage: 5 },
      { code: "D3", offset: 3, label: "D3: Timed Unseen PYQ Stress Test (35m)", targetStage: 6 },
      { code: "D7", offset: 7, label: "D7: Redo [X] & [W] Errors Only (20m)", targetStage: 7 },
      { code: "D21", offset: 21, label: "D21: Cumulative Multi-Chapter Mock (60m)", targetStage: 8 }
    ];
    if (ch.stage === 9) {
      schedule.push(
        { code: "RESET-D1", offset: 1, label: "RESET D1: Blank-Sheet Recall (>30% Mock Error)", targetStage: 5 },
        { code: "RESET-D3", offset: 3, label: "RESET D3: Timed PYQ Re-Test", targetStage: 6 },
        { code: "RESET-D7", offset: 7, label: "RESET D7: Error Redo", targetStage: 7 }
      );
    }
    schedule.forEach(item => {
      const dateStr = offsetDate(item.offset, ch.d0);
      const evId = `${ch.id}_${item.code}_${dateStr}`;
      const autoDone = ch.stage >= item.targetStage && ch.stage !== 9;
      events.push({
        id: evId,
        chId: ch.id,
        chName: ch.name,
        subj: ch.subj,
        code: item.code,
        date: dateStr,
        label: item.label,
        targetStage: item.targetStage,
        done: Boolean(state.completedEvents[evId] || autoDone)
      });
    });
  });
  return events.sort((a, b) => a.date.localeCompare(b.date));
}

const DB_NAME = "abs_stem_manual_db";
const STORE_NAME = "app_state";

function openIDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) return reject("No IDB");
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e);
  });
}

async function saveAllStorage() {
  const json = JSON.stringify(state);
  try { localStorage.setItem("abs_stem_state", json); } catch (e) {}
  try {
    const compact = JSON.stringify({
      t: state.theme,
      p: state.paneCount,
      s: state.selectedChapterId,
      c: state.chapters.map(c => [c.id, c.stage, c.d0, c.acc])
    });
    document.cookie = "abs_stem_cookie=" + encodeURIComponent(compact) + "; max-age=31536000; path=/; SameSite=Lax";
  } catch (e) {}
  try {
    const db = await openIDB();
    const tx = db.transaction(STORE_NAME, "readwrite");
    tx.objectStore(STORE_NAME).put(state, "master");
  } catch (e) {}
  updateStatusBar();
}

async function loadAllStorage() {
  if (navigator.storage && navigator.storage.persist) {
    try { await navigator.storage.persist(); } catch (e) {}
  }
  let loaded = null;
  try {
    const db = await openIDB();
    loaded = await new Promise(res => {
      const tx = db.transaction(STORE_NAME, "readonly");
      const req = tx.objectStore(STORE_NAME).get("master");
      req.onsuccess = () => res(req.result);
      req.onerror = () => res(null);
    });
  } catch (e) {}
  if (!loaded) {
    try {
      const ls = localStorage.getItem("abs_stem_state");
      if (ls) loaded = JSON.parse(ls);
    } catch (e) {}
  }
  if (!loaded) {
    try {
      const match = document.cookie.match(/(?:^|;\s*)abs_stem_cookie=([^;]*)/);
      if (match) {
        const cData = JSON.parse(decodeURIComponent(match[1]));
        if (cData.t) state.theme = cData.t;
        if (cData.p) state.paneCount = cData.p;
        if (Array.isArray(cData.c)) {
          cData.c.forEach(([id, stg, d0, acc]) => {
            const target = state.chapters.find(x => x.id === id);
            if (target) { target.stage = stg; target.d0 = d0; target.acc = acc; }
          });
        }
      }
    } catch (e) {}
  } else {
    state = Object.assign({}, state, loaded);
  }
  document.documentElement.setAttribute("data-theme", state.theme);
  document.getElementById("paneCountSelect").value = String(state.paneCount || 1);
}

function updateStatusBar() {
  const today = offsetDate(0);
  const evs = buildAutoEvents();
  const dueToday = evs.filter(e => e.date === today && !e.done).length;
  const activeCount = state.chapters.filter(c => c.stage > 0 && c.stage < 8).length;
  const doneCount = state.chapters.filter(c => c.stage >= 4 && c.stage !== 9).length;
  const pct = state.chapters.length ? Math.round((doneCount / state.chapters.length) * 100) : 0;
  document.getElementById("statsStatus").textContent =
    `ACTIVE CHAPTERS: ${activeCount} | DUE TODAY (${today}): ${dueToday} | SYLLABUS D0+ DONE: ${doneCount}/${state.chapters.length} (${pct}%)`;
}

          <td>F: N | q: C | v: m/s | B: Tesla (T) | theta: angle(v, B)</td>
          <td>Moving point charge in magnetic field B</td>
          <td><strong>Zero Limit:</strong> F = 0 at q=0, v=0, theta=0 or 180 deg. <strong>Max Limit:</strong> theta=90 deg.<br><strong>Zero-Work Trap:</strong> F is always perpendicular to v =&gt; Magnetic force does ZERO work (W = 0) and cannot change speed/KE.</td>
        </tr>
      </tbody>
    </table>

    <h2 id="sec-p2-data">5. Phase 2B: Data-Heavy Navigation (Biology & Inorganic via NCERT)</h2>
    <p>Never write Obsidian summary notes for descriptive Biology or Inorganic chapters. Execute this 4-Pass sequence directly inside NCERT:</p>
    <ol>
      <li><strong>Pass 0 (5-Min Orientation Scan):</strong> Scan headings, subheadings, diagram titles, and table headers without reading prose.</li>
      <li><strong>Pass 1 (PYQ High-Value Zone Creation):</strong> Take 10-15 chapter PYQs, locate the exact answering sentence in NCERT, and highlight <em>only the minimum answering phrase</em>. Highlighted zones = exam; white space = low-yield filler.</li>
      <li><strong>Pass 2 (Visual Anchor Scan):</strong> Read in strict priority order: (1) <strong>Diagrams & Figure Captions</strong> (test labeling from memory), (2) <strong>Tables</strong> (every row is a pre-built MCQ; cover one column and recite), (3) <strong>Bold/Italic Keywords</strong>, (4) Binding prose only inside PYQ-highlighted zones.</li>
      <li><strong>Pass 3 (<span class="concept-link" data-concept="blank-line-protocol">Blank-Line Redaction Protocol</span>):</strong> On highlighted lines, captions, and tables, cover the testable noun/number/contrast word with your finger and state it aloud. Instant recall = [C]; wrong/blank = [X] -&gt; create a Cloze Anki card the same day.</li>
    </ol>

    <h2 id="sec-p2-hybrid">6. Phase 2C: Hybrid Navigation (Organic Chemistry)</h2>
    <ul>
      <li><strong>Track 1 — The "Why" Layer (Mechanisms & Electron Logic):</strong> Read NCERT Organic prose at half-speed filtering strictly for intermediate stability, RDS, regio/stereoselectivity, rearrangements, and exceptions. Trace curved arrows on your Left Column scratchpad (tail = electron source, head = electrophilic destination). If obvious from GOC electrostatics, discard the scratchpad and write nothing. If it breaks intuition or causes an [X] error, log a <span class="concept-link" data-concept="mechanism-fix">5-Line Mechanism Fix Note</span> in Obsidian (Title, Trigger, 1-3 line Rule, Mini Example, Exam Trap).</li>
      <li><strong>Track 2 — The "What" Layer (Reagents & Named Reactions):</strong> Extract 5 fields per reaction (Name, Starting Material Pattern, Reagent & Exact Conditions, Major Product, High-Frequency Exception) into your Obsidian Reaction Table and suspended <span class="concept-link" data-concept="candidate-deck">Organic Candidate Deck</span>.</li>
    </ul>

    <h2 id="sec-p3">7. Phase 3: Problem Drilling, Flagging & 2-Minute Unblocking</h2>
    <ol>
      <li><strong><span class="concept-link" data-concept="split-30-70">30/70 Solved Example Split</span>:</strong> Read the first 20-30% of solved examples uncovered like source code (inputs -&gt; chosen API formula -&gt; key transformation). Cover the remaining 70% and solve completely on your scratchpad. (If a chapter has &lt;6 examples, trace all once, then close the book and re-solve all from scratch).</li>
      <li><strong>Universal Flagging (<span class="concept-link" data-concept="flags-cwx">[C] / [W] / [X]</span>):</strong> Mark every active example, exercise, and PYQ.</li>
      <li><strong><span class="concept-link" data-concept="unblocking-ladder">2-Minute Unblocking Ladder</span>:</strong> Stuck &gt;2 min? (1) 30s unit/sign check against API table -&gt; (2) 90s scan of nearby solved examples -&gt; (3) &lt;=10-min targeted YouTube debugger query for that exact step. Log a 1-3 line fix and return immediately.</li>
      <li><strong>Hard "Done" Criteria:</strong> Exit Day 0 acquisition when you achieve <strong>&gt;=70-80% accuracy on a timed Chapter PYQ set</strong> and your error log stops producing new recurring conceptual bugs.</li>
    </ol>

    <h2 id="sec-algo">8. Procedural Algorithm Tracing & Solution Autopsy</h2>
    <p>Acquire multi-step problem methods via <span class="concept-link" data-concept="algorithm-tracing">Algorithm Tracing</span> and <span class="concept-link" data-concept="solution-autopsy">Solution Autopsy</span> rather than reading prose paragraphs:</p>
    <div class="split-2">
      <div class="box">
        <div class="box-header"><span>PSEUDO-CODE 1: KIRCHHOFF NODAL 'x' METHOD</span></div>
        <ol>
          <li>Label main multi-branch junction potential as <code>x</code>.</li>
          <li>Label clean bottom wire (reference ground) as <code>0 V</code>.</li>
          <li>Assign known node voltages via connected batteries.</li>
          <li>Assume <code>x</code> is highest potential; write KCL (sum of outgoing currents = 0): <code>(x - V1)/R1 + (x - V2)/R2 + (x - V3)/R3 = 0</code> and solve in one line.</li>
        </ol>
      </div>
      <div class="box">
        <div class="box-header"><span>PSEUDO-CODE 2: CAVITY NEGATIVE MASS TRICK</span></div>
        <ol>
          <li>Treat uncut full body of radius R as positive mass <code>M1 = +M</code> at <code>(X1, Y1)</code>.</li>
          <li>Treat removed cavity (e.g., r = R/2) as negative mass <code>M2 = -m</code> (scaled by r^3 in 3D or r^2 in 2D) at cavity center <code>(X2, Y2)</code>.</li>
          <li>Compute <code>X_com = (M1*X1 - |M2|*X2) / (M1 - |M2|)</code> in 30 seconds.</li>
        </ol>
      </div>
    </div>

    <h2 id="sec-p4">9. Phase 4: Parallel Spaced Retrieval (<span class="concept-link" data-concept="spaced-d0-d21">D0 / D1 / D3 / D7 / D21</span>) & <span class="concept-link" data-concept="Candidate-deck">Anki Rules</span></h2>
    <ul>
      <li><strong>Daily Two-Block Structure:</strong> <strong>Block 1 (First 45-90 mins):</strong> Clear daily Anki queue + execute any D1, D3, or D7 tasks scheduled for today. <strong>Block 2 (Remainder of day):</strong> Work exclusively on your active D0 chapter.</li>
      <li><strong>D1 (Unaided Blank-Sheet Recall - 15-20m):</strong> Close all notes. Write all formulas/constraints/units (Logic), diagram labels/table blanks (Data), or 10 reagent transformations + 2 arrow mechanisms (Organic) on blank paper. Compare with Obsidian/NCERT; any blank = [X] -&gt; Anki card.</li>
      <li><strong>D3 (Timed PYQ Stress Test - 30-45m):</strong> 15-25 unseen chapter PYQs under exam timer (50-60s Bio, 90s Phys/Chem, 120s Math).</li>
      <li><strong>D7 (Targeted Error Redo - 15-20m):</strong> Re-attempt ONLY [X] and [W] questions from D0 and D3.</li>
      <li><strong>D21 (Cumulative Mixed Mock - 60m+) & <span class="concept-link" data-concept="reset-30">30% Mock Error Reset Rule</span>:</strong> Multi-chapter test. Post-D21 chapters are maintained via Anki + monthly mocks; if any finished chapter has &gt;30% errors in a mock, reset it immediately to D1 -&gt; D3 -&gt; D7.</li>
    </ul>

    <h2 id="sec-anki">10. Post-Practice Error Diagnosis & Atomic Anki Formatting</h2>
    <table>
      <thead>
        <tr><th>Error Category</th><th>Diagnosis</th><th>Mandatory Corrective Action</th></tr>
      </thead>
      <tbody>
        <tr><td><strong>1. Retrieval Failure</strong></td><td>Knew concept, blanked on reagent, term, constant, or sign rule</td><td>Create atomic Basic or Cloze Anki card immediately.</td></tr>
        <tr><td><strong>2. Concept / Constraint Failure</strong></td><td>Applied formula outside valid assumptions or missed mechanism RDS</td><td>Add 1-3 line Fix Rule or Trap Warning in Obsidian Chapter Note.</td></tr>
        <tr><td><strong>3. Repeated Careless / Algebra Error</strong></td><td>Dropped sign, missed cm-&gt;m or C-&gt;K conversion, misread 'NOT'</td><td>Systematic procedural bug: add mandatory pre-check rule to Obsidian LUT.</td></tr>
        <tr><td><strong>4. Time / Execution Failure</strong></td><td>Solved in 5 minutes via ugly brute-force algebra</td><td>Run <span class="concept-link" data-concept="solution-autopsy">Solution Autopsy</span> to extract shortcut pseudo-code; re-drill on D3.</td></tr>
      </tbody>
    </table>

    <h2 id="sec-focus">11. Focus Architecture, OCD/FOMO Control & Exam Hall Meta-Game</h2>
    <ul>
      <li><strong><span class="concept-link" data-concept="side-quest-pad">Side-Quest Parking Pad</span>:</strong> Write intrusive mid-session Google tangents on a physical scrap pad to check only after the block ends.</li>
      <li><strong>Sensory Lockdown & Body Doubling:</strong> Hoodie up, Brown Noise/instrumental audio, single book on desk, silent study camera room for initiation, minimum 6.5 hours sleep floor.</li>
      <li><strong>Exam Hall Heuristics:</strong> (1) <strong>3-Second Fact Rule</strong> in Bio/Inorganic (skip immediately if not cached in 3-5s); (2) <strong>Dimensional Analysis & Extreme Boundary Elimination</strong> (test theta=0, m1=m2, or pick monotonic extremes); (3) <strong>Zero-Negative-Mark Discipline</strong> (leave the 15-20 hardest time-trap calculations blank on Pass 1).</li>
    </ul>
  </div>`;
}

function getCalendarHTML() {
  const evs = buildAutoEvents();
  const todayStr = offsetDate(0);
  const viewDate = new Date();
  viewDate.setDate(1);
  viewDate.setMonth(viewDate.getMonth() + (state.calMonthOffset || 0));
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const monthName = viewDate.toLocaleString("en-US", { month: "long", year: "numeric" });
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  let cells = "";
  ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].forEach(d => {
    cells += `<div style="font-weight:700;text-align:center;padding:4px;background:var(--bg-alt);border:1px solid var(--border);">${d}</div>`;
  });
  for (let i = 0; i < firstDow; i++) {
    cells += `<div class="cal-cell" style="opacity:0.35;"></div>`;
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const dStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const dayEvs = evs.filter(e => e.date === dStr);
    cells += `
      <div class="cal-cell ${dStr === todayStr ? "today" : ""}">
        <div class="cal-date">${d} ${dStr === todayStr ? "[TODAY]" : ""}</div>
        ${dayEvs.map(e => `
          <div class="cal-ev ${e.done ? "done" : ""}" title="${e.chName}: ${e.label} (Click to toggle complete)" onclick="toggleEventDone('${e.id}', '${e.chId}',${e.targetStage})">
            [${e.code}]${e.chName}
          </div>
        `).join("")}
      </div>`;
  }

  return `

function getMiniCalendarHTML(evs, todayStr) {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  let html = `<div class="cal-grid">`;
  ["S","M","T","W","T","F","S"].forEach(d => {
    html += `<div style="text-align:center;font-weight:700;background:var(--bg-alt);border:1px solid var(--border);">${d}</div>`;
  });
  for (let i = 0; i < firstDow; i++) html += `<div style="border:1px solid var(--border);opacity:0.3;"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const count = evs.filter(e => e.date === dStr && !e.done).length;
    html += `
      <div style="border:1px solid ${dStr === todayStr ? "var(--border-dark)" : "var(--border)"};padding:3px;text-align:center;font-size:10px;${count ? "background:var(--hl);font-weight:700;" : ""}">
        ${d}${count ? ` (${count})` : ""}
      </div>`;
  }
  html += `</div>`;
  return html;
}

function applySearchFilter() {
  const q = (document.getElementById("globalSearch").value || "").trim().toLowerCase();
  if (!q) return;
  document.querySelectorAll(".pane-body").forEach(body => {
    const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT, null);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(node => {
      const parent = node.parentNode;
      if (!parent || ["SCRIPT", "STYLE", "TEXTAREA", "INPUT", "SELECT"].includes(parent.tagName)) return;
      const idx = node.nodeValue.toLowerCase().indexOf(q);
      if (idx !== -1) {
        const span = document.createElement("span");
        const before = node.nodeValue.slice(0, idx);
        const match = node.nodeValue.slice(idx, idx + q.length);
        const after = node.nodeValue.slice(idx + q.length);
        span.appendChild(document.createTextNode(before));
        const mark = document.createElement("mark");
        mark.textContent = match;
        span.appendChild(mark);
        span.appendChild(document.createTextNode(after));
        parent.replaceChild(span, node);
      }
    });
  });
}

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) {
    c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  }
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function createZipArchive(files) {
  const enc = new TextEncoder();
  const localParts = [];
  const centralParts = [];
  let offset = 0;

  files.forEach(f => {
    const nameBytes = enc.encode(f.name);
    const dataBytes = enc.encode(f.content);
    const crc = crc32(dataBytes);

    const local = new Uint8Array(30 + nameBytes.length + dataBytes.length);
    const lv = new DataView(local.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, 0, true);
    lv.setUint16(8, 0, true);
    lv.setUint16(10, 0, true);
    lv.setUint16(12, 0, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, dataBytes.length, true);
    lv.setUint32(22, dataBytes.length, true);
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true);
    local.set(nameBytes, 30);
    local.set(dataBytes, 30 + nameBytes.length);
    localParts.push(local);

    const central = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(central.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true);
    cv.setUint16(14, 0, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, dataBytes.length, true);
    cv.setUint32(24, dataBytes.length, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    central.set(nameBytes, 46);
    centralParts.push(central);

    offset += local.length;
  });

  const centralSize = centralParts.reduce((a, b) => a + b.length, 0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, offset, true);
  ev.setUint16(20, 0, true);

  return new Blob([...localParts, ...centralParts, eocd], { type: "application/zip" });
}

function readZipStateJSON(arrayBuffer) {
  const bytes = new Uint8Array(arrayBuffer);
  const view = new DataView(arrayBuffer);
  const dec = new TextDecoder();
  let pos = 0;
  while (pos + 30 < bytes.length) {
    const sig = view.getUint32(pos, true);
    if (sig !== 0x04034b50) break;
    const compMethod = view.getUint16(pos + 8, true);
    const compSize = view.getUint32(pos + 18, true);
    const nameLen = view.getUint16(pos + 26, true);
    const extraLen = view.getUint16(pos + 28, true);
    const name = dec.decode(bytes.subarray(pos + 30, pos + 30 + nameLen));
    const dataStart = pos + 30 + nameLen + extraLen;
    if (name.endsWith(".json") && compMethod === 0) {
      const jsonText = dec.decode(bytes.subarray(dataStart, dataStart + compSize));
      return JSON.parse(jsonText);
    }
    pos = dataStart + compSize;
  }
  throw new Error("No uncompressed state.json found inside zip archive.");
}

function downloadBlob(blob, filename) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 200);
}

function exportBackupZip() {
  const jsonContent = JSON.stringify(state, null, 2);
  const csvRows = ["id,subject,chapter,hierarchy,protocol,gps_stage,d0_date,pyq_accuracy,wx_queue"];
  state.chapters.forEach(c => {
    csvRows.push(`"${c.id}","${c.subj}","${c.name}","${c.type}","${c.cat}","${GPS_STAGES[c.stage].code}","${c.d0}","${c.acc}","${(c.wx || "").replace(/"/g, '""')}"`);
  });
  const tmpDiv = document.createElement("div");
  tmpDiv.innerHTML = getManualHTML();
  const mdText = "# ab's stem manual\n\n" + (tmpDiv.innerText || tmpDiv.textContent);
  const zipBlob = createZipArchive([
    { name: "state.json", content: jsonContent },
    { name: "chapters.csv", content: csvRows.join("\n") },
    { name: "ab_stem_manual.md", content: mdText }
  ]);
  downloadBlob(zipBlob, "backup.zip");
}

function exportJSONOnly() {
  downloadBlob(new Blob([JSON.stringify(state, null, 2)], { type: "application/json" }), "state.json");
}

async function importBackupFile() {
  const inp = document.getElementById("backupFileInput");
  const msg = document.getElementById("importMsg");
  if (!inp || !inp.files.length) {
    if (msg) msg.textContent = "ERROR: Please select a backup.zip or state.json file first.";
    return;
  }
  const file = inp.files[0];
  try {
    let parsed = null;
    if (file.name.endsWith(".json")) {
      const txt = await file.text();
      parsed = JSON.parse(txt);
    } else {
      const buf = await file.arrayBuffer();
      parsed = readZipStateJSON(buf);
    }
    if (parsed && Array.isArray(parsed.chapters)) {
      state = Object.assign({}, state, parsed);
      document.documentElement.setAttribute("data-theme", state.theme);
      await saveAllStorage();
      renderWorkspace();
      const msgAfter = document.getElementById("importMsg");
      if (msgAfter) msgAfter.textContent = "SUCCESS: Backup loaded and synced to Cookies, LocalStorage, and IndexedDB.";
    }
  } catch (err) {
    if (msg) msg.textContent = "IMPORT FAILED: " + err.message;
  }
}

async function resetFactoryDefaults() {
  state.chapters = JSON.parse(JSON.stringify(DEFAULT_CHAPTERS));
  state.completedEvents = {};
  state.selectedChapterId = "c1";
  await saveAllStorage();
  renderWorkspace();
}

document.getElementById("mainNav").addEventListener("click", e => {
  const btn = e.target.closest("button[data-tab]");
  if (!btn) return;
  switchTab(btn.getAttribute("data-tab"));
});

document.getElementById("paneCountSelect").addEventListener("change", e => {
  state.paneCount = parseInt(e.target.value, 10);
  saveAllStorage();
  renderWorkspace();
});

document.getElementById("themeBtn").addEventListener("click", () => {
  state.theme = state.theme === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", state.theme);
  saveAllStorage();
});

document.getElementById("globalSearch").addEventListener("input", () => {
  renderWorkspace();
});

document.addEventListener("click", e => {
  const link = e.target.closest(".concept-link");
  if (link) {
    const key = link.getAttribute("data-concept").toLowerCase();
    openConceptModal(key);
  }
  if (e.target.id === "conceptModal") closeModal();
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
});

loadAllStorage().then(() => renderWorkspace());
