<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ab's stem manual</title>
<!-- KaTeX LaTeX Formula Rendering -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
<style>
:root {
  --bg: #ffffff;
  --bg-alt: #f5f5f5;
  --fg: #111111;
  --fg-muted: #555555;
  --border: #cccccc;
  --border-dark: #111111;
  --accent: #111111;
  --hl: #e8e8e8;
  --status-c: #1b5e20;
  --status-w: #e65100;
  --status-x: #b71c1c;
  --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
[data-theme="dark"] {
  --bg: #0d0d0d;
  --bg-alt: #161616;
  --fg: #e6e6e6;
  --fg-muted: #999999;
  --border: #333333;
  --border-dark: #e6e6e6;
  --accent: #ffffff;
  --hl: #262626;
  --status-c: #4caf50;
  --status-w: #ff9800;
  --status-x: #f44336;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.5;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
a, .concept-link {
  color: var(--fg);
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
  font-weight: 600;
}
a:hover, .concept-link:hover { background: var(--hl); }
button, select, input, textarea {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--border-dark);
  padding: 4px 8px;
  outline: none;
}
button { cursor: pointer; font-weight: 600; }
button:hover, button.active { background: var(--fg); color: var(--bg); }
input[type="text"], input[type="date"], input[type="number"], select, textarea {
  border: 1px solid var(--border);
}
input:focus, select:focus, textarea:focus { border-color: var(--border-dark); }
table { width: 100%; border-collapse: collapse; margin: 8px 0 14px 0; font-size: 12px; }
th, td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
th { background: var(--bg-alt); font-family: var(--font-mono); font-weight: 700; }
h1, h2, h3, h4 { font-family: var(--font-mono); font-weight: 700; margin: 12px 0 6px 0; line-height: 1.25; }
h1 { font-size: 18px; border-bottom: 2px solid var(--border-dark); padding-bottom: 4px; }
h2 { font-size: 15px; border-bottom: 1px solid var(--border); padding-bottom: 3px; margin-top: 16px; }
h3 { font-size: 13px; margin-top: 12px; }
p, ul, ol { margin-bottom: 8px; }
ul, ol { padding-left: 18px; }
li { margin-bottom: 3px; }
code, pre, .math { font-family: var(--font-mono); background: var(--bg-alt); }
code, .math { padding: 1px 4px; border: 1px solid var(--border); font-size: 11.5px; }
pre { padding: 10px; border: 1px solid var(--border); overflow-x: auto; margin: 8px 0; font-size: 11.5px; white-space: pre-wrap; }
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 12px;
  border-bottom: 2px solid var(--border-dark);
  background: var(--bg);
  gap: 8px;
  flex-wrap: wrap;
}
.brand { font-family: var(--font-mono); font-size: 15px; font-weight: 700; letter-spacing: -0.5px; }
.nav-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.toolbar-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
#globalSearch { width: 210px; }
.workspace {
  flex: 1;
  display: grid;
  gap: 6px;
  background: var(--border-dark);
  overflow: hidden;
  height: calc(100vh - 76px);
  padding: 4px;
}
.workspace.panes-1 { gap: 0; background: transparent; padding: 0; }
.workspace.panes-2 { grid-template-columns: 1fr 1fr; }
.workspace.panes-3 { grid-template-columns: 1fr 1fr 1fr; }
.workspace.panes-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.pane {
  display: flex;
  flex-direction: column;
  border: 2px solid var(--border-dark);
  overflow: hidden;
  background: var(--bg);
}
.pane-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 5px 10px;
  background: var(--bg-alt);
  border-bottom: 2px solid var(--border-dark);
  font-family: var(--font-mono);
  font-size: 11px;
}
.pane-body {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}
.dash-grid {
  display: grid;
  grid-template-columns: 1.15fr 1fr 1fr;
  gap: 12px;
  height: 100%;
}
@media (max-width: 1100px) {
  .dash-grid { grid-template-columns: 1fr; height: auto; }
}
.box {
  border: 1px solid var(--border-dark);
  padding: 10px;
  margin-bottom: 10px;
  background: var(--bg);
}
.box-header {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 12px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 4px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.manual-hero-banner {
  border: 2px solid var(--border-dark);
  background: var(--fg);
  color: var(--bg);
  padding: 12px 14px;
  margin-bottom: 12px;
}
.manual-hero-banner h2 {
  color: var(--bg);
  border-bottom: 1px solid var(--bg);
  margin-top: 0;
  padding-bottom: 4px;
  font-size: 14px;
}
.manual-hero-banner p {
  color: var(--bg);
  margin-bottom: 6px;
  font-size: 12px;
}
.manual-hero-banner strong {
  color: var(--bg);
}
details.audit-drawer {
  border: 1.5px solid var(--border-dark);
  background: var(--bg-alt);
  padding: 8px 12px;
  margin-bottom: 12px;
}
details.audit-drawer summary {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 11.5px;
  cursor: pointer;
  user-select: none;
  outline: none;
}
details.audit-drawer[open] summary {
  border-bottom: 1px solid var(--border);
  padding-bottom: 6px;
  margin-bottom: 8px;
}
.manual-tabs {
  display: flex;
  gap: 4px;
  border-bottom: 2px solid var(--border-dark);
  margin: 10px 0 12px 0;
  flex-wrap: wrap;
}
.manual-tab-btn {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  padding: 5px 10px;
  border: 1px solid var(--border-dark);
  border-bottom: none;
  background: var(--bg-alt);
  cursor: pointer;
}
.manual-tab-btn:hover { background: var(--hl); }
.manual-tab-btn.active {
  background: var(--fg);
  color: var(--bg);
}
.manual-tab-panel { display: none; }
.manual-tab-panel.active { display: block; }
.tactical-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 10px;
  margin: 10px 0;
}
.tactical-card {
  border: 1px solid var(--border-dark);
  background: var(--bg);
  padding: 10px;
}
.tactical-card h4 {
  font-family: var(--font-mono);
  font-size: 12px;
  margin-top: 0;
  border-bottom: 1px solid var(--border);
  padding-bottom: 4px;
  margin-bottom: 6px;
}
.flow-container {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 8px 0;
}
.flow-node {
  border: 1px solid var(--border-dark);
  padding: 6px 8px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  background: var(--bg);
  position: relative;
  cursor: pointer;
}
.flow-node.active-gps {
  border: 2px solid var(--border-dark);
  background: var(--hl);
  font-weight: 700;
}
.flow-arrow {
  text-align: center;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg-muted);
  line-height: 1;
}
.gps-badge {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 1px 5px;
  border: 1px solid var(--border-dark);
  background: var(--fg);
  color: var(--bg);
  margin-left: 4px;
  font-weight: 700;
}
.diagram-flow {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin: 6px 0;
}
.diagram-phase-group {
  border: 1px solid var(--border);
  padding: 8px;
  background: var(--bg-alt);
  margin-bottom: 2px;
}
.diagram-phase-title {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  color: var(--fg-muted);
  text-transform: uppercase;
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}
.diagram-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 6px;
}
.diagram-block {
  border: 1.5px solid var(--border-dark);
  background: var(--bg);
  padding: 6px 8px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: transform 0.1s, box-shadow 0.1s;
}
.diagram-block:hover {
  background: var(--hl);
  transform: translateY(-1px);
}
.diagram-block.active-gps {
  border: 2px solid var(--border-dark);
  background: var(--fg);
  color: var(--bg);
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.diagram-block.active-gps .tag {
  background: var(--bg);
  color: var(--fg);
  border-color: var(--bg);
}
.diagram-block.active-gps .diagram-desc {
  color: var(--bg);
  opacity: 0.9;
}
.diagram-block.reset-node {
  border-color: var(--status-x);
}
.diagram-block.reset-node.active-gps {
  background: var(--status-x);
  color: #fff;
}
.diagram-arrow-down {
  text-align: center;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--fg-muted);
  padding: 3px 0;
  user-select: none;
}
.diagram-arrow-right {
  display: inline-flex;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--fg-muted);
  user-select: none;
}
.subject-filter-bar {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  align-items: center;
  margin: 6px 0;
}
.filter-pill {
  font-family: var(--font-mono);
  font-size: 10.5px;
  padding: 2px 6px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--fg);
  cursor: pointer;
}
.filter-pill:hover, .filter-pill.active {
  background: var(--fg);
  color: var(--bg);
  border-color: var(--border-dark);
  font-weight: 700;
}
.v-tree-root {
  text-align: center;
  padding: 6px 12px;
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 12px;
  border: 2px solid var(--border-dark);
  background: var(--bg-alt);
  display: inline-block;
}
.v-tree-branches {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 8px;
}
@media (max-width: 950px) {
  .v-tree-branches { grid-template-columns: 1fr; }
}
.v-tree-card {
  border: 1px solid var(--border-dark);
  background: var(--bg);
  padding: 8px;
  display: flex;
  flex-direction: column;
}
.v-tree-card-head {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 11.5px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 4px;
  margin-bottom: 6px;
}
.v-step-box {
  border: 1px solid var(--border);
  background: var(--bg-alt);
  padding: 6px 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  margin-bottom: 4px;
}
.v-step-box strong {
  display: block;
  margin-bottom: 2px;
}
.organic-tree-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 8px;
  margin-top: 8px;
}
.organic-step-node {
  border: 1px solid var(--border-dark);
  padding: 8px;
  background: var(--bg);
  font-family: var(--font-mono);
  font-size: 11px;
}
.organic-step-node .step-num {
  font-weight: 700;
  margin-bottom: 4px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.tag {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 1px 4px;
  border: 1px solid var(--border);
  background: var(--bg-alt);
  margin-right: 4px;
}
.flag-C { color: var(--status-c); border-color: var(--status-c); font-weight: 700; }
.flag-W { color: var(--status-w); border-color: var(--status-w); font-weight: 700; }
.flag-X { color: var(--status-x); border-color: var(--status-x); font-weight: 700; }
.progress-bar {
  width: 100%;
  height: 10px;
  border: 1px solid var(--border-dark);
  background: var(--bg-alt);
  margin: 4px 0;
}
.progress-fill {
  height: 100%;
  background: var(--fg);
  transition: width 0.2s;
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  font-family: var(--font-mono);
  font-size: 11px;
}
.cal-cell {
  border: 1px solid var(--border);
  min-height: 62px;
  padding: 3px;
  background: var(--bg);
}
.cal-cell.today { border: 2px solid var(--border-dark); }
.cal-date { font-weight: 700; font-size: 10px; margin-bottom: 2px; }
.cal-ev {
  font-size: 9.5px;
  padding: 1px 3px;
  border: 1px solid var(--border-dark);
  margin-bottom: 2px;
  background: var(--bg-alt);
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cal-ev.done { text-decoration: line-through; opacity: 0.5; }
.statusbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 12px;
  border-top: 1px solid var(--border-dark);
  background: var(--bg-alt);
  font-family: var(--font-mono);
  font-size: 11px;
}
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.modal {
  background: var(--bg);
  border: 2px solid var(--border-dark);
  width: 90%;
  max-width: 680px;
  max-height: 82vh;
  display: flex;
  flex-direction: column;
}
.modal-head {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border-dark);
  background: var(--bg-alt);
  font-family: var(--font-mono);
  font-weight: 700;
  display: flex;
  justify-content: space-between;
}
.modal-content { padding: 12px; overflow-y: auto; }
.flex-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.split-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 768px) { .split-2 { grid-template-columns: 1fr; } }
mark { background: var(--fg); color: var(--bg); padding: 0 2px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="flex-row">
    <span class="brand">ab's stem manual</span>
    <div class="nav-tabs" id="mainNav">
      <button data-tab="dashboard" class="active">Dashboard</button>
      <button data-tab="manual">Full Manual</button>
      <button data-tab="flowcharts">Visual Flowcharts</button>
      <button data-tab="reference">Quick Reference</button>
      <button data-tab="tracker">Chapter GPS Tracker</button>
      <button data-tab="calendar">Auto-Calendar</button>
      <button data-tab="faq">Troubleshooting / FAQ</button>
      <button data-tab="templates">Obsidian Generator</button>
      <button data-tab="storage">Data &amp; Backup.zip</button>
    </div>
  </div>
  <div class="toolbar-right">
    <input type="text" id="globalSearch" placeholder="Search manual, concepts, FAQs...">
    <label style="font-family:var(--font-mono);font-size:11px;">Panes:</label>
    <select id="paneCountSelect" title="Multi-Tab Split View Count">
      <option value="1">1 Pane</option>
      <option value="2">2 Panes (Dual)</option>
      <option value="3">3 Panes (Triple)</option>
      <option value="4">4 Panes (Quad)</option>
    </select>
    <button id="themeBtn">Invert Theme</button>
  </div>
</div>

<div class="workspace panes-1" id="workspace"></div>

<div class="statusbar">
  <div id="storageStatus">STORAGE: SYNCED (COOKIES + LOCALSTORAGE + INDEXEDDB)</div>
  <div id="statsStatus">ACTIVE CHAPTERS: 0 | DUE TODAY: 0 | SYLLABUS DONE: 0%</div>
</div>

<div class="modal-backdrop" id="conceptModal">
  <div class="modal">
    <div class="modal-head">
      <span id="modalTitle">Concept Definition</span>
      <button onclick="closeModal()">CLOSE [ESC]</button>
    </div>
    <div class="modal-content" id="modalBody"></div>
  </div>
</div>

<script>
const GPS_STAGES = [
  { id: 0, code: "QUEUED", name: "0. Queued (Not Started)", desc: "Chapter waiting in syllabus queue for Block 2 acquisition." },
  { id: 1, code: "D0_P1_P2", name: "1. D0 (Phases 1 & 2): Orientation & Extraction", desc: "Phase 1 Lecture/NCERT Scan + 15m Vocab Check -> Phase 2 Obsidian API Table / NCERT 4-Pass." },
  { id: 2, code: "D0_P3_EX", name: "2. D0 (Phase 3A): 30/70 Worked Examples", desc: "Trace first 20-30% module examples uncovered; solve remaining 70% covered with [C]/[W]/[X] flags." },
  { id: 3, code: "D0_P3_DRILL", name: "3. D0 (Phase 3B): Module Drills & Older PYQs", desc: "Solve 20-30 module exercises + 15-20 timed older PYQs; diagnose every [W]/[X] via Error Matrix." },
  { id: 4, code: "D0_DONE", name: "4. D0 Complete (Exit Gate >=75-80% Passed)", desc: "Obsidian & Anki updated; scratchpad trashed. Stamps D0 date & starts Phase 4 clock (D1, D3, D7, D21)." },
  { id: 5, code: "P4_D1", name: "5. Phase 4 — D1 (+1d): Cued / Blank-Sheet Recall", desc: "15-20m in Block 1: Recall formulas, constraints, diagrams, or reactions from memory. Blanks -> [X] + Anki." },
  { id: 6, code: "P4_D3", name: "6. Phase 4 — D3 (+3d): [W]/[X] Redo + Unseen PYQs", desc: "15m: [W] Stopwatch Re-Test (Fail = Strike 2 -> [X]) & [X] 1st Cold Test -> 30m: 20-30 Unseen Recent PYQs." },
  { id: 7, code: "P4_D7", name: "7. Phase 4 — D7 (+7d): [X] 2nd Cold Verification", desc: "15-20m: Mandatory 2nd Cold Re-Test of [X] Penalty Queue. Must pass BOTH D3 and D7 cold to graduate to [C]." },
  { id: 8, code: "P4_D21", name: "8. Phase 4 — D21 (+21d): Cumulative Mixed Mock", desc: "Passed multi-chapter timed mock (<30% error). Enters automated Anki + monthly mock maintenance." },
  { id: 9, code: "P4_RESET", name: "9. Phase 4 — >30% Mock Error Reset Triggered", desc: "Missed >30% of chapter questions in a cumulative mock; loops back through RESET-D1 -> RESET-D3 -> RESET-D7." }
];

const CONCEPTS = {
  "two-column-notes": {
    title: "Two-Column Rough Notes (Scratchpad & Draft List)",
    section: "sec-tools",
    body: "Active workspace during lectures, reading, and problem solving. Left Column (Scratchpad): rough math, working out solved examples, tracing electron arrows. Right Column (Draft List): shorthand formulas, variable units, sign rules, and raw facts/reagents to transfer later. Discarded within 24 hours once typed into Obsidian and Anki."
  },
  "obsidian-vault": {
    title: "Obsidian Chapter Reference (One File Per Chapter)",
    section: "sec-tools",
    body: "Permanent reference file per chapter containing: (1) Formula & Rule Lookup Table with units, valid conditions, and traps, (2) Step-by-Step Problem Recipes, (3) Logic & Mechanism Fixes, and (4) [W] and [X] Question Redo Queues for Day 3 and Day 7 review."
  },
  "anki-rules": {
    title: "Atomic Anki Flashcards (Two Decks)",
    section: "sec-tools",
    body: "Keeps two decks: '1. Global: Errors & Facts' and '2. Organic: Reagents (Candidate Deck)'. Deck 2 is suspended by default and cards are only un-suspended into active daily review when verified by NCERT, PYQs, or test errors. Cards are created only from verified misses: NCERT self-test blanks, forgotten constants/rules from practice questions, Day 1 cued recall misses, or tested Organic reactions. One isolated fact per card."
  },
  "primary-source": {
    title: "Primary Source Lockdown (One Book Per Subject)",
    section: "sec-tools",
    body: "Lock in one primary reference per subject: HC Verma + Cengage (or Module) for Physics, Cengage/Module for Math, Module/Cengage for Physical Chem, NCERT for Biology and Inorganic, and NCERT + Module for Organic. Ignore historical narratives and multi-page proofs."
  },
  "root-vs-application": {
    title: "Root Foundation vs. Application Chapters",
    section: "sec-lecture",
    body: "Root foundation chapters (Mole Concept, Atomic Structure, Periodic Table, Chemical Bonding, GOC, IUPAC, Isomerism, Basic Calculus/Vectors, Kinematics, NLM) require full, ground-up lectures if your baseline is low. Application chapters use 2 to 4 hour summary lectures or direct worked example practice."
  },
  "mole-concept-filter": {
    title: "Mole Concept First-Pass Priority Filter",
    section: "sec-lecture",

function offsetDate(days, baseStr) {
  const d = baseStr ? new Date(baseStr + "T00:00:00") : new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function triggerMathRender(el) {
  if (typeof renderMathInElement !== "function") return;
  const target = el || document.body;
  renderMathInElement(target, {
    delimiters: [
      {left: '$$', right: '$$', display: true},
      {left: '\\[', right: '\\]', display: true},
      {left: '$', right: '$', display: false},
      {left: '\\(', right: '\\)', display: false}
    ],
    ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"],
    throwOnError: false
  });
}

function getSubjectList() {
  if (state.subjectOrder && state.subjectOrder.length === DEFAULT_SUBJECTS.length) {
    return state.subjectOrder;
  }
  return DEFAULT_SUBJECTS;
}

function moveSubjectOrder(subj, delta) {
  const list = [...getSubjectList()];
  const idx = list.indexOf(subj);
  if (idx < 0) return;
  const targetIdx = idx + delta;
  if (targetIdx < 0 || targetIdx >= list.length) return;
  list.splice(idx, 1);
  list.splice(targetIdx, 0, subj);
  state.subjectOrder = list;
  saveAllStorage();
  renderWorkspace();
}

function buildAutoEvents() {
  const events = [];
  state.chapters.forEach(ch => {
    if (!ch.d0 || ch.stage === 0) return;
    const schedule = [
      { code: "D0", offset: 0, label: "D0: Learn, Drill & Cleanup", targetStage: 4 },
      { code: "D1", offset: 1, label: "D1: Cued Recall (15-20m)", targetStage: 5 },
      { code: "D3", offset: 3, label: "D3: Redo Queue + Timed PYQs (40-45m)", targetStage: 6 },
      { code: "D7", offset: 7, label: "D7: Targeted Error Redo (15-20m)", targetStage: 7 },
      { code: "D21", offset: 21, label: "D21: Mixed Multi-Chapter Mock (60-180m)", targetStage: 8 }
    ];
    if (ch.stage === 9) {
      schedule.push(
        { code: "RESET-D1", offset: 1, label: "RESET D1: Cued Recall (>30% Mock Error)", targetStage: 5 },
        { code: "RESET-D3", offset: 3, label: "RESET D3: Timed PYQ Re-Test", targetStage: 6 },
        { code: "RESET-D7", offset: 7, label: "RESET D7: Targeted Error Redo", targetStage: 7 }
      );
    }
    schedule.forEach(item => {
      const dateStr = offsetDate(item.offset, ch.d0);
      const evId = `${ch.id}_${item.code}_${dateStr}`;
      if (state.deletedEvents && state.deletedEvents[evId]) return;
      const autoDone = ch.stage >= item.targetStage && ch.stage !== 9;
      events.push({
        id: evId,
        chId: ch.id,
        chName: ch.name,
        subj: ch.subj,
        code: item.code,
        date: dateStr,
        label: item.label,
        targetStage: item.targetStage,
        done: Boolean(state.completedEvents[evId] || autoDone)
      });
    });
  });
  return events.sort((a, b) => a.date.localeCompare(b.date));
}

const DB_NAME = "abs_stem_manual_db";
const STORE_NAME = "app_state";

function openIDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) return reject("No IDB");
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e);
  });
}

async function saveAllStorage() {
  const json = JSON.stringify(state);
  try { localStorage.setItem("abs_stem_state", json); } catch (e) {}
  try {
    const compact = JSON.stringify({
      t: state.theme,
      p: state.paneCount,
      s: state.selectedChapterId,
      c: state.chapters.map(c => [c.id, c.stage, c.d0, c.acc])
    });
    document.cookie = "abs_stem_cookie=" + encodeURIComponent(compact) + "; max-age=31536000; path=/; SameSite=Lax";
  } catch (e) {}
  try {
    const db = await openIDB();
    const tx = db.transaction(STORE_NAME, "readwrite");
    tx.objectStore(STORE_NAME).put(state, "master");
  } catch (e) {}
  updateStatusBar();
}

async function loadAllStorage() {
  if (navigator.storage && navigator.storage.persist) {
    try { await navigator.storage.persist(); } catch (e) {}
  }
  let loaded = null;
  try {
    const db = await openIDB();
    loaded = await new Promise(res => {
      const tx = db.transaction(STORE_NAME, "readonly");
      const req = tx.objectStore(STORE_NAME).get("master");
      req.onsuccess = () => res(req.result);
      req.onerror = () => res(null);
    });
  } catch (e) {}
  if (!loaded) {
    try {
      const ls = localStorage.getItem("abs_stem_state");
      if (ls) loaded = JSON.parse(ls);
    } catch (e) {}
  }
  if (!loaded) {
    try {
      const match = document.cookie.match(/(?:^|;\s*)abs_stem_cookie=([^;]*)/);
      if (match) {
        const cData = JSON.parse(decodeURIComponent(match[1]));
        if (cData.t) state.theme = cData.t;
        if (cData.p) state.paneCount = cData.p;
        if (Array.isArray(cData.c)) {
          cData.c.forEach(([id, stg, d0, acc]) => {
            const target = state.chapters.find(x => x.id === id);
            if (target) { target.stage = stg; target.d0 = d0; target.acc = acc; }
          });
        }
      }
    } catch (e) {}
  } else {
    // Migration: If loaded data contains old dummy chapters or < 100 chapters, cleanly upgrade
    if (!loaded.chapters || loaded.chapters.length < 100 || loaded.chapters.some(c => c.d0 && c.wx && c.wx.includes("STP 22.7L"))) {
      loaded.chapters = JSON.parse(JSON.stringify(DEFAULT_CHAPTERS));
      loaded.completedEvents = {};
      loaded.deletedEvents = {};
    }
    state = Object.assign({}, state, loaded);
  }
  document.documentElement.setAttribute("data-theme", state.theme);
  const paneSelect = document.getElementById("paneCountSelect");
  if (paneSelect) paneSelect.value = String(state.paneCount || 1);
}

function updateStatusBar() {
  const today = offsetDate(0);
  const evs = buildAutoEvents();
  const dueToday = evs.filter(e => e.date === today && !e.done).length;
  const activeCount = state.chapters.filter(c => c.stage > 0 && c.stage < 8).length;
  const doneCount = state.chapters.filter(c => c.stage >= 4 && c.stage !== 9).length;
  const pct = state.chapters.length ? Math.round((doneCount / state.chapters.length) * 100) : 0;
  const el = document.getElementById("statsStatus");
  if (el) {
    el.textContent = `ACTIVE CHAPTERS: ${activeCount} | DUE TODAY (${today}): ${dueToday} | SYLLABUS D0+ DONE: ${doneCount}/${state.chapters.length} (${pct}%)`;
  }
}

      <div class="box-header"><span>HOW THE 4 PHASES CONNECT TO THE SCHEDULER (GPS STAGES 0–9)</span><span class="tag">ARCHITECTURE</span></div>
      <p><strong>The Macro Rule:</strong> You learn the syllabus <strong>one chapter at a time (<code>D0</code>)</strong>, while reviewing previously completed chapters in parallel (<code>D1, D3, D7, D21</code>). Every study day is split into two blocks:</p>
      <ul>
        <li><strong>Block 1 — Morning Review Queue (First 60–90 Mins):</strong> Clear due Anki cards (15–20m) + execute any scheduled <strong>Phase 4 (<code>D1</code>, <code>D3</code>, <code>D7</code>, or <code>D21</code>)</strong> reviews due today for <em>already completed chapters</em>.</li>
        <li><strong>Block 2 — Main Acquisition Block (Rest of Day):</strong> Work 100% on your single active <strong><code>D0</code> Chapter</strong> through <strong>Phase 1 &rarr; Phase 2 &rarr; Phase 3</strong>.</li>
      </ul>
      <p><strong>What If <code>D0</code> Takes More Than 1 Calendar Day?</strong> <code>D0</code> is an <em>acquisition stage</em>, NOT a 24-hour timer. A short chapter may finish <code>D0</code> in 1 day; a heavy Root chapter (like Mole Concept, GOC, or Rotational Motion) may take 3–5 days across Stages 1, 2, and 3. <strong>The <code>D1 / D3 / D7 / D21</code> spaced review clock NEVER starts until you pass the Phase 3 Exit Gate and mark <code>Stage 4 (D0_DONE)</code>.</strong> If <code>D0</code> spans multiple days, spend the last 10 minutes of each night transferring that day's Right-Column formulas/misses into Obsidian/Anki so rough notes never sit unprocessed for more than 24 hours.</p>
    </div>

    <table>
      <thead>
        <tr><th>Term / Primitive</th><th>Exact Operational Definition</th></tr>
      </thead>
      <tbody>
        <tr><td><strong>Primary Source (ROM)</strong></td><td>Your single locked-in textbook (NCERT) or coaching module per subject. Read-only database; never copy its prose or derivations into a notebook.</td></tr>
        <tr><td><strong>Two-Column Workspace (RAM)</strong></td><td>Disposable rough paper or tablet split vertically. <strong>Left Column (Scratchpad):</strong> messy math, working out examples, pushing curved electron arrows. <strong>Right Column (Draft List):</strong> headings, shorthand formulas, units, constraints, and raw facts to transfer to Obsidian/Anki. Purged within 24 hours.</td></tr>
        <tr><td><strong>Chapter API / Lookup Table (LUT)</strong></td><td>Your permanent Obsidian note (one file per chapter). Lists every formula like a code function: LaTeX Equation, Input Variables &amp; Mandatory SI Units, Valid Assumptions, Boundary Limits ($0 / \\text{Max} / \\propto$), and Exam Traps.</td></tr>
        <tr><td><strong>Problem Recipe (1-2-3 Pseudo-Code)</strong></td><td>A 3-step numbered checklist in Obsidian for executing a recurring multi-step problem type (e.g., Kirchhoff Nodal <code>x</code>-Method, Pulley Constraints, Cavity Negative Mass).</td></tr>
        <tr><td><strong>5-Line Mechanism / Concept Fix</strong></td><td>A compact bug report in Obsidian written only when your physical/chemical intuition breaks (Title, Trigger Question ID, 1–3 Line Rule, Mini Example, Exam Trap).</td></tr>
        <tr><td><strong>Root vs. Derivative Chapters</strong></td><td><strong>Root Chapters:</strong> Foundational prerequisites (Mole Concept, Chemical Bonding, IUPAC, Isomerism, GOC, Calculus/Vectors, Kinematics, NLM) requiring full ground-up playlists if your baseline is weak. <strong>Derivative Chapters:</strong> Later chapters that apply Root rules and use 2–4h summary lectures or direct book study.</td></tr>
        <tr><td><strong><code>[C]</code> Confirmed Flag</strong></td><td>Solved 100% correctly, optimal method, under exam time cap ($\\le 90\\text{s}$ NEET; $\\le 2\\text{m}$ JEE). Mastered—ignore until <code>D21</code> mixed mocks.</td></tr>
        <tr><td><strong><code>[W]</code> Weak Flag (Speed Pipeline)</strong></td><td>Correct answer, BUT slow, brute-force algebra, hesitated, or 50/50 guess. Zero Anki/YouTube on <code>D0</code>; log 1-line shortcut in Obsidian and re-test under a stopwatch on <code>D3</code> (Pass = <code>[C]</code>; Slow/Wrong again = <strong>Strike 2 &rarr; mutates into <code>[X]</code></strong>).</td></tr>
        <tr><td><strong><code>[X]</code> Blocked Flag (Penalty Pipeline)</strong></td><td>Wrong answer, blank, sign/unit trap, or failed <code>D1</code>/NCERT recall. Triggers 2-Minute Unblocking Ladder + same-day Anki card (if fact gap) or Obsidian 5-Line Fix (if logic gap). <strong>Must pass cold on BOTH <code>D3</code> and <code>D7</code></strong> to graduate to <code>[C]</code>.</td></tr>
        <tr><td><strong>Candidate Deck (Suspended Anki)</strong></td><td>Deck 2 (<code>2. Organic: Reagents</code>) where named reactions are stored suspended and only un-suspended into daily review when verified by NCERT, PYQs, or test errors.</td></tr>
      </tbody>
    </table>

    <!-- PART III: SUBJECT CLASSIFICATION & DEPENDENCY TREES -->
    <h2 id="sec-lecture">2. Subject Classification &amp; Dependency Trees</h2>
    <p>Do not use the same lecture length for every chapter. Judge a video by its <strong>total runtime and clarity</strong>, not whether its title says "One-Shot" or "Playlist" (three 50-minute playlist videos take the exact same runtime as one 2.5-hour One-Shot):</p>
    
    <h3>A. Prerequisite Router: Root vs. Derivative Chapters</h3>
    <ol>
      <li><strong>Root Foundation Chapters (Use Full, Ground-Up Lectures if Starting from Scratch):</strong>
        <p>If your foundation is weak, fast summary videos skip basic steps and cause confusion. Use full foundational lectures for these core sequences:</p>
        <ul>
          <li><strong>Physical &amp; Inorganic Chemistry Foundations:</strong><br>
            1. <strong>Mole Concept</strong> <em>(First-Pass Priority Filter: Skip Normality, Equivalent Weight, and n-factor titrations on your first pass—they belong in Redox and Electrochemistry. Lock in the 4 core pillars first: <strong>Basic Moles = Given Mass / Molar Mass</strong>, <strong>Limiting Reagent</strong>, <strong>Molarity = moles of solute / L of solution</strong>, and <strong>Molality = moles of solute / kg of solvent</strong>)</em>.<br>
            2. <strong>Atomic Structure</strong> -&gt; <strong>Periodic Table Trends</strong> -&gt; <strong>Chemical Bonding</strong>.
          </li>
          <li><strong>Physics &amp; Math Foundations:</strong><br>
            <strong>Basic Calculus, Vectors &amp; Graphs</strong> -&gt; <strong>Kinematics</strong> -&gt; <strong>Newton's Laws of Motion (NLM)</strong> -&gt; <strong>Work, Power &amp; Energy</strong>.
          </li>
        </ul>
      </li>
      <li><strong>Application Chapters (Use 2-to-4 Hour Summary Lectures or Direct Book Study):</strong>
        <p>Once the root chapters above are solid, later chapters (Current Electricity, Optics, Modern Physics, Thermodynamics, Electrochemistry, Solutions, Class 12 Organic chapters) are applications of those rules. Use 2-4 hour overview lectures or go straight to textbook formula extraction and worked examples.</p>
      </li>
      <li><strong>Biology &amp; Inorganic Chemistry (Split by Chapter Type):</strong>
        <ul>
          <li><strong>Conceptual Chapters (Use Lectures):</strong> Genetics, Molecular Biology, Biotechnology, Human Physiology, Chemical Bonding, Coordination Compounds.</li>
          <li><strong>Purely Descriptive / Fact-List Chapters (Skip Lectures — Go Straight to NCERT + PYQs):</strong> Plant Morphology, Plant Anatomy, Plant/Animal Kingdom, Biodiversity, Ecology, p-Block, d &amp; f-Block facts.</li>
        </ul>
      </li>
    </ol>

    <!-- PART IV: THE 4-PHASE EXECUTION ENGINE -->
    <h2 id="sec-phase1">3. Phase 1: Chapter Entry, Orientation &amp; Baseline Capture (GPS Stage 1 — D0)</h2>
    <div class="box">
      <div class="box-header"><span>WHAT WE ARE DOING IN PHASE 1 &amp; HOW TO START A NEW CHAPTER</span><span class="tag">GPS STAGE 1</span></div>
      <p><strong>Goal:</strong> Install the chapter's vocabulary, visual models, and structural skeleton so the textbook and PYQs do not look like alien hieroglyphics. You execute Phase 1 during <strong>Block 2</strong> of your day on your single active <code>D0</code> chapter.</p>
      
      <h4>Step 1.1 — Choose Your Entry Path by Chapter Type</h4>
      <ul>
        <li><strong>Path A — Logic-Heavy (Physics, Math, PChem), Hybrid (Organic), &amp; Conceptual Bio/Inorganic (Genetics, Biotech, Coordination):</strong> Open your chosen video lecture (full ground-up playlist if it is a <strong>Root Chapter</strong> and your baseline is weak; 2–4 hour macro lecture if it is a <strong>Derivative Chapter</strong>). <em>(If your baseline is already strong, skip the video and go straight to Phase 2 Step 1).</em></li>
        <li><strong>Path B — Purely Descriptive Biology &amp; Inorganic (Morphology, Anatomy, Ecology, p/d/f-Block facts):</strong> <strong>Do NOT watch video lectures.</strong> Open your physical NCERT book and Chapter PYQ book directly and jump straight to <strong>Phase 2, Protocol B (NCERT 4-Pass Method)</strong>.</li>
      </ul>

      <h4>Step 1.2 — How to Execute During the Lecture (Two-Column Workspace)</h4>
      <ul>
        <li><strong>Divide your page or tablet vertically into two columns:</strong>
          <ul>
            <li><strong>Left Column (Disposable Scratchpad):</strong> Work out algebra alongside the teacher and trace curved electron arrows in real time. <strong>Rule:</strong> When the teacher spends 20 minutes solving 5 repetitive board drill questions, <strong>put your pen down and just watch</strong> how they set up the governing equation.</li>
            <li><strong>Right Column (Draft Skeleton &amp; API):</strong> Record only headings, core formulas, variable definitions, mandatory units, and traps using the <strong>4 Anti-Bloat Rules</strong>: (1) Keyword breadcrumbs only—never write full grammatical sentences, (2) Use mathematical operators ($\\rightarrow, \\implies, \\therefore, \\propto, \\uparrow, \\downarrow$), (3) Capture only the conceptual pivot, (4) Keep the column physically narrow.</li>
          </ul>
        </li>
        <li><strong>The 3-Item Derivation Filter:</strong> Never transcribe 15 lines of intermediate derivation algebra. Record only: (1) Starting Law &amp; Valid Physical Assumption, (2) Final Equation with required SI units &amp; sign rules, and (3) Final Proportionality ($\\propto$).</li>
        <li><strong>The 15–30 Minute Video Bailout Gate:</strong> If a video makes no sense after 15 minutes, drop playback speed to $1\\times$ and trace actively on paper for up to 30 minutes. If the instructor is still skipping foundational steps you do not know, close the video immediately and switch to a ground-up playlist or reverse-engineer the textbook's Solved Examples.</li>
      </ul>

      <h4>Step 1.3 — Phase 1 Exit Check: The 15-Minute Unsolved Question Vocabulary Scan</h4>
      <p>Immediately after finishing the lecture (or today's lecture chunk), close the video, open your coaching module or PYQ book to the <strong>unsolved exercises</strong>, and spend <strong>15 minutes strictly reading the question stems without solving them</strong>. Confirm that you recognize the technical nouns (e.g., <em>"molarity," "limiting reagent," "hyperconjugation," "paraxial rays"</em>) and can mentally map each question to a heading in your Right Column. Once confirmed, move to <strong>Phase 2</strong>.</p>
    </div>

    <!-- PANEL 1: LOGIC-HEAVY -->
    <div class="manual-tab-panel ${activeTab === "logic" ? "active" : ""}" id="panel-logic">
      <div class="box">
        <div class="box-header"><span>PROTOCOL A: LOGIC-HEAVY (PHYSICS, MATH, PHYSICAL CHEMISTRY)</span><span class="tag">FORMULA API</span></div>
        <ol>
          <li><strong>Step 1 — Cross-Check Module Formula Summary (2–5 Mins) Before Solving Problems:</strong>
            <p style="margin:4px 0;"><strong>If coming from a Phase 1 Lecture:</strong> Compare your Right-Column lecture notes against the printed Summary/Formula page at the back of your textbook/coaching module so zero special-case formulas or constants are missed, then compile your Obsidian Chapter API Table and discard your rough scratchpad.</p>
            <p style="margin:4px 0;"><strong>If skipping the lecture (Direct Book Entry):</strong> Skip Page 1 theory prose, flip straight to the printed Summary/Formula sheet at the end of the textbook chapter to initialize your Obsidian API Table, and then proceed to Phase 3 Solved Examples.</p>
          </li>
          <li><strong>4-Symbol Margin Scalpel:</strong> When reading textbook/PDF, mark only:
            <ul>
              <li><code>[ ]</code> <strong>Box:</strong> Box the starting governing equation only (never intermediate algebra).</li>
              <li><code>↑ ↓ → ⟹</code> <strong>Margin Shorthand:</strong> Note variable relationships in the margin ($r \downarrow \implies v \\uparrow$).</li>
              <li><code>[*]</code> <strong>Star:</strong> Mark the exact sentence where a key assumption or substitution trick is stated.</li>
              <li><strong>Wiring Arrows:</strong> Draw arrows linking a cause phrase directly to an effect phrase.</li>
            </ul>
          </li>
          <li><strong>Built-In Obsidian Formula API Table:</strong> Record equations with units, valid conditions, and limits:
            <table>
              <thead>
                <tr><th>Concept / Target</th><th>Formula (LaTeX)</th><th>Variables &amp; Mandatory Units</th><th>Valid When (Assumptions)</th><th>Limits (0 / Max / Prop) &amp; Exam Traps</th></tr>
              </thead>
              <tbody>
                <tr>
                  <td><strong>Ideal Gas Law</strong></td>
                  <td>$$PV = nRT$$</td>
                  <td>$P$: Pa or atm, $V$: m$^3$ or L, $n$: mol, $T$: K (Kelvin strictly)</td>
                  <td>Low $P$, high $T$ (non-interacting point particles).</td>
                  <td><strong>Trap (R Units &amp; STP):</strong> Modern IUPAC STP ($1\text{ bar}, 273.15\text{ K}$) $\implies 22.7\text{ L/mol}$; Old STP ($1\text{ atm}, 273.15\text{ K}$) $\implies 22.4\text{ L/mol}$. Use $R=8.314$ with Pa$\cdot$m$^3$; $R=0.0821$ with L$\cdot$atm.</td>
                </tr>
                <tr>
                  <td><strong>Isothermal Reversible Work</strong></td>
                  <td>$$w_{\text{rev}} = -2.303 nRT \log_{10}\left(\frac{V_2}{V_1}\right)$$</td>
                  <td>$w$: Joules (J), $V_1, V_2$: same volume units, $T$: K</td>
                  <td>Ideal gas; isothermal ($\Delta T = 0 \implies \Delta U = 0$); reversible path.</td>
                  <td><strong>Sign Trap:</strong> In Chemistry (IUPAC), expansion ($V_2 > V_1$) is negative ($w < 0$). In Physics, expansion work is positive ($W > 0$). Free expansion in vacuum ($P_{\text{ext}} = 0 \implies w = 0$).</td>
                </tr>
                <tr>
                  <td><strong>Spherical Mirror Formula</strong></td>
                  <td>$$\frac{1}{v} + \frac{1}{u} = \frac{1}{f}$$</td>
                  <td>$u$: Object dist, $v$: Image dist, $f$: Focal length ($R/2$)</td>
                  <td>Paraxial rays (small aperture); measured from pole $P$.</td>
                  <td><strong>Sign Trap:</strong> Incident light direction $= +$. Real object $u < 0$. Concave mirror $f < 0$; Convex mirror $f > 0$. Never pre-insert a sign for the unknown variable being solved.</td>
                </tr>
                <tr>
                  <td><strong>Magnetic Lorentz Force</strong></td>
                  <td>$$F = |q|vB \sin\theta$$</td>
                  <td>$F$: N, $q$: C, $v$: m/s, $B$: Tesla (T), $\theta$: angle between $\vec{v}$ and $\vec{B}$</td>
                  <td>Moving point charge in magnetic field $\vec{B}$.</td>
                  <td><strong>Zero Limit:</strong> $F = 0$ if $v = 0$ or $\theta = 0^\circ/180^\circ$. <strong>Max Limit:</strong> $F_{\text{max}} = |q|vB$ at $\theta = 90^\circ$. <strong>Zero-Work Trap:</strong> Since $\vec{F} \perp \vec{v}$, magnetic force does zero work ($W = 0$) and cannot alter kinetic energy.</td>
                </tr>
                <tr>
                  <td><strong>Molarity ($M$)</strong></td>
                  <td>$$M = \frac{n_{\text{solute}}}{V_{\text{solution (L)}}}$$</td>
                  <td>$n$: mol, $V$: Liters (L) of total solution</td>
                  <td>Homogeneous solution.</td>
                  <td><strong>Trap 1:</strong> Temperature-dependent ($V \propto T \implies M$ decreases when heated). <strong>Trap 2:</strong> Denominator is L of total solution, NOT kg of solvent (Molality $m$).</td>
                </tr>
              </tbody>
            </table>
          </li>
          <li><strong>3 Limit &amp; Edge-Case Checks:</strong> For every formula, check: (a) What drives it to $0$? (b) What drives it to Max or $\infty$? (c) What is the proportionality scaling when constants are held?</li>
        </ol>
      </div>
    </div>

    <!-- PANEL 2: DATA-HEAVY -->
    <div class="manual-tab-panel ${activeTab === "data" ? "active" : ""}" id="panel-data">
      <div class="box">
        <div class="box-header"><span>PROTOCOL B: DATA-HEAVY (BIOLOGY &amp; INORGANIC NCERT 4-PASS METHOD)</span><span class="tag">NCERT PROTOCOL</span></div>
        <p>Never write long notebook summaries for descriptive Biology or Inorganic Chemistry. Process the chapter directly inside your physical NCERT book:</p>
        <ol>
          <li><strong>Pass 0 — 5-Minute Chapter Scan:</strong> Flip through in 3-5 minutes reading only headings, subheadings, diagram titles, and table headers.</li>
          <li><strong>Pass 1 — Highlight Past Exam Targets (10-15m):</strong> Open your chapter PYQ book. Inspect 10-20 past questions, locate the answering sentence in NCERT, and highlight <strong>only the minimum answering phrase</strong> (never whole paragraphs). Dense highlights reveal the examiner's target zones.</li>
          <li><strong>Pass 2 — Read Visual Anchors Before Prose:</strong>
            <ul>
              <li><strong>1st (Diagrams &amp; Captions):</strong> Read every figure caption. Cover labels with your hand and state them from memory.</li>
              <li><strong>2nd (Tables):</strong> Every table row is an MCQ. Cover one column with a card and recite the hidden values or examples.</li>
              <li><strong>3rd (Bold &amp; Italic Terms):</strong> Define each highlighted term in one sentence from memory.</li>
              <li><strong>4th (Surrounding Prose):</strong> Read paragraphs only around your PYQ highlights to connect facts.</li>
            </ul>
          </li>
          <li><strong>Pass 3 — The Cover-and-Guess Self-Test (Blank-Line Redaction):</strong>
            <p>On every PYQ-highlighted line, caption, table row, and bold term, ask: <em>"Which single word, number, or directional term would an examiner blank out here?"</em> Cover that word with your finger and recite it:</p>
            <ul>
              <li><strong>Instant Recall:</strong> Mark <code>[C]</code> in margin and move on.</li>
              <li><strong>Blanked or Hesitated:</strong> Mark <code>[X]</code> in margin and convert immediately to an atomic Cloze Anki card.</li>
            </ul>
          </li>
        </ol>
      </div>
    </div>

    <!-- PANEL 3: HYBRID ORGANIC -->
    <div class="manual-tab-panel ${activeTab === "hybrid" ? "active" : ""}" id="panel-hybrid">
      <div class="box">
        <div class="box-header"><span>PROTOCOL C: HYBRID (ORGANIC CHEMISTRY DUAL-TRACK)</span><span class="tag">DUAL CAPTURE</span></div>
        <p>Read NCERT Organic prose at half-speed looking for reaction conditions, rate-determining steps (RDS), carbocation rearrangements, and exceptions. Separate every reaction into two parallel tracks:</p>
        
        <h4>Track 1: "Why" Layer (Electron Logic on Scratchpad)</h4>
        <ul>
          <li>When curved electron arrows are shown, copy the starting structure onto your scratchpad and push each arrow.</li>
          <li>Ask 3 Mandatory Questions: (1) Who is nucleophile/base vs electrophile/acid? (2) Why attack this specific carbon? (3) What stabilizes the intermediate, and can it rearrange?</li>
          <li>If the step is obvious from GOC: discard scratchpad drawing.</li>
          <li>If intuition breaks, involves a rearrangement, or is an exception: write a <strong>1-5 Line Mechanism Fix Note</strong> in Obsidian:
            <pre>
* Fix: Why does HBr + Peroxide give anti-Markovnikov on alkenes, while HCl and HI give Markovnikov?
  * Trigger: Hydrocarbons Module Ex 1, Q19
  * Rule: Peroxide initiates radical chain where Br* attacks less hindered carbon forming more stable radical. Both propagation steps exothermic only for HBr; for HCl (strong H-Cl bond) and HI (endothermic addition), radical chain fails.
  * Mini Example: CH3-CH=CH2 + HBr --(peroxide)--> CH3-CH2-CH2Br
  * Exam Trap: Applying peroxide effect to HCl/HI, or rearranging a free-radical intermediate.
            </pre>
          </li>
        </ul>

        <h4>Track 2: "What" Layer (5-Field Reaction Lookup Table)</h4>
        <p>Jot down the 5 core fields: (1) Reaction Name, (2) Starting Material, (3) Reagent(s) &amp; Conditions, (4) Major Product &amp; Selectivity, (5) Tested Exception.</p>
        <p><strong>Suspended Candidate Deck Rule:</strong> Reagent cards are entered into Anki only when they appear in NCERT or PYQs. Never pre-load hundreds of untested reactions.</p>
      </div>
    </div>

    <h2 id="sec-p3-drilling">5. Phase 3: Drilling, Flagging, Algorithm Tracing &amp; D0 Exit Gate (GPS Stages 2, 3 &amp; 4)</h2>
    <div class="box">
      <div class="box-header"><span>STEP-BY-STEP D0 PROBLEM DRILLING &amp; DEBUGGING ENGINE</span><span class="tag">GPS STAGES 2–4</span></div>
      <p><strong>What We Are Doing in Phase 3:</strong> Building a formula table does not mean you can solve MCQs in 90 seconds. In Phase 3—with your Obsidian Chapter API Table open beside you—you drill through two specific <code>D0</code> question buckets (<strong>Set A: In-Chapter Worked Examples</strong> &rarr; <strong>Set B: Module Drills &amp; Older PYQs</strong>) until you pass the <code>D0</code> Exit Gate (<code>GPS Stage 4</code>).</p>

      <h4>Step 3.1 — Practice Set A: The 30 / 70 In-Chapter Worked Example Split (GPS Stage 2: D0_P3_EX)</h4>
      <ul>
        <li><strong>First 20–30% of Worked Examples (Uncovered Trace):</strong> Keep the printed solution uncovered. Read it line-by-line like code: (1) Identify given input variables and hidden English conditions (e.g., <em>"starts from rest"</em> $\\implies u=0$), (2) Identify which formula from your Obsidian API Table bridges inputs to output, and (3) Spot any sign convention or unit trap. <em>If a new constraint appears that wasn't in your lecture, add it to your Obsidian API Table immediately.</em></li>
        <li><strong>Remaining 70% of Worked Examples (Covered Attempt):</strong> Cover the solution with paper and solve from scratch on your Left Scratchpad under a timer. Grade every single attempt immediately using the <strong>Universal Flagging System (<code>[C]</code>, <code>[W]</code>, <code>[X]</code>)</strong> below.</li>
        <li><strong>Short-Chapter Exception (&lt;6 Worked Examples):</strong> If a chapter has fewer than 6 worked examples total, read all of them once uncovered, close the book, and re-solve all of them from scratch on blank paper.</li>
      </ul>

      <h4>Step 3.2 — Grade Every Attempt Immediately: The Decoupled <code>[C]</code> / <code>[W]</code> / <code>[X]</code> Flags</h4>
      <p>Apply these three flags to every worked example (in Set A), module drill (in Set B), and PYQ you attempt:</p>
      <ul>
        <li><span class="tag flag-C">[C] Confirmed</span> <strong>Solved 100% correctly, optimal method, under target exam time</strong> ($\\le 90\\text{s}$ NEET; $\\le 2\\text{m}$ JEE/IAT). <em>Action:</em> Do nothing. Ignore until <code>D21</code> cumulative mixed mocks.</li>
        <li><span class="tag flag-W">[W] Weak (Speed Pipeline)</span> <strong>Correct answer, BUT slow, used ugly brute-force algebra, hesitated, or guessed 50/50.</strong> <em>Immediate D0 Action:</em> <strong>Zero Anki and Zero YouTube.</strong> Inspect the printed solution, write a 1-line shortcut or 1-2-3 Problem Recipe in Obsidian, and add the Question ID to your <strong><code>[W]</code> Speed-Drill Queue</strong> (to be re-tested under a strict stopwatch on <code>D3</code>).</li>
        <li><span class="tag flag-X">[X] Blocked (Penalty Pipeline)</span> <strong>Wrong answer, went completely blank, or fell for a sign/unit/constraint trap.</strong> <em>Immediate D0 Action:</em> Run the <strong>2-Minute Unblocking Ladder</strong> below, apply the <strong>Post-Practice Error Diagnosis Matrix</strong> (create an Anki card TODAY if you forgot a fact/sign rule, or write a 5-Line Fix in Obsidian TODAY if you misunderstood a concept/constraint), and log the Question ID in your <strong><code>[X]</code> Penalty Queue</strong> (must pass cold on <strong>both <code>D3</code> and <code>D7</code></strong>).</li>
      </ul>

      <h4>Step 3.3 — When Stuck &gt;2 Minutes: The 2-Minute Unblocking Ladder &amp; Solution Autopsy</h4>
      <ol>
        <li><strong>30s Self-Check:</strong> Check your scratchpad against your Obsidian API Table for dropped minus signs, arithmetic slips, or missed unit conversions ($\\text{cm} \\rightarrow \\text{m}$, $^\\circ\\text{C} \\rightarrow \\text{K}$, $\\text{bar} \\rightarrow \\text{Pa}$).</li>
        <li><strong>60s Solution Autopsy (For "Unknown Unknowns"):</strong> Competitive exams never test 10 minutes of ugly manual calculus. If your algebra turns into a multi-page mess, stop brute-forcing immediately and open the printed solution. Ignore the numbers and scan the text strictly for <strong>Capitalized or Italicized Method Nouns</strong> (e.g., <em>"By Nodal Analysis"</em>, <em>"Using Concept of Negative Mass"</em>, <em>"Applying Lami's Theorem"</em>, <em>"By Method of Images"</em>).</li>
        <li><strong>5–10m YouTube Debugger Cap:</strong> If the printed solution skips steps, search that exact method noun + <code>"short trick"</code> on YouTube. Watch one 5-to-10-minute problem execution clip, write a <strong>1-2-3 Problem Recipe</strong> in Obsidian, close YouTube immediately, and re-solve the question. (If still stuck after 10 minutes, mark <code>[X]</code>, park it, and move on).</li>
      </ol>

      <h4>Procedural Algorithm Tracing: 3 Built-In 1-2-3 Problem Recipes</h4>
      <div class="box" style="background:var(--bg-alt);">
        <strong>Recipe 1: Kirchhoff Nodal Analysis (x-Method for Circuits)</strong>
        <ol>
          <li>Find junction connecting most branches; label its potential $x$.</li>
          <li>Label clean bottom reference wire (ground) as $0\\text{ V}$.</li>
          <li>Label known node voltages using connected batteries.</li>
          <li>Assume node $x$ is highest potential and solve KCL in one line:
            $$\\frac{x - V_1}{R_1} + \\frac{x - V_2}{R_2} + \\frac{x - V_3}{R_3} = 0$$
          </li>
        </ol>
      </div>
      <div class="box" style="background:var(--bg-alt);">
        <strong>Recipe 2: Pulley Constraint Equations</strong>
        <ol>
          <li>Pick fixed reference line (ceiling/ground); mark positions ($x_1, x_2, x_p$) or tensions ($T$) along movable string segments.</li>
          <li>Use zero net virtual work ($\\sum \\vec{T} \\cdot \\vec{a} = 0$) or differentiate constant length ($\\sum x_i = L \\implies \\sum a_i = 0$).</li>
          <li>For standard movable pulley with two hanging blocks:
            $$\\vec{a}_p = \\frac{\\vec{a}_1 + \\vec{a}_2}{2} \\iff a_1 + a_2 = 2a_p$$
          </li>
        </ol>
      </div>
      <div class="box" style="background:var(--bg-alt);">
        <strong>Recipe 3: Cavity Center-of-Mass ("Negative Mass" Shortcut)</strong>
        <ol>
          <li>Treat original uncut object as Mass 1 ($M_1 = +M$) at center $C_1 = (X_1, Y_1)$.</li>
          <li>Treat cut-out cavity as superimposed negative mass ($M_2 = -m$, where $m \\propto r^3$ for 3D spheres [$r=R/2 \\implies m=M/8$] and $m \\propto r^2$ for 2D discs [$r=R/2 \\implies m=M/4$]) at cavity center $C_2 = (X_2, Y_2)$.</li>
          <li>Plug directly into 2-body formula:
            $$X_{\\text{com}} = \\frac{M_1 X_1 - |M_2| X_2}{M_1 - |M_2|}$$
          </li>
        </ol>
      </div>

      <h4>Step 3.4 — Practice Set B: Unsolved Module Drills &amp; The D0 PYQ Exit Gate (GPS Stage 3 &rarr; Stage 4)</h4>
      <p>After finishing the worked examples (Set A), move to the unsolved questions at the back of your module and PYQ book. <strong>How PYQs are split between Day 0 and Day 3:</strong></p>
      <ul>
        <li><strong>Tier 1 — Topic-Wise Module Drills (Executed on <code>D0</code>, GPS Stage 3):</strong> Solve <strong>20–30 Level-1 / Topic-wise coaching module questions</strong> in Physics/Math/Chem (or <strong>40–50 NCERT-based MCQs</strong> in Biology) to build tool-selection speed.</li>
        <li><strong>Tier 2 — The <code>D0</code> Timed PYQ Gate (Older PYQs Executed on <code>D0</code>, GPS Stage 3):</strong> Take <strong>15–20 older Chapter PYQs</strong> (e.g., from 5–10 years ago) and solve them under a strict exam stopwatch ($\\le 90\\text{s}$ NEET; $\\le 2\\text{m}$ JEE).</li>
        <li><strong>Tier 3 — The <code>D3</code> Unseen PYQ Reserve (Recent PYQs Saved Strictly for Day 3):</strong> Hold back the <strong>most recent 3–5 years of Chapter PYQs (20–30 questions)</strong> completely untouched on <code>D0</code>. You will use this unseen reserve 3 days later on <strong><code>D3</code> (Phase 4)</strong> to test true retention after a 72-hour memory gap.</li>
        <li><strong>The Hard <code>D0</code> Exit Gate (<code>GPS Stage 4: D0_DONE</code>):</strong> A chapter's <code>D0</code> acquisition phase is officially complete when you score <strong>$\\ge 75\\text{--}80\\%$ accuracy on Tier 2 Timed PYQs</strong>, log all <code>[W]</code> and <code>[X]</code> questions from Set A and Set B into Obsidian/Anki, and trash your paper scratchpad. Mark the chapter as <strong><code>Stage 4: D0_DONE</code></strong> in the GPS Tracker.</li>
      </ul>
    </div>

    <!-- PHASE 4: SPACED RETRIEVAL, DECOUPLED [C]/[W]/[X] & ANKI -->
    <h2 id="sec-p4-review">6. Phase 4: Parallel Spaced Retrieval (D1–D21), Decoupled [W]/[X] Resolution &amp; Anki (GPS Stages 5–9)</h2>
    <div class="box">
      <div class="box-header"><span>THE BRIDGE FROM D0 COMPLETION (STAGE 4) TO THE AUTO-CALENDAR (STAGES 5–9)</span><span>[OPERATIONAL]</span></div>
      <p><strong>How Phase 3 Flows Into Phase 4:</strong> The moment you pass the Phase 3 Exit Gate and flip a chapter to <strong><code>Stage 4 (D0_DONE)</code></strong>, the website stamps today's date as <code>D0</code> and automatically schedules four future review dates on your calendar: <strong><code>D1 (+1d)</code></strong>, <strong><code>D3 (+3d)</code></strong>, <strong><code>D7 (+7d)</code></strong>, and <strong><code>D21 (+21d)</code></strong>. Starting tomorrow, that chapter moves into <strong>Block 1 (Morning Review Queue)</strong>, while <strong>Block 2 (Main Study Block)</strong> opens <code>D0</code> (Phase 1) of your next chapter.</p>

      <h4>Exact Execution Protocol for Each Scheduled Phase 4 Milestone</h4>
      <ul>
        <li><strong><code>D1</code> — 1 Day After <code>D0</code> Done: Cued / Blank-Sheet Recall (15–20 Mins in Block 1 — <code>GPS Stage 5</code>):</strong>
          <ul>
            <li><em>Physics, Math &amp; Physical Chem:</em> Open your Obsidian Chapter API Table, cover the Formula, Units, Assumptions, and Traps columns (looking only at the Concept Name), and write the formulas, units, and sign rules from memory on blank paper. Any missed item is flagged <code>[X]</code> and turned into an Anki card immediately.</li>
            <li><em>Biology &amp; Inorganic:</em> Re-test your NCERT <code>[X]</code>/<code>[W]</code> margin flags, covered diagram labels, and covered table columns.</li>
            <li><em>Organic:</em> Cover the Reagents, Conditions, and Products columns of your Obsidian Reaction Table and write them from memory.</li>
          </ul>
        </li>
        <li><strong><code>D3</code> — 3 Days After <code>D0</code> Done: Queue Clearance + Unseen PYQ Stress Test (40–45 Mins in Block 1 — <code>GPS Stage 6</code>):</strong>
          <ul>
            <li><em>Part 1 (First 15 Mins — <code>[W]</code> &amp; <code>[X]</code> Queue Re-Test):</em> First, re-solve your <code>D0</code> <strong><code>[W]</code> Speed-Drill Queue</strong> under a strict stopwatch (if solved fast &amp; clean &rarr; promote to <code>[C]</code>; if slow or wrong again &rarr; <strong>Strike 2: mutates into <code>[X]</code></strong>). Second, run the <strong>1st Cold Re-Test</strong> of your <code>D0</code> <strong><code>[X]</code> Penalty Queue</strong> with zero notes open.</li>
            <li><em>Part 2 (Next 25–30 Mins — Unseen Recent PYQs):</em> Solve your <strong>Tier 3 Reserve of 20–30 unseen recent Chapter PYQs</strong> under strict exam timing with zero notes open. Grade every question <code>[C]</code>, <code>[W]</code>, or <code>[X]</code> and run any misses through the Error Diagnosis Matrix below.</li>
          </ul>
        </li>
        <li><strong><code>D7</code> — 7 Days After <code>D0</code> Done: Mandatory 2nd Cold Verification of <code>[X]</code> Queue (15–20 Mins in Block 1 — <code>GPS Stage 7</code>):</strong>
          <ul>
            <li>Re-solve every question in your <strong><code>[X]</code> Penalty Queue</strong> (including any <code>[W]</code> items that failed <code>D3</code> Strike 2 and any new <code>[X]</code> misses from <code>D3</code>) cold from scratch.</li>
            <li><em>Graduation Rule:</em> An <code>[X]</code> question only graduates to <code>[C]</code> when it passes cold on <strong>BOTH <code>D3</code> AND <code>D7</code></strong>. If you miss it on <code>D3</code> or <code>D7</code>, your initial fix failed—rewrite your 5-Line Fix Rule in Obsidian and keep it locked in <code>[X]</code>.</li>
          </ul>
        </li>
        <li><strong><code>D21</code> &amp; Post-<code>D21</code> Maintenance — Cumulative Mixed Mock &amp; 30% Reset Rule (<code>GPS Stages 8 &amp; 9</code>):</strong>
          <ul>
            <li>On <strong><code>D21</code> (21 days after <code>D0</code>)</strong>, take a 60–180 minute timed mixed test combining questions from all completed chapters.</li>
            <li><strong>What Happens After <code>D21</code>?</strong> Stop scheduling manual calendar reviews for the chapter. Two automated systems keep it alive permanently: (1) <strong>Daily Anki reviews</strong> in Block 1, and (2) <strong>Monthly Mixed Mocks</strong>.</li>
            <li><strong>The 30% Mock Error Reset Rule (<code>GPS Stage 9</code>):</strong> If you miss <strong>&gt;30% of the questions</strong> from any previously completed chapter during a <code>D21</code> or monthly mock, that chapter loses its completed status and resets to <code>Stage 9</code> (triggering <code>RESET-D1</code> &rarr; <code>RESET-D3</code> &rarr; <code>RESET-D7</code> on your calendar).</li>
          </ul>
        </li>
      </ul>

    <!-- PART V & VI: FOCUS ARCHITECTURE & EXAM HALL TACTICAL META-GAME -->
    <h2 id="sec-focus">7. Focus Architecture &amp; Exam Hall Tactical Meta-Game</h2>
    <div class="tactical-grid">
      <div class="tactical-card">
        <h4>The Later Queue Parking Pad</h4>

      </div>
      <div class="tactical-card">
        <h4>The 3-Outlier Acceptance Rule</h4>

      </div>

        <h4>5-Second Fact Cutoff (Bio &amp; Inorganic)</h4>

function getCalendarHTML() {
  const evs = buildAutoEvents();
  const todayStr = offsetDate(0);
  const viewDate = new Date();
  viewDate.setDate(1);
  viewDate.setMonth(viewDate.getMonth() + (state.calMonthOffset || 0));
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const monthName = viewDate.toLocaleString("en-US", { month: "long", year: "numeric" });
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  let cells = "";
  ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].forEach(d => {
    cells += `<div style="font-weight:700;text-align:center;padding:4px;background:var(--bg-alt);border:1px solid var(--border);">${d}</div>`;
  });
  for (let i = 0; i < firstDow; i++) {
    cells += `<div class="cal-cell" style="opacity:0.35;"></div>`;
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const dStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const dayEvs = evs.filter(e => e.date === dStr);
    cells += `
      <div class="cal-cell ${dStr === todayStr ? "today" : ""}">
        <div class="cal-date">${d} ${dStr === todayStr ? "[TODAY]" : ""}</div>
        ${dayEvs.map(e => `
          <div class="cal-ev ${e.done ? "done" : ""}" title="${e.chName}: ${e.label} (Click to toggle complete)" onclick="toggleEventDone('${e.id}', '${e.chId}', ${e.targetStage})">
            [${e.code}] ${e.chName}
          </div>
        `).join("")}
      </div>`;
  }

  return `
  <div>
    <h1>Auto-Scheduled Spaced Retrieval Calendar (D0 / D1 / D3 / D7 / D21)</h1>
    <p>Whenever a chapter reaches <strong>Stage 4 (D0 Complete)</strong> or has a D0 date assigned, its <code>D1 (+1d)</code>, <code>D3 (+3d)</code>, <code>D7 (+7d)</code>, and <code>D21 (+21d)</code> reviews are automatically scheduled below.</p>
    
    <div class="box">
      <div class="box-header flex-row" style="justify-content:space-between;">
        <div class="flex-row">
          <button onclick="shiftCalMonth(-1)">&lt; Prev Month</button>
          <span><strong>${monthName.toUpperCase()}</strong></span>
          <button onclick="shiftCalMonth(1)">Next Month &gt;</button>
          <button onclick="shiftCalMonth(0, true)">Today (${todayStr})</button>
        </div>
        <div class="flex-row">
          <button onclick="clearPastEvents()">Clear Past Events (&lt; Today)</button>
          <button onclick="resetCalendarMarkings()">Reset Markings to Chapter Status</button>
          <button onclick="clearAllScheduledDates()">Clear All Scheduled Dates</button>
        </div>
      </div>
      <div class="cal-grid">${cells}</div>
    </div>

    <div class="box">

function getMiniCalendarHTML(evs, todayStr) {
  const d = new Date();
  const year = d.getFullYear();
  const month = d.getMonth();
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  let cells = "";
  ["S", "M", "T", "W", "T", "F", "S"].forEach(day => {
    cells += `<div style="font-weight:700;text-align:center;padding:2px;font-size:10px;background:var(--bg-alt);">${day}</div>`;
  });
  for (let i = 0; i < firstDow; i++) {
    cells += `<div style="opacity:0.25;min-height:22px;"></div>`;
  }
  for (let day = 1; day <= daysInMonth; day++) {
    const dStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    const count = evs.filter(e => e.date === dStr).length;
    const isToday = dStr === todayStr;
    cells += `
      <div style="border:1px solid var(--border);${isToday ? "border:2px solid var(--border-dark);font-weight:700;" : ""}padding:2px;min-height:24px;background:${count ? "var(--hl)" : "transparent"};font-size:10px;cursor:pointer;" onclick="switchTab('calendar')">
        ${day}${count ? `<span style="float:right;font-size:8.5px;">[${count}]</span>` : ""}
      </div>`;
  }
  return `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;font-family:var(--font-mono);">${cells}</div>`;
}

function updateChapterStage(chId, newStage) {
  const ch = state.chapters.find(c => c.id === chId);

  ch.stage = Number(newStage);
  if (ch.stage >= 4 && !ch.d0) {
    ch.d0 = offsetDate(0);
  }
  if (ch.stage === 0) {
    ch.d0 = ""; // Clean up D0 date when chapter is set back to 0
  }
  saveAllStorage();
  renderWorkspace();
}

function updateChapterD0(chId, dateVal) {
  const ch = state.chapters.find(c => c.id === chId);
  if (!ch) return;
  ch.d0 = dateVal;
  if (!dateVal && ch.stage >= 4) {
    ch.stage = 0;
  } else if (dateVal && ch.stage < 4) {
    ch.stage = 4;
  }
  saveAllStorage();
  renderWorkspace();
}

function updateChapterAcc(chId, val) {
  const ch = state.chapters.find(c => c.id === chId);

  ch.acc = Number(val);
  saveAllStorage();
  renderWorkspace();
}

  const ch = state.chapters.find(c => c.id === chId);

  ch.wx = val;

function addChapter() {
  const subj = document.getElementById("newChSubj").value;
  const name = document.getElementById("newChName").value.trim();
  const type = document.getElementById("newChType").value;
  const cat = document.getElementById("newChCat").value;
  if (!name) return;
  const id = "ch_" + Date.now();
  state.chapters.push({ id, subj, name, type, cat, stage: 0, d0: "", acc: 0, wx: "" });
  state.selectedChapterId = id;
  saveAllStorage();
  renderWorkspace();
}

function deleteChapter(chId) {
  state.chapters = state.chapters.filter(c => c.id !== chId);
  if (state.selectedChapterId === chId && state.chapters.length) {
    state.selectedChapterId = state.chapters[0].id;
  }
  saveAllStorage();
  renderWorkspace();
}

function toggleEventDone(evId, chId, targetStage) {
  const ch = state.chapters.find(c => c.id === chId);
  if (state.completedEvents[evId]) {
    delete state.completedEvents[evId];
  } else {
    state.completedEvents[evId] = true;
    if (ch && ch.stage < targetStage) ch.stage = targetStage;
  }
  saveAllStorage();
  renderWorkspace();
}

function deleteCalendarEvent(evId) {
  state.deletedEvents = state.deletedEvents || {};
  state.deletedEvents[evId] = true;
  saveAllStorage();
  renderWorkspace();
}

function clearPastEvents() {
  const today = offsetDate(0);
  const evs = buildAutoEvents();
  state.deletedEvents = state.deletedEvents || {};
  let count = 0;
  evs.forEach(e => {
    if (e.date < today) {
      state.deletedEvents[e.id] = true;
      count++;
    }
  });
  saveAllStorage();
  renderWorkspace();
}

function resetCalendarMarkings() {
  state.completedEvents = {};
  state.deletedEvents = {};
  state.chapters.forEach(ch => {
    if (ch.stage === 0) ch.d0 = "";
  });
  saveAllStorage();
  renderWorkspace();
}

function clearAllScheduledDates() {
  if (confirm("Clear all scheduled D0 dates and reset active chapter stages to 0?")) {
    state.chapters.forEach(ch => {
      ch.stage = 0;
      ch.d0 = "";
      ch.acc = 0;
      ch.wx = "";
    });
    state.completedEvents = {};
    state.deletedEvents = {};

function openConceptModal(key) {

    <p style="font-size:13px;margin-bottom:12px;">${item.body}</p>
    <div class="flex-row">
      <button onclick="jumpToManualSection('${item.section}')">Open Section in Full Manual</button>
      <button onclick="closeModal()">Close</button>
    </div>`;
  document.getElementById("conceptModal").style.display = "flex";
}

function closeModal() {
  document.getElementById("conceptModal").style.display = "none";
}

function jumpToManualSection(secId) {
  closeModal();
  state.panes[0] = "manual";
  saveAllStorage();
  renderWorkspace();
  setTimeout(() => {
    const el = document.getElementById(secId);
    if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "start" });
  }, 50);
}

function performGlobalSearch(query) {
  query = query.trim().toLowerCase();
  if (!query) return;
  let matches = [];
  
  Object.keys(CONCEPTS).forEach(k => {
    const item = CONCEPTS[k];
    if (item.title.toLowerCase().includes(query) || item.body.toLowerCase().includes(query)) {
      matches.push({ type: "Concept", title: item.title, action: () => openConceptModal(k) });
    }
  });

  FAQS.forEach((f, idx) => {
    if (f.q.toLowerCase().includes(query) || f.a.toLowerCase().includes(query)) {
      matches.push({ type: "FAQ", title: f.q, action: () => switchTab("faq") });
    }
  });

  state.chapters.forEach(c => {
    if (c.name.toLowerCase().includes(query) || c.subj.toLowerCase().includes(query)) {
      matches.push({ type: "Chapter", title: `[${c.subj}] ${c.name}`, action: () => selectChapterAndOpenFlow(c.id) });
    }
  });

  if (!matches.length) {
    alert("No exact matches found for: " + query);
    return;
  }
  
  const body = matches.slice(0, 10).map((m, idx) => `
    <div style="border-bottom:1px solid var(--border);padding:6px 0;display:flex;justify-content:space-between;align-items:center;">
      <div><span class="tag">${m.type}</span><strong>${m.title}</strong></div>
      <button onclick="globalSearchResults[${idx}].action();closeModal();">Open</button>
    </div>
  `).join("");
  
  window.globalSearchResults = matches;
  document.getElementById("modalTitle").textContent = `Search Results (${matches.length})`;
  document.getElementById("modalBody").innerHTML = body;
  document.getElementById("conceptModal").style.display = "flex";
}

function makeCRC32Table() {
  const cTable = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) {
      c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    }
    cTable[n] = c >>> 0;
  }
  return cTable;
}
const CRC32_TABLE = makeCRC32Table();

function crc32(uint8Array) {
  let crc = 0 ^ (-1);
  for (let i = 0; i < uint8Array.length; i++) {
    crc = (crc >>> 8) ^ CRC32_TABLE[(crc ^ uint8Array[i]) & 0xFF];
  }
  return (crc ^ (-1)) >>> 0;
}

function createZipArchive(files) {
  let localHeaders = [];
  let centralHeaders = [];
  let offset = 0;

  files.forEach(file => {
    const nameBytes = new TextEncoder().encode(file.name);
    const dataBytes = file.data;
    const fileCrc = crc32(dataBytes);
    const size = dataBytes.length;

    const lh = new Uint8Array(30 + nameBytes.length + size);
    const lView = new DataView(lh.buffer);
    lView.setUint32(0, 0x04034b50, true);
    lView.setUint16(4, 20, true);
    lView.setUint16(6, 0, true);
    lView.setUint16(8, 0, true);
    lView.setUint16(10, 0, true);
    lView.setUint16(12, 0, true);
    lView.setUint32(14, fileCrc, true);
    lView.setUint32(18, size, true);
    lView.setUint32(22, size, true);
    lView.setUint16(26, nameBytes.length, true);
    lView.setUint16(28, 0, true);
    lh.set(nameBytes, 30);
    lh.set(dataBytes, 30 + nameBytes.length);
    localHeaders.push(lh);

    const ch = new Uint8Array(46 + nameBytes.length);
    const cView = new DataView(ch.buffer);
    cView.setUint32(0, 0x02014b50, true);
    cView.setUint16(4, 20, true);
    cView.setUint16(6, 20, true);
    cView.setUint16(8, 0, true);
    cView.setUint16(10, 0, true);
    cView.setUint16(12, 0, true);
    cView.setUint16(14, 0, true);
    cView.setUint32(16, fileCrc, true);
    cView.setUint32(20, size, true);
    cView.setUint32(24, size, true);
    cView.setUint16(28, nameBytes.length, true);
    cView.setUint16(30, 0, true);
    cView.setUint16(32, 0, true);
    cView.setUint16(34, 0, true);
    cView.setUint16(36, 0, true);
    cView.setUint32(38, 0, true);
    cView.setUint32(42, offset, true);
    ch.set(nameBytes, 46);
    centralHeaders.push(ch);

    offset += lh.length;
  });

  const centralOffset = offset;
  let centralSize = 0;
  centralHeaders.forEach(ch => centralSize += ch.length);

  const eocd = new Uint8Array(22);
  const eView = new DataView(eocd.buffer);
  eView.setUint32(0, 0x06054b50, true);
  eView.setUint16(4, 0, true);
  eView.setUint16(6, 0, true);
  eView.setUint16(8, files.length, true);
  eView.setUint16(10, files.length, true);
  eView.setUint32(12, centralSize, true);
  eView.setUint32(16, centralOffset, true);
  eView.setUint16(20, 0, true);

  const totalLength = centralOffset + centralSize + 22;
  const out = new Uint8Array(totalLength);
  let pos = 0;
  localHeaders.forEach(lh => { out.set(lh, pos); pos += lh.length; });
  centralHeaders.forEach(ch => { out.set(ch, pos); pos += ch.length; });
  out.set(eocd, pos);
  return out;
}

function exportBackupZip() {
  const enc = new TextEncoder();
  const stateJsonStr = JSON.stringify(state, null, 2);
  const csvStr = "ID,Subject,Chapter,Type,Category,Stage,D0_Date,Accuracy,WX_Log\n" +
    state.chapters.map(c => `"${c.id}","${c.subj}","${c.name.replace(/"/g, '""')}","${c.type}","${c.cat}",${c.stage},"${c.d0}",${c.acc},"${(c.wx || "").replace(/"/g, '""')}"`).join("\n");
  
  const manualArea = document.getElementById("manualContent");
  const manualText = manualArea ? manualArea.innerText : "STEM Study & Exam Execution Manual";

  const files = [
    { name: "state.json", data: enc.encode(stateJsonStr) },
    { name: "chapters.csv", data: enc.encode(csvStr) },
    { name: "manual.txt", data: enc.encode(manualText) }
  ];

  const zipBytes = createZipArchive(files);
  const blob = new Blob([zipBytes], { type: "application/zip" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `ab_stem_backup_${offsetDate(0)}.zip`;
  a.click();
}

async function importBackupFile() {
  const input = document.getElementById("backupFileInput");
  const msg = document.getElementById("importMsg");
  if (!input || !input.files || !input.files[0]) {
    if (msg) msg.textContent = "Please select a file first.";
    return;
  }
  const file = input.files[0];
  try {
    if (file.name.endsWith(".json")) {
      const text = await file.text();
      const parsed = JSON.parse(text);
      if (Array.isArray(parsed.chapters)) {
        state = Object.assign({}, state, parsed);
        await saveAllStorage();
        renderWorkspace();
        if (msg) msg.textContent = "RESTORED STATE.JSON SUCCESSFULLY!";
        return;
      }
    } else if (file.name.endsWith(".zip")) {
      const buf = await file.arrayBuffer();
      const bytes = new Uint8Array(buf);
      const str = new TextDecoder("utf-8", { fatal: false }).decode(bytes);
      const startTag = '{"theme"';
      const idx = str.indexOf(startTag);
      if (idx !== -1) {
        let depth = 0, endIdx = -1;
        for (let i = idx; i < str.length; i++) {
          if (str[i] === '{') depth++;
          else if (str[i] === '}') {
            depth--;
            if (depth === 0) { endIdx = i + 1; break; }
          }
        }
        if (endIdx !== -1) {
          const parsed = JSON.parse(str.slice(idx, endIdx));
          state = Object.assign({}, state, parsed);
          await saveAllStorage();
          renderWorkspace();
          if (msg) msg.textContent = "RESTORED FROM BACKUP.ZIP SUCCESSFULLY!";
          return;
        }
      }
      throw new Error("Could not find valid JSON state within ZIP archive.");
    }
  } catch (err) {
    if (msg) msg.textContent = "IMPORT FAILED: " + err.message;
  }
}

}
